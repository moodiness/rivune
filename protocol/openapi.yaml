          description: Library entry removed or already absent.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /progress/{titleId}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getPlaybackProgress
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current playback progress for the selected profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgress"
        "204":
          description: The selected profile has not started this title yet.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    put:
      operationId: updatePlaybackProgress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaybackProgressRequest"
      responses:
        "200":
          description: Updated playback progress with its new synchronization version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgress"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearPlaybackProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "204":
          description: Playback progress removed.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /titles/{titleId}/watched:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    post:
      operationId: markTitleWatched
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Title marked as watched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgress"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: markTitleUnwatched
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Title marked as unwatched and reset to the beginning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgress"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /continue-watching:
    get:
      operationId: listContinueWatching
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Resumable titles and suggested next episodes for the selected profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueWatchingPage"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    setupToken:
      type: http
      scheme: bearer
      description: One-time bootstrap secret configured by the server administrator.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived opaque Rivune access token.
    playbackToken:
      type: apiKey
      in: query
      name: token
      description: Opaque short-lived token returned only inside playback asset URLs.
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TitleId:
      name: titleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddonId:
      name: addonId
      in: path
      required: true
      description: Profile-local installed addon identifier.
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddonResource:
      name: resource
      in: path
      required: true
      description: Exact Stremio resource name, including custom resource names.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AddonContentType:
      name: type
      in: path
      required: true
      description: Exact opaque Stremio content type; not restricted to built-in types.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AddonResourceId:
      name: id
      in: path
      required: true
      description: Exact opaque addon catalog, metadata, video, stream, or subtitle identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 8192
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
    CollectionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Language:
      name: language
      in: query
      description: BCP 47 language tag used for localized metadata.
      schema:
        type: string
        pattern: "^[A-Za-z]{2,3}(-[A-Za-z]{2})?$"
        default: en-US
    Region:
      name: region
      in: query
      description: Optional ISO 3166-1 alpha-2 region.
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
    ExpectedVersion:
      name: expectedVersion
      in: query
      description: Last synchronization version observed by the client, or zero when no state exists.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    InstallAddonInput:
      type: object
      additionalProperties: false
      required: [transportUrl]
      properties:
        transportUrl:
          type: string
          format: uri
          description: >
            Modern Stremio HTTP(S) transport URL. A root URL is normalized to
            manifest.json and a stremio:// install URL is normalized to HTTPS.
        profileIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Profiles receiving the addon. Defaults to the active profile when omitted.
          items:
            type: string
            format: uuid
    UpdateAddonInput:
      type: object
      additionalProperties: false
      required: [transportUrl, profileIds]
      properties:
        transportUrl:
          type: string
          format: uri
          description: >
            Modern Stremio HTTP(S) transport URL. A root URL is normalized to
            manifest.json and a stremio:// install URL is normalized to HTTPS.
        profileIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReorderAddonsInput:
      type: object
      additionalProperties: false
      required: [addonIds]
      properties:
        addonIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    AddonList:
      type: object
      additionalProperties: false
      required: [addons]
      properties:
        addons:
          type: array
          items:
            $ref: "#/components/schemas/InstalledAddon"
    InstalledAddon:
      type: object
      additionalProperties: false
      required: [id, transportUrl, manifest, position, profileIds, installedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        transportUrl:
          type: string
          format: uri
        manifest:
          $ref: "#/components/schemas/StremioManifest"
        position:
          type: integer
          minimum: 0
        profileIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        installedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StremioManifest:
      type: object
      additionalProperties: true
      required: [id, version, name, types, resources]
      properties:
        id:
          type: string
        version:
          type: string
          description: Semantic version declared by the addon.
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string
        logo:
          type: string
          format: uri
        background:
          type: string
          format: uri
        types:
          type: array
          description: Arbitrary content types; movie and series are not special-cased.
          items:
            type: string
        resources:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/StremioManifestResource"
        idPrefixes:
          type: array
          description: Optional global opaque ID-prefix filters.
          items:
            type: string
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/StremioManifestCatalog"
        addonCatalogs:
          type: array
          items:
            $ref: "#/components/schemas/StremioManifestCatalog"
        config:
          type: array
          items:
            type: object
            additionalProperties: true
        behaviorHints:
          type: object
          additionalProperties: true
          properties:
            adult:
              type: boolean
            p2p:
              type: boolean
            configurable:
              type: boolean
            configurationRequired:
              type: boolean
    StremioManifestResource:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
        types:
          type: array
          items:
            type: string
        idPrefixes:
          type: array
          items:
            type: string
    StremioManifestCatalog:
      type: object
      additionalProperties: true
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
        genres:
          type: array
          deprecated: true
          items:
            type: string
        extra:
          type: array
          items:
            $ref: "#/components/schemas/StremioExtraProperty"
        extraRequired:
          type: array
          deprecated: true
          items:
            type: string
        extraSupported:
          type: array
          deprecated: true
          items:
            type: string
    StremioExtraProperty:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
        isRequired:
          type: boolean
          default: false
        options:
          type: array
          items:
            type: string
        optionsLimit:
          type: integer
          minimum: 0
          default: 1
    AddonCatalogDescriptorList:
      type: object
      additionalProperties: false
      required: [catalogs]
      properties:
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/AddonCatalogDescriptor"
    AddonCatalogDescriptor:
      type: object
      additionalProperties: false
      required: [addonId, manifestId, position, catalog, addonCatalog]
      properties:
        addonId:
          type: string
          format: uuid
        manifestId:
          type: string
        position:
          type: integer
          minimum: 0
        catalog:
          $ref: "#/components/schemas/StremioManifestCatalog"
        addonCatalog:
          type: boolean
    AddonCachePolicy:
      type: object
      additionalProperties: false
      properties:
        maxAgeSeconds:
          type: integer
          format: int64
          minimum: 0
        staleWhileRevalidateSeconds:
          type: integer
          format: int64
          minimum: 0
        staleIfErrorSeconds:
          type: integer
          format: int64
          minimum: 0
    AddonResourceResult:
      type: object
      additionalProperties: false
      required: [addonId, manifestId, transportUrl, resource, type, id, payload, cache]
      properties:
        addonId:
          type: string
          format: uuid
        manifestId:
          type: string
        transportUrl:
          type: string
          format: uri
        resource:
          type: string
        type:
          type: string
        id:
          type: string
          description: Exact opaque content or video ID sent to the addon.
        payload:
          type: object
          additionalProperties: true
          description: >
            Unmodified Stremio response object. This supports metas,
            metasDetailed, meta, streams, subtitles, addons, embedded streams,
            unknown forward-compatible fields, and SDK cache fields.
        cache:
          $ref: "#/components/schemas/AddonCachePolicy"
    AddonResourceFailure:
      type: object
      additionalProperties: false
      required: [addonId, manifestId, code, message]
      properties:
        addonId:
          type: string
          format: uuid
        manifestId:
          type: string
        code:
          type: string
        message:
          type: string
    AddonResourceBatch:
      type: object
      additionalProperties: false
      required: [results, errors]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/AddonResourceResult"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AddonResourceFailure"
    Discovery:
      type: object
      required: [name, serverVersion, protocolVersion, apiBaseUrl, setupRequired]
      properties:
        name:
          type: string
        serverVersion:
          type: string
        protocolVersion:
          type: integer
          minimum: 1
        apiBaseUrl:
          type: string
        setupRequired:
          type: boolean
    Health:
      type: object
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
    SetupRequest:
      type: object
      additionalProperties: false
      required: [instanceName, admin, profileName]
      properties:
        instanceName:
          type: string
          minLength: 1
          maxLength: 80
        admin:
          type: object
          additionalProperties: false
          required: [username, password]
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 64
            password:
              type: string
              minLength: 12
              maxLength: 256
        profileName:
          type: string
          minLength: 1
          maxLength: 80
    SetupResponse:
      type: object
      required: [instance, admin, profile]
      properties:
        instance:
          $ref: "#/components/schemas/Identifier"
        admin:
          $ref: "#/components/schemas/Identifier"
        profile:
          $ref: "#/components/schemas/Identifier"
    Identifier:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, device]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
        device:
          type: object
          additionalProperties: false
          required: [name, platform]
          properties:
            id:
              type: string
              format: uuid
              description: Existing device ID previously returned to this user.
            name:
              type: string
              minLength: 1
              maxLength: 120
            platform:
              type: string
              minLength: 1
              maxLength: 32
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required:
        - tokenType
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - sessionId
        - deviceId
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          description: Short-lived opaque token. Store it only in platform-secure storage.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Single-use opaque token rotated on every refresh.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
    Account:
      type: object
      required: [user, session, profiles]
      properties:
        user:
          type: object
          required: [id, username, role]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            role:
              type: string
              enum: [admin, member]
        session:
          type: object
          required: [id, deviceId, activeProfile]
          properties:
            id:
              type: string
              format: uuid
            deviceId:
              type: string
              format: uuid
            activeProfile:
              anyOf:
                - $ref: "#/components/schemas/ActiveProfileGrant"
                - type: "null"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Session:
      type: object
      required: [id, deviceId, deviceName, platform, ipAddress, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          type: string
        ipAddress:
          type: [string, "null"]
          description: Last observed client IP address, or null until the session makes a request after this field becomes available.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
    ProfileSessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSession"
    ProfileSession:
      type: object
      additionalProperties: false
      required: [id, userId, username, deviceId, deviceName, platform, ipAddress, createdAt, lastSeenAt, profileGrantExpiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          type: string
        ipAddress:
          type: [string, "null"]
          description: Last observed client IP address, or null until the session makes a request after this field becomes available.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        profileGrantExpiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    SessionNotificationList:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/SessionNotification"
    SessionNotification:
      type: object
      additionalProperties: false
      required: [id, message, senderUsername, createdAt]
      properties:
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Positive decimal identifier encoded as a string to preserve 64-bit precision.
        message:
          type: string
          minLength: 1
          maxLength: 500
        senderUsername:
          type: string
        createdAt:
          type: string
          format: date-time
    SessionNotificationInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      required: [id, name, isChild, hasPin, canManage, enabled, availableFrom, availableUntil, accessStartTime, accessEndTime, accessTimezone, accessible, avatar]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isChild:
          type: boolean
        hasPin:
          type: boolean
        canManage:
          type: boolean
        enabled:
          type: boolean
        availableFrom:
          description: First available local date, inclusive, or null.
          anyOf:
            - type: string
              format: date
            - type: "null"
        availableUntil:
          description: Last available local date, inclusive, or null.
          anyOf:
            - type: string
              format: date
            - type: "null"
        accessStartTime:
          description: Start-inclusive daily local time, or null when unrestricted.
          anyOf:
            - type: string
              pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
        accessEndTime:
          description: End-exclusive daily local time; may be earlier than the start for an overnight range.
          anyOf:
            - type: string
              pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
        accessTimezone:
          type: string
          description: IANA timezone used to evaluate date and daily-hour restrictions.
        accessible:
          type: boolean
          description: Current server-evaluated availability. Clients must not treat this as enforcement.
        avatar:
          $ref: "#/components/schemas/ProfileAvatar"
    ProfileAvatar:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [preset, custom]
        presetId:
          type: string
          description: Present when kind is preset.
        url:
          type: string
          description: Server-relative URL for the current avatar image.
    ProfileAvatarPresetList:
      type: object
      required: [presets]
      properties:
        presets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProfileAvatarPreset"
    ProfileAvatarPreset:
      type: object
      required: [id, name, url]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    SetProfileAvatarPresetRequest:
      type: object
      additionalProperties: false
      required: [presetId]
      properties:
        presetId:
          type: string
          minLength: 1
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        isChild:
          type: boolean
          default: false
        pin:
          type: string
          pattern: "^[0-9]{4,8}$"
        enabled:
          type: boolean
          default: true
        availableFrom:
          anyOf:
            - type: string
              format: date
            - type: "null"
        availableUntil:
          anyOf:
            - type: string
              format: date
            - type: "null"
        accessStartTime:
          anyOf:
            - type: string
              pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
        accessEndTime:
          anyOf:
            - type: string
              pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
        accessTimezone:
          description: IANA timezone, or null/omitted to use UTC.
          anyOf:
            - type: string
            - type: "null"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        isChild:
          type: boolean
        pin:
          description: A 4-8 digit PIN, or null to remove the current PIN.
          anyOf:
            - type: string
              pattern: "^[0-9]{4,8}$"
            - type: "null"
        enabled:
          type: boolean
        availableFrom:
          anyOf:
            - type: string
              format: date
            - type: "null"
        availableUntil:
          anyOf:
            - type: string
              format: date
            - type: "null"
        accessStartTime:
          anyOf:
            - type: string
              pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
            - type: "null"
        accessEndTime:
