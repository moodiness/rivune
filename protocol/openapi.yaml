openapi: 3.1.0
info:
  title: Rivune API
  version: 1.3.0
  description: Protocol between Rivune clients and a self-hosted Rivune Server.
servers:
  - url: /api/v1
paths:
  /.well-known/rivune:
    get:
      operationId: discoverServer
      servers:
        - url: /
      responses:
        "200":
          description: Server identity and compatibility information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
  /health:
    get:
      operationId: getHealth
      servers:
        - url: /
      responses:
        "200":
          description: The server and database are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          description: Current setup state.
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired:
                    type: boolean
  /setup:
    post:
      operationId: initializeServer
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The instance, administrator, and first profile were created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A new device session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Both access and refresh tokens were rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The current session was revoked.
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getCurrentAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user and accessible profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions belonging to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Error"
  /auth/notifications:
    get:
      operationId: listSessionNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          description: Return notifications with an identifier greater than this non-negative decimal cursor, which must not exceed 9223372036854775807.
          schema:
            type: string
            pattern: "^[0-9]+$"
            default: "0"
      responses:
        "200":
          description: Pending notifications addressed to the authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotificationList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The selected session was revoked.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/sessions:
    get:
      operationId: listProfileSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Active devices currently using the managed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSessionList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/sessions/{sessionId}:
    delete:
      operationId: revokeProfileSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The device session was revoked and can no longer use the profile.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/sessions/{sessionId}/notifications:
    post:
      operationId: sendProfileSessionNotification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNotificationInput"
      responses:
        "201":
          description: Notification queued for the active device session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotification"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /profile-avatars:
    get:
      operationId: listProfileAvatarPresets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Original profile avatar presets bundled with Rivune.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAvatarPresetList"
        "401":
          $ref: "#/components/responses/Error"
  /profile-avatars/{presetId}:
    parameters:
      - name: presetId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProfileAvatarPresetImage
      security: []
      responses:
        "200":
          description: Immutable SVG image for a bundled profile avatar.
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        "404":
          description: Unknown avatar preset.
  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getCustomProfileAvatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Normalized PNG for the profile's custom avatar.
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
                contentMediaType: image/png
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: uploadCustomProfileAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  contentEncoding: binary
                  description: PNG or JPEG, 64-4096 pixels, at most 2 MiB.
      responses:
        "200":
          description: Profile now using its normalized custom avatar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/avatar/preset:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfileAvatarPreset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProfileAvatarPresetRequest"
      responses:
        "200":
          description: Profile now using the selected bundled avatar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /profiles:
    get:
      operationId: listProfiles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profiles accessible to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: A profile was created with access granted to the administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    patch:
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: The profile was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfile
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The profile was deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/select:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: selectProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectProfileRequest"
      responses:
        "200":
          description: The profile is active for the current session until the grant expires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSelection"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /profiles/selection:
    delete:
      operationId: clearProfileSelection
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The active profile was cleared from the current session.
        "401":
          $ref: "#/components/responses/Error"
  /settings:
    get:
      operationId: getInstanceSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Instance-level setting overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsLayer"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateInstanceSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Instance settings were updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsLayer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/settings:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfileSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile-level setting overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsLayer"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProfileSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Profile settings were updated by a user with access to the profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsLayer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/settings/effective:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getEffectiveSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server defaults and profile overrides merged for the selected profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveSettings"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/device-code:
    post:
      operationId: beginDeviceAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "201":
          description: A short-lived TV or device authorization was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /auth/device-code/token:
    post:
      operationId: exchangeDeviceAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodeTokenRequest"
      responses:
        "200":
          description: Authorization completed and a device session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/device-code/approve:
    post:
      operationId: approveDeviceAuthorization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodeApprovalRequest"
      responses:
        "204":
          description: The device was approved by the active manager profile for the authenticated account.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users on the instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The user was updated. Password or role changes revoke all of their sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The user, their sessions, and their devices were deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /users/{userId}/profiles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: listUserProfileAccess
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every profile and the selected user's explicit access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAccessList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /users/{userId}/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: grantUserProfileAccess
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileAccessRequest"
      responses:
        "200":
          description: Profile access was granted or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileAccess"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeUserProfileAccess
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The user's explicit profile access was revoked.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /addons:
    get:
      operationId: listAddons
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Installed Stremio addon descriptors in profile priority order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddonList"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    post:
      operationId: installAddon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallAddonInput"
      responses:
        "201":
          description: The configured addon transport was installed for the active profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledAddon"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /addons/order:
    put:
      operationId: reorderAddons
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAddonsInput"
      responses:
        "200":
          description: Installed addons in their new priority order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddonList"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /addons/{addonId}:
    parameters:
      - $ref: "#/components/parameters/AddonId"
    put:
      operationId: updateAddon
      description: Replaces the configured transport, manifest, and profile assignments while preserving addon identity and profile order.
      security:
        - bearerAuth: []
      requestBody:
        required: true
