        accessStartTime:
          anyOf:
            - type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
        accessEndTime:
          anyOf:
            - type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        categoryId:
