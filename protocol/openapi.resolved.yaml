openapi: 3.1.0
info:
  title: Rivune API
  version: 1.6.0
  description: |
    Protocol version 20 between Rivune clients and a self-hosted Rivune Server. While global maintenance mode is enabled, authenticated non-admin application operations return the reusable 503 MaintenanceMode response. Authentication, session recovery, health, discovery, and administrator operations remain available.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
paths:
  /.well-known/rivune:
    get:
      summary: Discover server
      operationId: discoverServer
      security: []
      servers:
        - url: /
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Server identity and compatibility information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
        '400':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The HTTP request was malformed.
        default:
          $ref: '#/components/responses/Error'
  /health:
    get:
      summary: Check server health
      description: Reports whether Rivune can reach PostgreSQL and is ready to serve application traffic. Retained as the protocol-v20 readiness route.
      operationId: getHealth
      security: []
      servers:
        - url: /
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The server and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The HTTP request was malformed.
        '503':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /live:
    get:
      summary: Check server liveness
      description: Reports whether the Rivune HTTP process is alive without checking external dependencies.
      operationId: getLiveness
      security: []
      servers:
        - url: /
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The server process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        '400':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The HTTP request was malformed.
        default:
          $ref: '#/components/responses/Error'
  /ready:
    get:
      summary: Check server readiness
      description: Reports whether the server can reach PostgreSQL and is ready to serve application traffic.
      operationId: getReadiness
      security: []
      servers:
        - url: /
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The server and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The HTTP request was malformed.
        '503':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /setup/status:
    get:
      summary: Get setup status
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Current setup state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - setupRequired
                properties:
                  setupRequired:
                    type: boolean
                  setupCompleted:
                    type: boolean
                    description: Whether server setup has completed. Always emitted by current servers but optional for pre-v18 compatibility.
                  demoAvailable:
                    type: boolean
                    description: Whether a pre-setup demonstration session may be started. Always emitted by current servers but optional for pre-v18 compatibility.
        '400':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The HTTP request was malformed.
        default:
          $ref: '#/components/responses/Error'
  /setup:
    post:
      summary: Initialize server
      operationId: initializeServer
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The instance, administrator, and first profile were created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/DemoForbidden'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /demo/sessions:
    post:
      summary: Start a pre-setup demonstration session
      description: Available only while server setup is incomplete. The session secret is returned solely in the HttpOnly rivune_demo cookie.
      operationId: createDemoSession
      security: []
      responses:
        '201':
          description: A fresh isolated demonstration session with Alex selected as the active profile.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Opaque 8-hour demonstration session cookie with HttpOnly, SameSite=Strict, and Path=/api/v1; Secure for direct or forwarded HTTPS requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionResponse'
        '403':
          $ref: '#/components/responses/DemoOriginRejected'
        '410':
          $ref: '#/components/responses/DemoUnavailable'
        '429':
          $ref: '#/components/responses/DemoSessionLimit'
        default:
          $ref: '#/components/responses/Error'
  /demo/session:
    get:
      summary: Resume a demonstration session
      operationId: getDemoSession
      security:
        - demoCookie: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The current demonstration account and session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionResponse'
        '401':
          $ref: '#/components/responses/DemoSessionInvalid'
        '410':
          $ref: '#/components/responses/DemoUnavailable'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Exit a demonstration session
      operationId: deleteDemoSession
      security:
        - demoCookie: []
      responses:
        '204':
          description: The demonstration session was invalidated and its cookie expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Expired rivune_demo cookie scoped to /api/v1.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/DemoSessionInvalid'
        '403':
          $ref: '#/components/responses/DemoOriginRejected'
        '410':
          $ref: '#/components/responses/DemoUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /demo/session/reset:
    post:
      summary: Reset a demonstration session
      description: Replaces only the calling session's in-memory state with the seed dataset and selects Alex.
      operationId: resetDemoSession
      security:
        - demoCookie: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The reset demonstration account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionResponse'
        '401':
          $ref: '#/components/responses/DemoSessionInvalid'
        '403':
          $ref: '#/components/responses/DemoOriginRejected'
        '410':
          $ref: '#/components/responses/DemoUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /demo/assets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of an embedded synthetic asset belonging to the demonstration dataset.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      - name: Range
        in: header
        required: false
        description: Optional single byte range for an embedded MP4 asset.
        schema:
          type: string
          pattern: ^bytes=([0-9]+-[0-9]*|-[0-9]+)$
    get:
      summary: Stream a demonstration asset
      operationId: streamDemoAsset
      security:
        - demoCookie: []
      responses:
        '200':
          description: A complete embedded synthetic video, subtitle, or artwork asset.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Accept-Ranges:
              description: Range unit supported by video assets.
              schema:
                type: string
                const: bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            text/vtt:
              schema:
                type: string
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '206':
          description: A byte range from an embedded synthetic MP4 asset.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Accept-Ranges:
              description: Range unit supported by the asset.
              required: true
              schema:
                type: string
                const: bytes
            Content-Range:
              description: Inclusive byte range and complete asset size.
              required: true
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/DemoSessionInvalid'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/DemoUnavailable'
        '416':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    head:
      summary: Inspect a demonstration asset
      operationId: inspectDemoAsset
      security:
        - demoCookie: []
      responses:
        '200':
          description: Headers for a complete embedded synthetic asset.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Accept-Ranges:
              description: Range unit supported by video assets.
              schema:
                type: string
                const: bytes
        '206':
          description: Headers for a byte range from an embedded synthetic MP4 asset.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Accept-Ranges:
              description: Range unit supported by the asset.
              required: true
              schema:
                type: string
                const: bytes
            Content-Range:
              description: Inclusive byte range and complete asset size.
              required: true
              schema:
                type: string
        '401':
          $ref: '#/components/responses/DemoSessionInvalid'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/DemoUnavailable'
        '416':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      summary: Log in
      description: |
        Administrator password login issues global_admin scope. Member password login copies category scope from the persisted device; device category values are never accepted as claims. Each user may retain at most 50 device identities; an already-owned device ID remains reusable at the limit.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: A new device session was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      summary: Refresh session
      description: Rotates credentials without changing the session's immutable authorization scope or category.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Both access and refresh tokens were rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      summary: Log out
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The current session was revoked.
        '401':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      summary: Get current account
      operationId: getCurrentAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: |
            The authenticated user, immutable server-issued session scope, and accessible profiles. global_admin sessions receive all intended profiles; category sessions are server-filtered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Error'
  /auth/sessions:
    get:
      summary: List sessions
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: |
            Active sessions visible to the authenticated principal. Category sessions receive only sessions for devices in their authoritative category; global administrators receive the intended global view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Error'
  /categories:
    get:
      summary: List access categories
      description: |
        Returns every server-owned access category in display order. This administration endpoint requires a global administrator session; a user role alone does not grant access.
      operationId: listCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: All access categories with current profile and device counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      summary: Create access category
      description: Requires a global administrator session.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The category was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: A category with the same normalized name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /categories/order:
    put:
      summary: Reorder access categories
      description: |
        Replaces the complete display order atomically. Requires a global administrator session and every existing category identifier exactly once.
      operationId: reorderCategories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCategoriesRequest'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Categories in their updated display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: Update access category
      description: Requires a global administrator session.
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The category was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: A category with the same normalized name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete access category
      description: |
        Requires a global administrator session. When the category has profiles or devices, reassignToCategoryId is required and every affected category-scoped session is revoked. Profile identifiers and profile-owned data are preserved.
      operationId: deleteCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCategoryRequest'
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The category was deleted and positions were compacted.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The default or final category cannot be deleted, or referenced resources require a reassignment destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /devices:
    get:
      summary: List approved devices
      description: |
        Lists server-owned approved devices, optionally filtered by category. Requires a global administrator session. categoryId is a filter to authorize server-side, never an authority claim.
      operationId: listDevices
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Approved devices ordered by most recent activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /devices/category-moves:
    post:
      summary: Move approved devices to an access category
      description: |
        Moves every supplied device atomically and revokes all sessions for those devices. Requires a global administrator session.
      operationId: moveDevicesToCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCategoryMoveRequest'
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: All devices were moved and their sessions revoked.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      summary: Update approved device
      description: |
        Updates display or administrative fields. Moving category revokes all sessions for this device. Requires a global administrator session.
      operationId: updateDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The updated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete approved device
      description: |
        Permanently deletes an approved device and cascades deletion to all of its sessions. The deletion and its device.deleted audit event are committed atomically. Requires a global administrator session.
      operationId: deleteDevice
      security:
        - bearerAuth: []
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The device and all of its sessions were deleted.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /profiles/category-moves:
    post:
      summary: Move profiles to an access category
      description: |
        Moves every supplied profile atomically without changing profile identifiers or owned data. Category sessions actively selecting a moved profile are revoked; global sessions have that selection cleared. Requires a global administrator session.
      operationId: moveProfilesToCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCategoryMoveRequest'
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: All profiles were moved and incompatible selections invalidated.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/notifications:
    get:
      summary: List session notifications
      operationId: listSessionNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          description: Return notifications with an identifier greater than this non-negative decimal cursor, which must not exceed 9223372036854775807.
          schema:
            type: string
            pattern: ^[0-9]+$
