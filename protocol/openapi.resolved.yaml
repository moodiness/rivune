          $ref: '#/components/responses/Error'
components:
  headers:
    RequestId:
      description: Safe request correlation token accepted from a restrictive ASCII allowlist or generated server-side from 16 cryptographically random bytes.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
  securitySchemes:
    setupToken:
      type: http
      scheme: bearer
      description: One-time bootstrap secret configured by the server administrator.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Short-lived opaque Rivune access token. Every session has immutable global_admin or category authorization scope. Only administrator password login may issue global_admin. Category identity is derived and revalidated from server-owned session and device state; client category fields are resource identifiers to authorize, never claims. Category moves revoke incompatible sessions. After profile selection, web clients must also present that selection's opaque X-Rivune-Profile-Context capability on authenticated requests other than authentication, profile listing, profile selection, and profile avatar reads.
    demoCookie:
      type: apiKey
      in: cookie
      name: rivune_demo
      description: Opaque pre-setup demonstration cookie issued with HttpOnly, SameSite=Strict, and Path=/api/v1; Secure for direct or forwarded HTTPS requests.
    playbackToken:
      type: apiKey
      in: query
      name: token
      description: Opaque short-lived token returned only inside playback asset URLs.
    calendarToken:
      type: apiKey
      in: query
      name: token
      description: |
        Long-lived opaque bearer secret embedded in a private calendar URL. Its rivune_cal_ prefixed value contains 32 bytes from a cryptographically secure random generator; the server persists only its SHA-256 digest and never logs or includes the token in an error. The complete secret is disclosed only when the subscription is created or rotated, is invalidated immediately by rotation or revocation, and must be the request's only query parameter with exactly one value. This credential is independent of bearerAuth.
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackingProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
          - trakt
          - simkl
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TitleId:
      name: titleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeasonId:
      name: seasonId
      in: path
      required: true
      description: Stable TMDB season UUID or an opaque TVDB mapped-season identifier returned by the series endpoint.
      schema:
        type: string
        pattern: ^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|tvdb:[0-9a-fA-F-]{36}:[1-9][0-9]*)$
    AddonId:
      name: addonId
      in: path
      required: true
      description: Profile-local installed addon identifier.
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddonResource:
      name: resource
      in: path
      required: true
      description: Exposable addon resource name. Stream and subtitle resources are available only through opaque playback APIs.
      schema:
        type: string
        enum:
          - catalog
          - addon_catalog
          - meta
    AddonContentType:
      name: type
      in: path
      required: true
      description: Exact opaque Stremio content type; not restricted to built-in types.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AddonResourceId:
      name: id
      in: path
      required: true
      description: Exact opaque addon catalog or metadata identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 8192
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
    CollectionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Language:
      name: language
      in: query
      description: BCP 47 language tag used for localized metadata.
      schema:
        type: string
        pattern: ^[A-Za-z]{2,3}(-[A-Za-z]{2})?$
        default: en-US
    SeriesMappingProvider:
      name: mappingProvider
      in: query
      description: Provider hierarchy used to group series episodes into seasons.
      schema:
        type: string
        enum:
          - tmdb
          - tvdb
        default: tmdb
    EpisodeOrder:
      name: episodeOrder
      in: query
      description: Optional TVDB season type ID selected from the series episodeOrders list. Requires mappingProvider=tvdb.
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    Region:
      name: region
      in: query
      description: Optional ISO 3166-1 alpha-2 region.
      schema:
        type: string
        pattern: ^[A-Za-z]{2}$
    ExpectedVersion:
      name: expectedVersion
      in: query
      description: Last synchronization version observed by the client, or zero when no state exists.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
  responses:
    Error:
      description: Structured API error.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DeviceAuthorizationCapacity:
      description: Native device-code initiation admission or outstanding authorization capacity is exhausted.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          required: true
          description: Delay in seconds before retrying initiation; durable outstanding-capacity exhaustion returns 60.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PlaybackUnprocessable:
      description: Playback input is invalid, transcoding is disabled, or a required client processing capability was not announced.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlaybackUnprocessableError'
    PlaybackCapacity:
      description: Every server media-processing slot is occupied, or global maintenance mode blocks the playback request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          required: true
          description: Suggested delay in seconds before retrying playback preparation or resolution.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PlaybackCapacityError'
              - $ref: '#/components/schemas/MaintenanceModeError'
    DemoForbidden:
      description: A demonstration session attempted a route outside its exact method-and-path allowlist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoForbiddenError'
    DemoSessionInvalid:
      description: The demonstration cookie is absent, invalid, or expired.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoSessionInvalidError'
    DemoSessionLimit:
      description: The global demonstration pool or the trusted client source quota is full.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoSessionLimitError'
    DemoOriginRejected:
      description: A state-changing demonstration request failed its same-origin check.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DemoUnavailable:
      description: Server setup has completed, so demonstration mode and all demonstration sessions are unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Expired rivune_demo cookie scoped to /api/v1.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoUnavailableError'
    ArtworkError:
      description: Stable plain-text artwork lookup or upstream failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        text/plain:
          schema:
            type: string
    MaintenanceMode:
      description: Global maintenance mode is enabled for non-administrator application requests.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Suggested delay in seconds before probing the application again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MaintenanceModeError'
    TrackingSyncCapacity:
      description: The tracking synchronization outbox is at capacity. The mutation is rolled back and the standard Error envelope has code `tracking_sync_capacity`; retry without reloading its optimistic version.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          required: true
          description: Fixed delay in seconds before retrying the watch-state mutation.
          schema:
            type: integer
            enum:
              - 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TrackingOperationUnavailable:
      description: Tracking provider configuration or availability failed, synchronization capacity was reached, or global maintenance mode is enabled. Capacity failures use error code `tracking_sync_capacity` and roll back the mutation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Suggested delay in seconds for synchronization capacity or global maintenance mode.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/MaintenanceModeError'
              - $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    InstallAddonInput:
      type: object
      additionalProperties: false
      required:
        - transportUrl
      anyOf:
        - not:
            anyOf:
              - required:
                  - profileIds
              - required:
                  - categoryIds
        - required:
            - profileIds
          properties:
            profileIds:
              minItems: 1
        - required:
            - categoryIds
          properties:
            categoryIds:
              minItems: 1
      properties:
        transportUrl:
          type: string
          format: uri
          description: |
            Modern Stremio HTTP(S) transport URL. A root URL is normalized to manifest.json and a stremio:// install URL is normalized to HTTPS.
        profileIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Explicit profile grants, additive with categoryIds and never populated from category membership. When both dimensions are omitted, installation and preview default to the active profile; an explicit empty array is valid when categoryIds is nonempty.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants. Every active profile currently or subsequently in a selected category inherits access without materializing a profileIds entry. Any nonempty category policy requires a bearer-authenticated persisted global administrator.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    UpdateAddonInput:
      type: object
      additionalProperties: false
      description: Partial add-on update. Each omitted assignment dimension is preserved; a provided dimension replaces it. Both dimensions explicitly empty are invalid, and any replacement whose final explicit-profile/category union is empty returns 422.
      not:
        required:
          - profileIds
          - categoryIds
        properties:
          profileIds:
            maxItems: 0
          categoryIds:
            maxItems: 0
      properties:
        enabled:
          type: boolean
          description: Optional global availability state. Omit it to preserve the current state; only global administrators may change it.
        transportUrl:
          type: string
          format: uri
          description: |
            Optional replacement Stremio HTTP(S) transport URL. Omit it when changing assignment policy only. Replacing the transport is restricted to global administrators; a root URL is normalized to manifest.json and a stremio:// install URL is normalized to HTTPS.
        profileIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Explicit profile grants, additive with categoryIds and never populated from categories. Omit to preserve current grants; a provided array replaces them and may be empty only when the resulting category policy is nonempty.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants. Omit to preserve current grants; a provided array replaces them. Any resource with current or requested category policy requires a bearer-authenticated persisted global administrator.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    ReorderAddonsInput:
      type: object
      additionalProperties: false
      required:
        - addonIds
      properties:
        addonIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    AddonList:
      type: object
      additionalProperties: false
      description: Management list projection. Persisted global administrators receive effective-union resources with full separate assignment arrays. Delegated managers receive explicit-only, category-free resources; this visibility restriction does not narrow runtime effective access.
      required:
        - addons
      properties:
        addons:
          type: array
          items:
            $ref: '#/components/schemas/InstalledAddon'
    AddonPreview:
      type: object
      additionalProperties: false
      required:
        - manifest
        - capabilities
        - profileIds
        - categoryIds
      properties:
        manifest:
          $ref: '#/components/schemas/StremioManifest'
        capabilities:
          $ref: '#/components/schemas/AddonCapabilities'
        profileIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Explicit profile grants confirmed by the preview; category membership is never expanded into this array.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants confirmed by the preview.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    AddonDiagnostics:
      type: object
