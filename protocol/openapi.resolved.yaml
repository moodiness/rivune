        profile:
          $ref: '#/components/schemas/Profile'
        expiresAt:
          type: string
          format: date-time
        profileContext:
          type: string
          minLength: 1
          description: Opaque capability bound to this profile selection. Web clients store it only in the selecting tab.
    MaintenanceSettingsInput:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        message:
          description: Optional public message shown to clients while maintenance mode is enabled.
          type:
            - string
            - 'null'
          maxLength: 500
    MaintenanceSettings:
      type: object
      additionalProperties: false
      required:
        - enabled
        - message
      properties:
        enabled:
          type: boolean
        message:
          description: Optional public message shown to clients while maintenance mode is enabled.
          type:
            - string
            - 'null'
          maxLength: 500
    OperationAction:
      description: Administrator maintenance action exposed by the Operations API.
      type: string
      enum:
        - fetch-missing-metadata
        - run-housekeeping
        - clear-metadata-cache
        - clear-stream-cache
    MetadataRefreshResult:
      type: object
      additionalProperties: false
      required:
        - candidates
        - refreshed
        - failed
      properties:
        candidates:
          description: Distinct localized payloads selected for this refresh attempt.
          type: integer
          minimum: 0
        refreshed:
          description: Selected payloads whose localized metadata was refreshed successfully.
          type: integer
          minimum: 0
        failed:
          description: Selected payloads that retained stale data because refresh failed.
          type: integer
          minimum: 0
        failedTitles:
          description: Bounded, de-duplicated human-readable titles that could not be refreshed. Technical provider details are never included.
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 120
    MetadataRefreshScheduleInput:
      type: object
      additionalProperties: false
      required:
        - enabled
        - intervalHours
        - language
        - batchSize
      properties:
        enabled:
          type: boolean
        intervalHours:
          description: Fixed interval between durably claimed metadata-refresh runs.
          type: integer
          enum:
            - 6
            - 12
            - 24
            - 168
        language:
          description: BCP 47 language tag used for localized metadata.
          type: string
        batchSize:
          description: Maximum number of missing or expired localized title payloads refreshed by one run.
          type: integer
          minimum: 1
          maximum: 100
    MetadataRefreshSchedule:
      type: object
      additionalProperties: false
      required:
        - task
        - enabled
        - intervalHours
        - language
        - batchSize
        - nextRunAt
        - lastStartedAt
        - lastCompletedAt
        - lastStatus
        - lastResult
      properties:
        task:
          type: string
          const: metadata-refresh
        enabled:
          type: boolean
        intervalHours:
          type: integer
          enum:
            - 6
            - 12
            - 24
            - 168
        language:
          type: string
        batchSize:
          type: integer
          minimum: 1
          maximum: 100
        nextRunAt:
          description: Next eligible durable claim time, or null when scheduling is disabled.
          type:
            - string
            - 'null'
          format: date-time
        lastStartedAt:
          description: Most recent claimed run start, or null before the first run.
          type:
            - string
            - 'null'
          format: date-time
        lastCompletedAt:
          description: Most recent completed run time, or null before the first completed run.
          type:
            - string
            - 'null'
          format: date-time
        lastStatus:
          description: Outcome of the most recent completed run, or null before the first completed run.
          type:
            - string
            - 'null'
          enum:
            - succeeded
            - partial
            - failed
            - null
        lastResult:
          description: Counts from the most recent completed run, or null before the first completed run.
          anyOf:
            - $ref: '#/components/schemas/MetadataRefreshResult'
            - type: 'null'
    MetadataCacheStatus:
      type: object
      additionalProperties: false
      required:
        - entries
        - freshEntries
        - expiredEntries
        - rootTitles
        - missingTitles
        - artworkSnapshots
      properties:
        entries:
          description: Localized payload rows currently stored in `title_metadata`.
          type: integer
          minimum: 0
        freshEntries:
          description: Localized payload rows whose freshness window has not expired.
          type: integer
          minimum: 0
        expiredEntries:
          description: Localized payload rows whose freshness window has expired.
          type: integer
          minimum: 0
        rootTitles:
          description: Eligible top-level movie and series root titles considered for metadata refresh.
          type: integer
          minimum: 0
        missingTitles:
          description: Eligible root titles without a fresh localized metadata payload in the scheduled language, including absent and expired rows.
          type: integer
          minimum: 0
        artworkSnapshots:
          description: Root title snapshots with at least one nonblank canonical artwork reference; these snapshots are stored independently from localized payload rows.
          type: integer
          minimum: 0
    PostgreSQLPoolStatus:
      type: object
      additionalProperties: false
      required:
        - acquired
        - idle
        - total
        - max
        - waitCount
        - waitDurationMilliseconds
      properties:
        acquired:
          type: integer
          minimum: 0
        idle:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 1
        waitCount:
          type: integer
          format: int64
          minimum: 0
        waitDurationMilliseconds:
          type: integer
          format: int64
          minimum: 0
    TrackingOutboxStatus:
      type: object
      additionalProperties: false
      required:
        - pending
        - due
        - oldestAgeSeconds
      properties:
        pending:
          type: integer
          format: int64
          minimum: 0
        due:
          type: integer
          format: int64
          minimum: 0
        oldestAgeSeconds:
          type: integer
          format: int64
          minimum: 0
    AddonOperationsStatus:
      type: object
      additionalProperties: false
      required:
        - total
        - enabled
        - latestUpdatedAt
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: integer
          format: int64
          minimum: 0
        latestUpdatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    PlaybackOperationsStatus:
      type: object
      additionalProperties: false
      required:
        - active
        - transcoding
      properties:
        active:
          type: integer
          format: int64
          minimum: 0
        transcoding:
          type: integer
          format: int64
          minimum: 0
    OperationsOverview:
      type: object
      additionalProperties: false
      required:
        - metadataCache
        - metadataRefresh
        - postgresqlPool
        - trackingOutbox
        - addons
        - playback
        - housekeepingIntervalMinutes
      properties:
        metadataCache:
          $ref: '#/components/schemas/MetadataCacheStatus'
        metadataRefresh:
          $ref: '#/components/schemas/MetadataRefreshSchedule'
        postgresqlPool:
          $ref: '#/components/schemas/PostgreSQLPoolStatus'
        trackingOutbox:
          $ref: '#/components/schemas/TrackingOutboxStatus'
        addons:
          $ref: '#/components/schemas/AddonOperationsStatus'
        playback:
          $ref: '#/components/schemas/PlaybackOperationsStatus'
        housekeepingIntervalMinutes:
          description: Cadence of the existing maintenance runner that checks housekeeping and due metadata refreshes.
          type: integer
          minimum: 1
    OperationRun:
      type: object
      additionalProperties: false
      required:
        - action
        - startedAt
        - completedAt
        - status
        - result
      properties:
        action:
          $ref: '#/components/schemas/OperationAction'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - succeeded
            - partial
            - failed
        result:
          description: Action-specific counts. Metadata refreshes set `metadata`; metadata-cache clears set `metadataCache`; housekeeping and stream-cache clears set `playback`.
          type: object
          additionalProperties: false
          properties:
            metadata:
              $ref: '#/components/schemas/MetadataRefreshResult'
            metadataCache:
              type: object
              additionalProperties: false
              required:
                - entriesDeleted
              properties:
                entriesDeleted:
                  description: Localized `title_metadata` payload rows deleted.
                  type: integer
                  minimum: 0
            playback:
              $ref: '#/components/schemas/PlaybackPurgeResult'
    MaintenanceModeError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: maintenance_mode
            message:
              type: string
              maxLength: 500
            publicMessage:
              description: Optional administrator-provided public message; clients localize their fallback when absent.
              type: string
              maxLength: 500
    CommonSettingsPatch:
      type: object
      minProperties: 1
      properties:
        interfaceLanguage:
          anyOf:
            - $ref: '#/components/schemas/InterfaceLanguage'
            - type: 'null'
        theme:
          anyOf:
            - type: string
              enum:
                - system
                - light
                - dark
            - type: 'null'
        maximumResolution:
          anyOf:
            - type: string
              enum:
                - auto
                - 2160p
                - 1080p
                - 720p
                - 480p
            - type: 'null'
        maximumCastMembers:
          description: Maximum cast members exposed to clients. The instance value defaults to 20; a profile value overrides it, while null clears the current layer so a profile inherits the instance value. The effective value is bounded by the instance value.
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100
        maximumDirectTitles:
          description: Maximum titles displayed directly on the home page for a collection using follow_layout. The instance value is an absolute ceiling and defaults to 20; a profile value may be no greater than that ceiling, while null clears the current layer so a profile inherits the instance value.
          type:
            - integer
            - 'null'
          default: 20
