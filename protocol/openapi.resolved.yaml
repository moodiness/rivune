          type: string
          format: date-time
    CollectionCreateInput:
      description: Collection creation input. When both assignment dimensions are omitted, the active profile is granted explicitly. Otherwise at least one provided assignment array must be nonempty.
      allOf:
        - $ref: '#/components/schemas/CollectionSaveInput'
        - anyOf:
            - not:
                anyOf:
                  - required:
                      - profileIds
                  - required:
                      - categoryIds
            - required:
                - profileIds
              properties:
                profileIds:
                  minItems: 1
            - required:
                - categoryIds
              properties:
                categoryIds:
                  minItems: 1
    CollectionSaveInput:
      type: object
      additionalProperties: false
      description: Partial collection update input. Each omitted assignment dimension is preserved; a provided dimension replaces it. Both dimensions explicitly empty are invalid, and any replacement whose final explicit-profile/category union is empty returns 422.
      not:
        required:
          - profileIds
          - categoryIds
        properties:
          profileIds:
            maxItems: 0
          categoryIds:
            maxItems: 0
      required:
        - title
        - heroEnabled
        - pinToTop
        - focusGlowEnabled
        - viewMode
        - folderCoverShape
        - folders
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        backdropImageUrl:
          type: string
          format: uri-reference
        heroEnabled:
          type: boolean
        pinToTop:
          type: boolean
        focusGlowEnabled:
          type: boolean
        viewMode:
          $ref: '#/components/schemas/CollectionViewMode'
        folderCoverShape:
          $ref: '#/components/schemas/CollectionTileShape'
        folders:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CollectionFolder'
        profileIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Explicit profile grants, additive with categoryIds and never populated from category membership. Defaults to the active profile on creation only when both dimensions are omitted; omitted updates preserve current grants. A provided array replaces them and may be empty when the resulting category policy is nonempty.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants. Current and future active profiles in these categories inherit access. Omitted updates preserve current grants. Any nonempty current or requested category policy requires a bearer-authenticated persisted global administrator.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
