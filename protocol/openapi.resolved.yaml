    DeviceCodeApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - userCode
        - categoryId
      description: |
        Purpose-conditional shared approval input. Native authorization uses categoryId and accepts the optional deviceName/internalNote overrides. Jellyfin Quick Connect requires categoryId in the body but does not trust it: approval derives the category and exact profile from the approver's active manageable profile and discards both optional overrides.
      properties:
        userCode:
          type: string
          pattern: ^[A-Z2-9]{4}-[A-Z2-9]{4}$
        categoryId:
          type: string
          format: uuid
          description: Authoritative requested assignment for native authorization; structural but ignored in favor of the active manageable profile's category for Jellyfin Quick Connect.
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional native-device name override; discarded for Jellyfin Quick Connect approval.
        internalNote:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Optional native-device administrative note; discarded for Jellyfin Quick Connect approval.
