      - $ref: '#/components/parameters/AddonContentType'
      - $ref: '#/components/parameters/AddonResourceId'
    get:
      summary: Get addon resource
      operationId: getAddonResource
      description: |
        Calls one installed addon using the Stremio HTTP addon protocol. Generic access is restricted to catalog, addon_catalog, and meta resources. Every query parameter is forwarded as a Stremio extra value after skip and limit, when present, pass the bounded integer validation below. Content types, IDs, repeated extras, and custom ID prefixes remain opaque; provider URLs, headers, cookies, and credential fields are stripped.
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            minimum: 0
          description: Optional exact-resource offset forwarded as an extra value.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Optional exact-resource page size forwarded as an extra value.
      security:
        - bearerAuth: []
      responses:
        '200':
