        - position
        - profileIds
        - categoryIds
        - enabled
        - installedAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        manifest:
          $ref: '#/components/schemas/StremioManifest'
        position:
          type: integer
          minimum: 0
        profileIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: Explicit profile grants only; profiles inheriting through categoryIds are not materialized here.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants. Current and future active profiles in these categories inherit effective runtime access.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        enabled:
          type: boolean
          description: Whether the installed addon may participate in runtime discovery and execution.
        installedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ManagedAddon:
      type: object
      additionalProperties: false
      required:
        - id
        - manifest
        - position
        - profileIds
        - categoryIds
        - enabled
        - installedAt
        - updatedAt
      description: Addon management response with separate explicit profile and durable category policy. transportUrl is present only for a currently authorized global administrator.
      properties:
        id:
          type: string
          format: uuid
        manifest:
          $ref: '#/components/schemas/StremioManifest'
        position:
          type: integer
          minimum: 0
        profileIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: Explicit profile grants only; profiles inheriting through categoryIds are not materialized here.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants. Current and future active profiles in these categories inherit effective runtime access.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        enabled:
          type: boolean
          description: Whether the installed addon may participate in runtime discovery and execution.
        installedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        transportUrl:
          type: string
          format: uri
          description: Exact stored transport URL, including path and query; omitted for non-global mutation responses.
    StremioManifest:
      type: object
      additionalProperties: true
      required:
        - id
        - version
        - name
        - types
        - resources
      properties:
        id:
          type: string
        version:
          type: string
          description: Semantic version declared by the addon.
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string
        logo:
          type: string
          format: uri-reference
        background:
          type: string
          format: uri-reference
        types:
          type: array
          description: Arbitrary content types; movie and series are not special-cased.
          items:
            type: string
        resources:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/StremioManifestResource'
        idPrefixes:
          type: array
          description: Optional global opaque ID-prefix filters.
          items:
            type: string
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/StremioManifestCatalog'
        addonCatalogs:
          type: array
          items:
            $ref: '#/components/schemas/StremioManifestCatalog'
        config:
          type: array
          items:
            type: object
            additionalProperties: true
        behaviorHints:
          type: object
          additionalProperties: true
          properties:
            adult:
              type: boolean
            p2p:
              type: boolean
            configurable:
              type: boolean
            configurationRequired:
              type: boolean
    StremioManifestResource:
      type: object
      additionalProperties: true
      required:
        - name
      properties:
        name:
          type: string
        types:
          type: array
          items:
            type: string
        idPrefixes:
          type: array
          items:
            type: string
    StremioManifestCatalog:
      type: object
      additionalProperties: true
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
        genres:
          type: array
          deprecated: true
          items:
            type: string
        extra:
          type: array
          items:
            $ref: '#/components/schemas/StremioExtraProperty'
        extraRequired:
          type: array
          deprecated: true
          items:
            type: string
        extraSupported:
          type: array
          deprecated: true
          items:
            type: string
    StremioExtraProperty:
      type: object
      additionalProperties: true
      required:
        - name
      properties:
