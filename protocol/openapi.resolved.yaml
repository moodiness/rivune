        enabled:
          type: boolean
        availableFrom:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        availableUntil:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        accessStartTime:
          anyOf:
            - type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
        accessEndTime:
          anyOf:
            - type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
    SelectProfileRequest:
      type: object
