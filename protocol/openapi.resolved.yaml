    JellyfinCredentialStatus:
      type: object
      additionalProperties: false
      required:
        - active
        - canIssue
        - generation
      properties:
        username:
          type: string
          format: uuid
          description: Stable opaque Jellyfin username. Absent only before the profile's first credential creation.
        active:
          type: boolean
        canIssue:
          type: boolean
          description: Whether the caller has direct profile access and may create or rotate this credential. Revocation requires only management authorization.
        generation:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        rotatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    JellyfinProfileCredential:
      type: object
      additionalProperties: false
      description: One-shot Jellyfin application credential returned only by creation or rotation.
      required:
        - username
        - password
        - active
        - canIssue
        - generation
        - createdAt
      properties:
        username:
          type: string
          format: uuid
        password:
          type: string
          minLength: 54
          maxLength: 54
          pattern: ^rivune_jfa_[A-Za-z0-9_-]{43}$
          description: One-shot application password shown only in this creation or rotation response.
        active:
          type: boolean
          const: true
        canIssue:
          type: boolean
          const: true
        generation:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        rotatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    SessionNotificationList:
      type: object
      additionalProperties: false
      required:
        - notifications
