        description: Deterministic SHA-256 key for a server-registered upstream artwork URL.
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
    get:
      summary: Read cached artwork
      operationId: readArtwork
      description: Lazily downloads registered provider artwork into the self-hosted persistent cache and returns immutable same-origin bytes. Provider URLs remain server-side unless a cache miss fails, in which case the response redirects to the registered source as a no-store fallback.
      security: []
      responses:
        '200':
          description: Cached JPEG, PNG, or WebP artwork.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
              description: Public immutable browser cache policy.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '307':
          description: Cache miss fallback to the registered provider artwork URL.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ArtworkError'
        '404':
          $ref: '#/components/responses/ArtworkError'
        '502':
          $ref: '#/components/responses/ArtworkError'
    head:
      summary: Inspect cached artwork
      operationId: inspectArtwork
      description: Resolves a registered artwork cache entry and returns the same headers as GET without a response body.
      security: []
      responses:
        '200':
          description: Cached artwork headers.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
        '307':
          description: Cache miss fallback to the registered provider artwork URL.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ArtworkError'
        '404':
          $ref: '#/components/responses/ArtworkError'
        '502':
          $ref: '#/components/responses/ArtworkError'
