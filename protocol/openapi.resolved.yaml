            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /calendar.ics:
    get:
      summary: Download a private calendar feed
      operationId: getPrivateCalendarFeed
      description: |
        Returns the token's currently accessible profile calendar for the rolling window in the configured instance timezone, from 31 days before today through 61 days after today, inclusive. Access restrictions are re-evaluated for every request. The feed reads only persisted profile_library and titles snapshots and never refreshes or calls a metadata provider. token must be the only query parameter and must occur exactly once.
      security:
        - calendarToken: []
      responses:
        '200':
          description: |
            RFC 5545 iCalendar feed encoded with CRLF line endings and UTF-8-safe folding at 75 octets. TEXT values are escaped, every event is all-day with an exclusive next-day DTEND, UIDs remain stable across token rotation, and DTSTAMP and LAST-MODIFIED are derived from the stable titles.updated_at snapshot. Movie summaries are the movie title; episode summaries contain the series, SxxExx code, and episode title.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              required: true
              description: Inline disposition with an iCalendar filename.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              required: true
              schema:
                type: string
                const: noindex, nofollow
          content:
            text/calendar; charset=utf-8:
              schema:
                type: string
        '404':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: |
            Uniform not-found response for an absent, malformed, repeated, revoked, or inaccessible token, or for any additional query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: The public feed concurrency or per-source attempt budget was exceeded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              required: true
              schema:
                type: string
                const: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Calendar event capacity was exceeded; no partial iCalendar document is returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              required: true
              schema:
                type: string
                const: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    head:
      summary: Inspect a private calendar feed
      operationId: headPrivateCalendarFeed
      description: |
        Validates the token and current profile access transactionally under the same strict query rules as GET, but does not load events, sort them, serialize an iCalendar document, or return a body. Successful responses expose text/calendar; charset=utf-8, the iCalendar filename, and private no-store/noindex headers.
      security:
        - calendarToken: []
      responses:
        '200':
          description: Calendar feed headers without a response body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              required: true
              description: Inline disposition with the same iCalendar filename as GET.
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              required: true
              schema:
                type: string
                const: noindex, nofollow
          content:
            text/calendar; charset=utf-8:
              schema:
                type: string
                description: Representation metadata only; HEAD returns no response body.
        '404':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: |
            Uniform not-found response for an absent, malformed, repeated, revoked, or inaccessible token, or for any additional query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: The public feed concurrency or per-source attempt budget was exceeded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              required: true
              schema:
                type: string
                const: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Calendar feed validation is temporarily unavailable because capacity was exceeded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              required: true
              schema:
                type: string
                const: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /library:
    get:
      summary: List library
      operationId: listLibrary
      description: Returns entries for the selected profile. TV entries remain listed when their addon disappears and expose available=false until removed.
      security:
        - bearerAuth: []
      parameters:
        - name: mediaType
          in: query
          schema:
            type: string
            enum:
              - movie
              - series
              - tv
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Library entries belonging to the selected profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPage'
        '401':
