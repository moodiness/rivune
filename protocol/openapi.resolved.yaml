    get:
      summary: Get private calendar subscription status
      operationId: getProfileCalendarLink
      description: |
        Returns only whether the active profile has a private calendar subscription and its lifecycle timestamps; the credential URL and token are never returned by this operation. The bearer-authenticated caller must supply the selected profile context, the selected profile must equal profileId, and the caller must be allowed to manage that profile.
