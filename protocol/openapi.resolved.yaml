  /operations/actions/{action}:
    parameters:
      - name: action
        in: path
        required: true
        description: Fixed maintenance action to run synchronously.
        schema:
          $ref: '#/components/schemas/OperationAction'
    post:
      summary: Run a fixed maintenance action
      description: |
        Runs one administrator-only action synchronously:

        - `fetch-missing-metadata` refreshes every missing or expired localized payload in the saved language through the canonical TMDB-to-TVDB/Fanart persistence pipeline. It processes work in saved-size batches until no unattempted payload remains; existing localized payloads survive provider failures.
        - `run-housekeeping` invokes the normal stale authentication and playback cleanup.
        - `clear-metadata-cache` deletes only localized payload rows from `title_metadata`. It preserves profiles, libraries, watch progress, stable title identities, canonical title snapshots, and artwork snapshots.
        - `clear-stream-cache` deletes every `playback_sessions` row, stops all HLS and prewarm jobs, clears in-memory source-reference, probe, and preparation entries, and recreates the media temporary workspace. It preserves profiles, libraries, watch progress, title identities, and canonical title snapshots.
      operationId: runOperationAction
      security:
        - bearerAuth: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Completed maintenance action and its action-specific result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationRun'
              examples:
                fetchMissingMetadata:
                  summary: An exhaustive refresh with provider failures
                  value:
                    action: fetch-missing-metadata
                    startedAt: '2026-08-02T14:30:00Z'
                    completedAt: '2026-08-02T14:30:42Z'
                    status: partial
                    result:
                      metadata:
                        candidates: 50
                        refreshed: 48
                        failed: 2
                runHousekeeping:
                  summary: Normal stale authentication and playback cleanup
                  value:
                    action: run-housekeeping
                    startedAt: '2026-08-02T14:35:00Z'
                    completedAt: '2026-08-02T14:35:03Z'
                    status: succeeded
                    result:
                      playback:
                        sessionsRemoved: 2
                        jobsStopped: 1
                        storageBytes: 1048576
                clearMetadataCache:
                  summary: Localized metadata payload rows cleared
                  value:
                    action: clear-metadata-cache
                    startedAt: '2026-08-02T14:40:00Z'
                    completedAt: '2026-08-02T14:40:01Z'
                    status: succeeded
                    result:
                      metadataCache:
                        entriesDeleted: 1842
                clearStreamCache:
                  summary: Playback state, media jobs, and temporary media cleared
                  value:
                    action: clear-stream-cache
                    startedAt: '2026-08-02T14:45:00Z'
                    completedAt: '2026-08-02T14:45:04Z'
                    status: succeeded
                    result:
                      playback:
                        sessionsRemoved: 4
                        jobsStopped: 2
                        storageBytes: 0
