        demoAvailable:
          type: boolean
          description: Whether a pre-setup demonstration session may be started. Always emitted by current servers but optional for pre-v18 compatibility.
        capabilities:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Stable optional feature identifiers emitted by current servers. Clients ignore unknown identifiers and gate optional native workflows on recognized values.
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        timezone:
          type: string
          description: IANA timezone configured by the server operator.
        interfaceLanguage:
          $ref: '#/components/schemas/InterfaceLanguage'
