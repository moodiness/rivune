        - hasPin
        - canManage
        - enabled
        - availableFrom
        - availableUntil
        - accessStartTime
        - accessEndTime
        - accessTimezone
        - accessible
        - avatar
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        categoryId:
          type: string
          format: uuid
          description: Authoritative persisted category identifier returned by the server.
        category:
          $ref: '#/components/schemas/CategoryRef'
        isChild:
          type: boolean
        hasPin:
          type: boolean
        canManage:
          type: boolean
        enabled:
          type: boolean
        availableFrom:
          description: First available local date, inclusive, or null.
          anyOf:
            - type: string
              format: date
            - type: 'null'
        availableUntil:
          description: Last available local date, inclusive, or null.
          anyOf:
            - type: string
              format: date
            - type: 'null'
        accessStartTime:
          description: Start-inclusive daily local time, or null when unrestricted.
          anyOf:
            - type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
        accessEndTime:
          description: End-exclusive daily local time; may be earlier than the start for an overnight range.
          anyOf:
            - type: string
              pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
            - type: 'null'
        accessTimezone:
          type: string
          description: IANA timezone configured through the server TZ environment variable.
        accessible:
          type: boolean
          description: Current server-evaluated availability. Clients must not treat this as enforcement.
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'
    ProfileAvatar:
