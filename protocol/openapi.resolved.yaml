              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: RIVUNE_PUBLIC_URL is not configured (public_url_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
