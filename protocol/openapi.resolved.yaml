          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonResourceResult'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /addons/resources/{resource}/{type}/{id}:
    parameters:
      - $ref: '#/components/parameters/AddonResource'
      - $ref: '#/components/parameters/AddonContentType'
      - $ref: '#/components/parameters/AddonResourceId'
    get:
      summary: Get all addon resources
      operationId: getAllAddonResources
      description: |
        Calls every installed addon whose manifest declaration accepts the exact exposable resource, content type, and opaque ID. Generic access is restricted to catalog, addon_catalog, and meta. Every query parameter is forwarded as a Stremio extra value.
      security:
        - bearerAuth: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Ordered successful payloads and isolated provider failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonResourceBatch'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /addons/catalogs/search/{type}:
    parameters:
      - $ref: '#/components/parameters/AddonContentType'
    get:
      summary: Search addon catalogs
      operationId: searchAddonCatalogs
      description: |
        Calls every searchable catalog of the requested type in installed-addon and manifest order. Search is always sent. Skip and limit are adapted to each catalog and sent only when declared; a positive skip excludes catalogs that do not declare pagination. Other repeated Stremio extras are preserved, catalog defaults are applied, and provider failures remain isolated in the response batch. TV searches additionally require both `tv` in the manifest types and at least one TV catalog declaration.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: skip
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Per-catalog offset. Positive values exclude catalogs that do not declare the skip extra.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          description: Requested page size, sent only to catalogs that declare the limit extra.
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Search catalog responses in installed-addon and manifest order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonResourceBatch'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
