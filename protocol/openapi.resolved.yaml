  /profiles/{profileId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: Export a portable profile archive
      description: |
        Global-administrator-only export of profile settings, explicit profile add-ons, portable collections, stable title identities, library/progress/favorite/user-data state, and tracking preferences without credentials. Add-on transport URLs are intentional user secrets and may contain tokens; the response is no-store and the downloaded file must be protected like a credential. Passwords, PINs, sessions, tracking/Jellyfin credentials, category policies, user grants, and instance secrets are never included.
      operationId: exportProfileArchive
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portable profile archive version 1.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
            Content-Disposition:
              required: true
              schema:
                type: string
                const: attachment; filename="rivune-profile-archive.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileArchiveDocument'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /profiles/{profileId}/archive/import:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Merge a portable profile archive
      description: |
        Global-administrator-only, bounded, strict version-1 merge into the profile named by the URL. The server revalidates global administrator and target-profile management authority inside the single database transaction. It preserves target identity and security, does not delete absent data, rebinds stable portable identities to target-local UUIDs, and is idempotent. The document may contain secret add-on transport URLs and must be handled as a credential file.
      operationId: importProfileArchive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileArchiveDocument'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Atomic merge report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileArchiveImportReport'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /profiles/{profileId}/jellyfin-credential:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: Get the profile Jellyfin credential status
      description: The active profile may read its own non-secret status; otherwise a global administrator or authorized category manager is required. username is absent before first creation and remains stable after revocation.
      operationId: getProfileJellyfinCredential
      security:
        - bearerAuth: []
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Non-secret credential state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinCredentialStatus'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      summary: Create the profile Jellyfin credential
      description: The active profile may create its own credential; otherwise an authorized manager who also has personal access to the profile may create it. Generates a unique application password returned once and never retrievable afterward. The request body must be empty.
      operationId: createProfileJellyfinCredential
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Newly generated one-shot Jellyfin application credential.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinProfileCredential'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke the profile Jellyfin credential
      description: The active profile may revoke its own credential; otherwise an authorized manager is required. Atomically revokes the application password and every native or compatibility session derived from it while retaining the stable username. Repeating the request after revocation or before first creation is a successful no-op.
      operationId: revokeProfileJellyfinCredential
      security:
        - bearerAuth: []
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: The credential is inactive and any derived sessions are revoked.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /profiles/{profileId}/jellyfin-credential/rotate:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Rotate the profile Jellyfin credential
      description: The active profile may rotate its own credential; otherwise an authorized manager who also has personal access to the profile may rotate it. Replaces the application password and atomically revokes every native or compatibility session derived from its preceding generation. The request body must be empty.
      operationId: rotateProfileJellyfinCredential
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rotated one-shot Jellyfin application credential.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinProfileCredential'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
