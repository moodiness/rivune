    post:
      summary: Resolve an addon custom series hierarchy
      operationId: resolveCustomSeries
      description: |
        Authoritatively resolves up to 4096 season and episode coordinates for the selected profile and exact accessible addon installation. Stable internal UUIDs are profile-scoped and derived from the addon installation, source type, hierarchy kind, and opaque resource IDs; they are not canonical TMDB, IMDb, or TVDB identities. Omitted prior children become inactive without deleting their watch progress, and returning children regain the same UUIDs and progress. Videos are returned in request order and seasons in ascending numeric order. The JSON body is strictly decoded and bounded to 8 MiB; each profile may retain at most 100,000 profile-scoped title identities, while existing identities remain refreshable.
