          $ref: '#/components/responses/Error'
    post:
      summary: Create a private calendar subscription
      operationId: createProfileCalendarLink
      description: |
        Creates the subscription without a request body. The absolute credential URL contains a new bearer secret and is disclosed exactly once in this response; later status reads never return it. The bearer-authenticated caller must supply the matching selected profile context and be allowed to manage the active profile. RIVUNE_PUBLIC_URL must be configured or the operation returns 503 public_url_required.
      security:
        - bearerAuth: []
      responses:
        '201':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: A new calendar subscription and its one-time credential URL.
