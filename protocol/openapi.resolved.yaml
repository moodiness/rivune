          type: string
          format: uuid
        addonName:
          type: string
          description: Current display name of the profile-assigned add-on that declares this catalog.
        addonLogoUrl:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ^/api/v1/artwork/[0-9a-f]{64}$
          description: Optional same-origin localized add-on logo; raw provider URLs are never serialized.
        manifestId:
          type: string
        position:
          type: integer
          minimum: 0
        catalog:
          $ref: '#/components/schemas/StremioManifestCatalog'
        addonCatalog:
          type: boolean
        searchable:
          type: boolean
          description: Whether this regular catalog can participate in the Search endpoint after applying the manifest's modern-versus-legacy extra precedence.
    AddonCachePolicy:
      type: object
      additionalProperties: false
      properties:
        maxAgeSeconds:
          type: integer
          format: int64
          minimum: 0
        staleWhileRevalidateSeconds:
          type: integer
          format: int64
          minimum: 0
        staleIfErrorSeconds:
          type: integer
          format: int64
          minimum: 0
    AddonResourceResult:
      type: object
      additionalProperties: false
      required:
        - addonId
        - manifestId
        - resource
        - type
        - id
        - payload
        - cache
      properties:
        addonId:
          type: string
          format: uuid
        manifestId:
          type: string
        resource:
          type: string
        type:
          type: string
        id:
          type: string
          description: Exact opaque content or video ID sent to the addon.
        payload:
          type: object
          additionalProperties: true
          description: |
            Forward-compatible catalog or metadata response object. Non-sensitive unknown fields and SDK cache fields are preserved. Provider URLs, transport credentials, headers, and cookies are removed. Rivune may replace artwork URL fields with canonical provider choices exposed through same-origin /api/v1/artwork cache URLs.
        cache:
          $ref: '#/components/schemas/AddonCachePolicy'
        extra:
          type: array
          items:
            $ref: '#/components/schemas/AddonExtraValue'
          description: Exact ordered extras sent for this resource request after catalog-specific adaptation and defaults.
    AddonExtraValue:
      type: object
      additionalProperties: false
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
    AddonResourceFailure:
      type: object
      additionalProperties: false
