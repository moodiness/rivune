        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomSeriesResolveInput'
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          description: Stable profile-scoped internal series, season, and episode identities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomSeriesResolveResult'
