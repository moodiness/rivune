        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Durable category grants. Current and future active profiles in these categories inherit effective collection access.
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
