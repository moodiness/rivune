        '503':
          description: Calendar event capacity was exceeded; no partial result is returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              required: true
              description: Delay in seconds before retrying the calendar request.
              schema:
                type: integer
                minimum: 1
