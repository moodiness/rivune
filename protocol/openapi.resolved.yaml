        color:
          type:
            - string
            - 'null'
          pattern: ^#[0-9A-Fa-f]{6}$
        icon:
          type:
            - string
            - 'null'
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        position:
