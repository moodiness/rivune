        default: { $ref: "#/components/responses/CompatError" }
  /ClientLog/Document:
    post:
      tags: [Sessions]
      summary: Consume and discard a bounded client diagnostic document
      description: The body is read for transport hygiene and logged only as a byte count; its contents are never persisted by this adapter.
      operationId: submitJellyfinClientLog
      requestBody:
        required: false
        content:
          text/plain:
            schema: { type: string, maxLength: 65536, x-maxUtf8Bytes: 65536 }
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 65536 }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        default: { $ref: "#/components/responses/CompatError" }
  /socket:
    get:
      tags: [Sessions]
      summary: Upgrade to the bounded compatibility WebSocket
      description: Sends only `ForceKeepAlive` JSON messages. Client messages are activity signals, limited to 4 KiB each and 1,024 per connection; the connection lifetime is at most two hours.
      operationId: openJellyfinSocket
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/WebSocketUpgrade" }
        - { $ref: "#/components/parameters/WebSocketConnection" }
      responses:
