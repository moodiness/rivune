components:
  securitySchemes:
    XEmbyToken:
      type: apiKey
      in: header
      name: X-Emby-Token
      description: Opaque `rivune_jf_…` compatibility credential.
    XMediaBrowserToken:
      type: apiKey
      in: header
      name: X-MediaBrowser-Token
      description: Opaque `rivune_jf_…` compatibility credential.
    AuthorizationToken:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `MediaBrowser` or `Emby` authorization parameters containing `Token="rivune_jf_…"`.
        This is not HTTP Bearer authentication.
    XEmbyAuthorizationToken:
      type: apiKey
      in: header
      name: X-Emby-Authorization
      description: >
        `MediaBrowser` or `Emby` authorization parameters containing the compatibility
        `Token`, optionally with bounded client metadata.
    XMediaBrowserAuthorizationToken:
      type: apiKey
      in: header
      name: X-MediaBrowser-Authorization
      description: >
        `MediaBrowser` or `Emby` authorization parameters containing the compatibility
        `Token`, optionally with bounded client metadata.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: >
        URL authentication accepted only by documented artwork and stream operations.
        Stream URLs may use the matching PlaySessionId as an item/source-bound capability.
        A duplicate query value or a value conflicting with any header credential fails.
    ArtworkTagQuery:
      type: apiKey
      in: query
      name: tag
      description: Opaque 64-hex artwork capability returned in ImageTags or BackdropImageTags.
  parameters:
    ClientAuthorization:
      name: Authorization
      in: header
      required: false
      description: >
        One MediaBrowser/Emby client-metadata header is required for login. Multiple
        transports must carry identical parameter sets.
      schema: { type: string, maxLength: 2048 }
    XEmbyClientAuthorization:
      name: X-Emby-Authorization
      in: header
      required: false
      description: MediaBrowser/Emby client metadata for login.
      schema: { type: string, maxLength: 2048 }
    XMediaBrowserClientAuthorization:
      name: X-MediaBrowser-Authorization
      in: header
      required: false
      description: MediaBrowser/Emby client metadata for login.
      schema: { type: string, maxLength: 2048 }
    UserIdPath:
      name: id
      in: path
      required: true
      description: UUID of the profile bound to the compatibility credential.
      schema: { $ref: "#/components/schemas/UUID" }
    UserIdPathNamed:
      name: userId
      in: path
      required: true
      description: UUID of the profile bound to the compatibility credential.
      schema: { $ref: "#/components/schemas/UUID" }
    ItemIdPath:
      name: id
      in: path
      required: true
      description: Canonical or deterministic virtual Rivune item UUID.
      schema: { $ref: "#/components/schemas/UUID" }
    ItemIdPathNamed:
      name: itemId
      in: path
      required: true
      description: Canonical Rivune item UUID.
      schema: { $ref: "#/components/schemas/UUID" }
    SeriesIdPath:
      name: seriesId
      in: path
      required: true
      description: Canonical series UUID.
      schema: { $ref: "#/components/schemas/UUID" }
    DisplayPreferenceIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ImageTypePath:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [Primary, Backdrop, Thumb] }
    ImageIndexPath:
      name: index
      in: path
      required: true
      description: Only the first image is implemented.
      schema: { type: string, const: "0" }
    ContainerPath:
      name: container
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9]+$" }
    UserIdQuery:
      name: UserId
      in: query
      required: false
      description: When present, must equal the bound profile UUID.
      schema: { $ref: "#/components/schemas/UUID" }
    SearchTerm:
      name: SearchTerm
      in: query
      required: false
      schema: { type: string, maxLength: 256 }
    ParentId:
      name: ParentId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UUID" }
    StartIndex:
      name: StartIndex
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    Limit:
      name: Limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    Recursive:
      name: Recursive
      in: query
      required: false
      schema: { type: boolean, default: false }
    IncludeItemTypes:
      name: IncludeItemTypes
      in: query
      required: false
      description: Comma-separated, at most 100 values, each at most 256 bytes. BoxSet selects only the authorized Collections root listing; standard Jellyfin kinds that Rivune does not project are ignored.
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          enum: [AggregateFolder, Audio, AudioBook, BasePluginFolder, Book, BoxSet, Channel, ChannelFolderItem, CollectionFolder, Episode, Folder, Genre, LiveTvChannel, LiveTvProgram, ManualPlaylistsFolder, Movie, MusicAlbum, MusicArtist, MusicGenre, MusicVideo, Person, Photo, PhotoAlbum, Playlist, Program, Recording, Season, Series, Studio, Trailer, TvChannel, TvProgram, UserRootFolder, UserView, Video, Year]
      style: form
      explode: false
    Fields:
      name: Fields
      in: query
      required: false
      description: Accepted bounded comma-separated compatibility hints; unsupported fields are ignored.
      schema:
        type: array
        maxItems: 100
        items: { type: string, minLength: 1, maxLength: 256 }
      style: form
      explode: false
    SortBy:
      name: SortBy
      in: query
      required: false
      description: Accepted bounded comma-separated compatibility hints. SortName or Name alone selects title order; other standard Jellyfin sort hints fall back to deterministic native catalog order.
      schema:
        type: array
        maxItems: 100
        items: { type: string, minLength: 1, maxLength: 256 }
      style: form
      explode: false
    SortOrder:
      name: SortOrder
      in: query
      required: false
      schema: { type: string, enum: [Ascending, Descending], default: Ascending }
    EnableUserData:
      name: EnableUserData
      in: query
      required: false
      schema: { type: boolean, default: true }
    Ids:
      name: Ids
      in: query
      required: false
      description: Comma-separated canonical item UUIDs, at most 100.
      schema:
        type: array
        maxItems: 100
        items: { $ref: "#/components/schemas/UUID" }
      style: form
      explode: false
    ApiKey:
      name: api_key
      in: query
      required: false
      description: Opaque compatibility credential, or the matching scoped PlaySessionId on stream URLs; accepted only on image and stream routes.
      schema: { type: string, minLength: 1 }
    ArtworkTag:
      name: tag
      in: query
      required: false
      description: Registered 64-hex artwork capability; accepted without a compatibility token.
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Range:
      name: Range
      in: header
      required: false
      description: A standard single byte range forwarded to the bounded delivery pipeline.
      schema: { type: string, pattern: "^bytes=[0-9]*-[0-9]*$" }
    StartTimeTicks:
      name: StartTimeTicks
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, maximum: 6048000000000, default: 0 }
    MaxStreamingBitrate:
      name: MaxStreamingBitrate
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 64000, maximum: 200000000 }
    MediaSourceId:
      name: MediaSourceId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    PlaySessionId:
      name: PlaySessionId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    StreamPlaySessionId:
      name: PlaySessionId
      in: query
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    StreamMediaSourceId:
      name: MediaSourceId
      in: query
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    StreamStartTimeTicks:
      name: StartTimeTicks
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, maximum: 6048000000000, default: 0 }
    SeriesId:
      name: SeriesId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UUID" }
  headers:
    WWWAuthenticate:
      description: MediaBrowser authentication challenge.
      schema: { type: string, const: MediaBrowser }
    CacheControlNoStore:
      description: Compatibility JSON and errors are not cacheable.
      schema: { type: string, const: no-store }
    CacheControlImmutable:
      description: Registered artwork bytes are immutable for one year.
      schema: { type: string, const: "public, max-age=31536000, immutable" }
    ContentLength:
      description: Byte length when known.
      schema: { type: integer, minimum: 0 }
    ETag:
      description: Validator generated by the existing bounded delivery service.
      schema: { type: string }
    AcceptRanges:
      description: Supported range unit.
      schema: { type: string, const: bytes }
    ContentRange:
      description: Selected byte range or unsatisfied total length.
      schema: { type: string }
    RetryAfter:
      description: Seconds before retrying temporarily saturated watch synchronization.
      schema: { type: integer, const: 5 }
  responses:
    CompatibilityNotRegistered:
      description: The feature-gated compatibility adapter is disabled, so the exact route is not registered.
      content:
        text/plain:
          schema: { type: string }
    PublicSystemInfo:
      description: Public compatibility identity.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PublicSystemInfo" }
    Ping:
      description: JSON compatibility product name.
      content:
        application/json:
          schema: { type: string, const: Rivune Jellyfin Compatibility }
    SystemEndpoint:
      description: Conservative endpoint classification; neither local nor in-network is claimed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SystemEndpointInfo" }
    QuickConnectDisabled:
      description: Quick Connect is not implemented.
      content:
        application/json:
          schema: { type: boolean, const: false }
    AuthenticationResult:
      description: Bound profile, session metadata, and newly issued compatibility credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthenticationResult" }
    PublicUsers:
      description: Typed empty list; public profile enumeration is disabled.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: { $ref: "#/components/schemas/UserDto" }
    SystemInfo:
      description: Authenticated server identity.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SystemInfo" }
    User:
      description: The profile bound to this credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserDto" }
    Plugins:
      description: Typed empty plugin list; Jellyfin plugins are not hosted.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: { $ref: "#/components/schemas/PluginInfo" }
    Packages:
      description: Typed empty package list; Jellyfin packages are not hosted.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: { $ref: "#/components/schemas/PackageInfo" }
    BrandingConfiguration:
      description: Empty branding object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BrandingConfiguration" }
    DisplayPreferences:
      description: Minimal stable display defaults.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DisplayPreferencesDto" }
    VirtualFolders:
      description: Stable media roots plus profile-authorized named Rivune collection views.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/VirtualFolderInfo" }
    ItemQueryResult:
      description: Bounded authorized page. Catalog and configured-folder totals are exact; a resolved folder page may report the observed canonical window plus one while its provider has more items.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BaseItemQueryResult" }
    LatestItems:
      description: Bounded latest media, or configured folder cards for an authorized named collection view.
      content:
        application/json:
          schema:
            type: array
            maxItems: 200
            items: { $ref: "#/components/schemas/BaseItemDto" }
    Item:
      description: One authorized catalog item.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BaseItemDto" }
    SearchHintResult:
      description: Bounded search hints; no privileged mutations or invented provider totals.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SearchHintResult" }
    Image:
      description: Original registered artwork bytes; never an upstream redirect.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControlImmutable" }
      content:
        image/jpeg: { schema: { type: string, format: binary } }
        image/png: { schema: { type: string, format: binary } }
        image/webp: { schema: { type: string, format: binary } }
    ImageHead:
      description: Artwork metadata with the same headers as GET and no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControlImmutable" }
    PlaybackInfo:
      description: Opaque, profile/session/device-bound playback negotiation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaybackInfoResponse" }
    Stream:
      description: Complete stream bytes from the existing Rivune delivery pipeline.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
        video/mp4: { schema: { type: string, format: binary } }
        video/x-matroska: { schema: { type: string, format: binary } }
        application/vnd.apple.mpegurl: { schema: { type: string, format: binary } }
    PartialStream:
      description: Satisfiable byte range.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
    StreamHead:
      description: Complete stream headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
    PartialStreamHead:
      description: Partial stream headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        ETag: { $ref: "#/components/headers/ETag" }
    RangeNotSatisfiable:
      description: Requested byte range cannot be served.
      headers:
        Content-Range: { $ref: "#/components/headers/ContentRange" }
    UserData:
      description: Current watch state after the idempotent mutation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserItemDataDto" }
    NoContent:
      description: Operation completed; no response body.
    BadRequest:
      description: Malformed, oversized, ambiguous, or out-of-bounds request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    Unauthorized:
      description: Missing, invalid, expired, revoked, or wrong-audience compatibility credential.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    NotFound:
      description: Unknown, inaccessible, mismatched-profile, or expired scoped resource; fails closed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    Conflict:
      description: Watch state changed concurrently after the one safe merge retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    ServiceUnavailable:
      description: Compatibility service or bounded watch synchronization is temporarily unavailable.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    BadGateway:
      description: Registered artwork or a bounded playback source could not be materialized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    UnprocessableEntity:
      description: Device profile or selected source is unsupported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    PlaybackUnavailable:
      description: Playback capacity is temporarily exhausted.
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema: { type: integer, const: 10 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    InsufficientStorage:
      description: Bounded playback storage capacity is exhausted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    HeadError:
      description: Error status with no response body for a HEAD request.
    HeadUnauthorized:
      description: Authentication failed; no response body for a HEAD request.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
    HeadPlaybackUnavailable:
      description: Playback capacity is temporarily exhausted; no response body.
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema: { type: integer, const: 10 }
    CompatError:
      description: Public, secret-free compatibility error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    PublicSystemInfo:
      type: object
      additionalProperties: false
      required: [Id, LocalAddress, ServerName, Version, ProductName, OperatingSystem, StartupWizardCompleted]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        LocalAddress: { type: string }
        ServerName: { type: string, minLength: 1, maxLength: 80 }
        Version: { type: string, const: 10.11.0 }
        ProductName: { type: string, const: Jellyfin Server }
        OperatingSystem: { type: string }
        StartupWizardCompleted: { type: boolean, const: true }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [Id, LocalAddress, ServerName, Version, ProductName, OperatingSystem, StartupWizardCompleted]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        LocalAddress: { type: string }
        ServerName: { type: string, minLength: 1, maxLength: 80 }
        Version: { type: string, const: 10.11.0 }
        ProductName: { type: string, const: Jellyfin Server }
        StartupWizardCompleted: { type: boolean, const: true }
        OperatingSystem: { type: string }
    SystemEndpointInfo:
      type: object
      additionalProperties: false
      required: [IsLocal, IsInNetwork]
      properties:
        IsLocal: { type: boolean, const: false }
        IsInNetwork: { type: boolean, const: false }
    AuthenticateByName:
      type: object
      additionalProperties: false
      anyOf:
        - required: [Username]
        - required: [UserName]
      allOf:
        - anyOf:
            - required: [Pw]
            - required: [Password]
      properties:
        Username:
          type: string
          format: uuid
          description: Stable opaque profile credential UUID issued by Rivune.
        UserName:
          type: string
          format: uuid
        Pw:
          type: string
          minLength: 54
          maxLength: 54
          pattern: "^rivune_jfa_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          x-maxUtf8Bytes: 54
          description: Canonical one-shot Rivune profile application password.
        Password:
          type: string
          minLength: 54
          maxLength: 54
          pattern: "^rivune_jfa_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          x-maxUtf8Bytes: 54
          description: Canonical one-shot Rivune profile application password.
      description: >
        If both aliases in a pair are sent they must be identical. The JSON body is
        limited to 16 KiB and unknown properties or multiple JSON values are rejected.
    AuthenticationResult:
      type: object
      additionalProperties: false
      required: [User, SessionInfo, AccessToken, ServerId]
      properties:
        User: { $ref: "#/components/schemas/UserDto" }
        SessionInfo: { $ref: "#/components/schemas/SessionInfoDto" }
        AccessToken:
          type: string
          pattern: "^rivune_jf_[A-Za-z0-9_-]+$"
          description: Returned only at issue time; the server persists its SHA-256 digest.
        ServerId: { $ref: "#/components/schemas/UUID" }
    UserDto:
      type: object
      additionalProperties: false
      required:
        - Name
        - ServerId
        - Id
        - HasPassword
        - HasConfiguredPassword
        - HasConfiguredEasyPassword
        - Policy
        - Configuration
      properties:
        Name: { type: string, minLength: 1, maxLength: 120 }
        ServerId: { $ref: "#/components/schemas/UUID" }
        Id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: UUID of the single profile bound to this compatibility credential.
        HasPassword: { type: boolean }
        HasConfiguredPassword: { type: boolean }
        HasConfiguredEasyPassword: { type: boolean, const: false, description: Profile PINs are not exposed through the compatibility API. }
        Policy: { $ref: "#/components/schemas/UserPolicy" }
        Configuration: { $ref: "#/components/schemas/UserConfiguration" }
    UserPolicy:
      type: object
      additionalProperties: false
      required:
        - IsAdministrator
        - IsDisabled
        - EnablePlayback
        - EnableAudioPlaybackTranscoding
        - EnableVideoPlaybackTranscoding
      properties:
        IsAdministrator: { type: boolean }
        IsDisabled: { type: boolean }
        EnablePlayback: { type: boolean }
        EnableAudioPlaybackTranscoding: { type: boolean }
        EnableVideoPlaybackTranscoding: { type: boolean }
    UserConfiguration:
      type: object
      additionalProperties: false
      required: [PlayDefaultAudioTrack, SubtitleMode, OrderedViews, LatestItemsExcludes, MyMediaExcludes, GroupedFolders]
      properties:
        PlayDefaultAudioTrack: { type: boolean }
        SubtitleMode: { type: string }
        OrderedViews:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
        LatestItemsExcludes:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
        MyMediaExcludes:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
          description: Presentation hints for named collection views; client behavior is not mandated.
        GroupedFolders:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
    SessionInfoDto:
      type: object
      additionalProperties: false
      required: [Id, UserId, UserName, Client, DeviceName, DeviceId, ApplicationVersion, ServerId, IsActive]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        UserId: { $ref: "#/components/schemas/UUID" }
        UserName: { type: string, minLength: 1, maxLength: 120 }
        Client: { type: string, minLength: 1, maxLength: 64 }
        DeviceName: { type: string, minLength: 1, maxLength: 120 }
        DeviceId: { type: string, minLength: 1, maxLength: 128 }
        ApplicationVersion: { type: string, minLength: 1, maxLength: 32 }
        ServerId: { $ref: "#/components/schemas/UUID" }
        IsActive: { type: boolean, const: true }
        NowPlayingItem: { $ref: "#/components/schemas/BaseItemDto" }
    BaseItemQueryResult:
      type: object
      additionalProperties: false
      required: [Items, TotalRecordCount, StartIndex]
      properties:
        Items:
          type: array
          items: { $ref: "#/components/schemas/BaseItemDto" }
        TotalRecordCount: { type: integer, minimum: 0 }
        StartIndex: { type: integer, minimum: 0, maximum: 1000000 }
    BaseItemDto:
      type: object
      additionalProperties: false
      required: [Id, ServerId, Name, Etag, LocationType, Type, MediaType, IsFolder, IsPlayable, Genres, ImageTags, BackdropImageTags]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        ServerId: { $ref: "#/components/schemas/UUID" }
        Name: { type: string }
        Etag: { $ref: "#/components/schemas/UUID" }
        Path:
          type: string
          description: Local deferred `.strm` path for playable catalogue items; never an upstream provider URL.
        DisplayPreferencesId: { $ref: "#/components/schemas/UUID" }
        LocationType: { type: string, enum: [FileSystem] }
        SortName: { type: string }
        OriginalTitle: { type: string }
        Type: { type: string, enum: [CollectionFolder, Folder, BoxSet, Movie, Series, Season, Episode] }
        MediaType: { type: string, enum: [Video, Unknown] }
        IsFolder: { type: boolean }
        IsPlayable: { type: boolean }
        CollectionType: { type: string, enum: [movies, tvshows, boxsets, mixed, homevideos] }
        ParentId: { $ref: "#/components/schemas/UUID" }
        SeriesId: { $ref: "#/components/schemas/UUID" }
        SeasonId: { $ref: "#/components/schemas/UUID" }
        SeriesName: { type: string }
        SeasonName: { type: string }
        IndexNumber: { type: integer }
        ParentIndexNumber: { type: integer }
        Overview: { type: string }
        Taglines:
          type: array
          items: { type: string }
        Status: { type: string }
        EndDate: { type: string, format: date-time }
        PremiereDate: { type: string, format: date-time }
        ProductionYear: { type: integer, minimum: 1, maximum: 9999 }
        RunTimeTicks:
          type: integer
          format: int64
          minimum: 0
          description: Checked/saturating 10,000,000 ticks per second.
        Genres:
          type: array
          items: { type: string }
        CommunityRating: { type: number, format: float }
        PrimaryImageAspectRatio:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Configured folder-cover display ratio when the item is a Rivune collection folder.
        ProviderIds:
          type: object
          additionalProperties: { type: string }
          description: Public provider identifiers only; never source URLs, headers, cookies, or secrets.
        ImageTags:
          type: object
          additionalProperties: { type: string }
        BackdropImageTags:
          type: array
          items: { type: string }
        UserData: { $ref: "#/components/schemas/UserItemDataDto" }
        People:
          type: array
          items: { $ref: "#/components/schemas/BaseItemPerson" }
        MediaSources:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MediaSourceInfo" }
          description: Deferred item-ID sentinels in catalogue arrays; scoped playable sources on VidHub item details and PlaybackInfo.
    BaseItemPerson:
      type: object
      additionalProperties: false
      required: [Name, Type]
      properties:
        Name: { type: string, minLength: 1 }
        Role: { type: string }
        Type: { type: string, enum: [Actor] }
        PrimaryImageTag: { type: string }
    UserItemDataDto:
      type: object
      additionalProperties: false
      required: [PlaybackPositionTicks, PlayCount, IsFavorite, Played, Key]
      properties:
        PlaybackPositionTicks: { type: integer, format: int64, minimum: 0 }
        PlayCount: { type: integer, enum: [0, 1] }
        IsFavorite: { type: boolean, description: Rivune library membership. }
        Played: { type: boolean }
        Key: { $ref: "#/components/schemas/UUID" }
        LastPlayedDate: { type: string, format: date-time }
    SearchHintDto:
      type: object
      additionalProperties: false
      required: [ItemId, Id, Name, Type]
      properties:
        ItemId: { $ref: "#/components/schemas/UUID" }
        Id: { $ref: "#/components/schemas/UUID" }
        Name: { type: string }
        Type: { type: string, enum: [Movie, Series, Season, Episode] }
        MediaType: { type: string, enum: [Video] }
        PrimaryImageTag: { type: string }
        ThumbImageTag: { type: string }
        BackdropImageTag: { type: string }
        ProductionYear: { type: integer, minimum: 1, maximum: 9999 }
        RunTimeTicks: { type: integer, format: int64, minimum: 0 }
        ProviderIds:
          type: object
          additionalProperties: { type: string }
    SearchHintResult:
      type: object
      additionalProperties: false
      required: [SearchHints, TotalRecordCount]
      properties:
        SearchHints:
          type: array
          items: { $ref: "#/components/schemas/SearchHintDto" }
        TotalRecordCount: { type: integer, minimum: 0, description: "Exact deduplicated total when every source proves exhaustion; 0 when an enabled provider cannot supply an exact total." }
    VirtualFolderInfo:
      type: object
      additionalProperties: false
      required: [Name, Locations, CollectionType, ItemId, Id]
      properties:
        Name: { type: string, minLength: 1 }
        Locations:
          type: array
          maxItems: 0
          items: { type: string }
        CollectionType: { type: string, enum: [movies, tvshows, boxsets, mixed, homevideos] }
        ItemId: { $ref: "#/components/schemas/UUID" }
        Id: { $ref: "#/components/schemas/UUID" }
    PlaybackInfoRequest:
      type: object
      properties:
        UserId:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: Must equal the profile bound to the credential.
        StartTimeTicks: { type: integer, format: int64, minimum: 0, maximum: 6048000000000 }
        IsPlayback: { type: boolean, description: Accepted compatibility hint. }
        AutoOpenLiveStream: { type: boolean, description: Accepted compatibility hint. }
        MaxStreamingBitrate:
          anyOf:
            - { type: integer, format: int64, const: 0 }
            - { type: integer, format: int64, minimum: 64000, maximum: 200000000 }
        MediaSourceId: { type: string, minLength: 1, maxLength: 128 }
        DeviceProfile: { $ref: "#/components/schemas/DeviceProfile" }
      description: JSON body is limited to 256 KiB; one trailing JSON value is rejected.
    PlaybackInfoResponse:
      type: object
      additionalProperties: false
      required: [MediaSources, PlaySessionId]
      properties:
        MediaSources:
          type: array
          items: { $ref: "#/components/schemas/MediaSourceInfo" }
        PlaySessionId: { type: string, minLength: 1, maxLength: 256 }
        ErrorCode: { type: string }
    MediaSourceInfo:
      type: object
      additionalProperties: false
      required:
        - Id
        - Path
        - Protocol
        - Type
        - IsRemote
        - SupportsDirectPlay
        - SupportsDirectStream
        - SupportsTranscoding
        - MediaStreams
      properties:
        Id: { type: string, minLength: 1, maxLength: 256 }
        Name: { type: string }
        Path:
          type: string
          description: Local stream URL carrying only opaque item, source, and scoped play-session selectors.
        Container: { type: string, maxLength: 16 }
        Protocol: { type: string, enum: [File, Http] }
        Type: { type: string, enum: [Default] }
        IsRemote: { type: boolean, const: false }
        SupportsDirectPlay: { type: boolean }
        SupportsDirectStream: { type: boolean }
        SupportsTranscoding: { type: boolean }
        RunTimeTicks: { type: integer, format: int64, minimum: 0 }
        Bitrate: { type: integer, format: int64, minimum: 0 }
        ETag: { type: string }
        MediaStreams:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/MediaStreamInfo" }
        DefaultAudioStreamIndex: { type: integer, minimum: 0 }
        TranscodingUrl:
          type: string
          description: Local scoped HLS compatibility URL only, never an upstream provider URL.
        TranscodingSubProtocol: { type: string }
        TranscodingContainer: { type: string }
    MediaStreamInfo:
      type: object
      additionalProperties: false
      required: [Type, Index, IsDefault, IsForced, IsExternal]
      properties:
        Codec: { type: string, enum: [h264, hevc, av1, vp9, aac, ac3, eac3, opus, dts, truehd, flac, mp3, srt, ass, webvtt, pgs] }
        Language: { type: string, pattern: "^[a-z]{1,12}$" }
        DisplayTitle: { type: string, maxLength: 16 }
        Type: { type: string, enum: [Video, Audio, Subtitle] }
        Index: { type: integer, minimum: 0 }
        IsDefault: { type: boolean }
        IsForced: { type: boolean }
        IsExternal: { type: boolean, const: false }
        Width: { type: integer, minimum: 1, maximum: 16384 }
        Height: { type: integer, minimum: 1, maximum: 16384 }
        Channels: { type: integer, minimum: 1, maximum: 64 }
        BitRate: { type: integer, format: int64, minimum: 1 }
    DeviceProfile:
      type: object
      additionalProperties: true
      properties:
        Name: { type: string, maxLength: 128 }
        MaxStreamingBitrate:
          anyOf:
            - { type: integer, format: int64, const: 0 }
            - { type: integer, format: int64, minimum: 64000, maximum: 200000000 }
        DirectPlayProfiles:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/DirectPlayProfile" }
        TranscodingProfiles:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/TranscodingProfile" }
        SubtitleProfiles:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/SubtitleProfile" }
    DirectPlayProfile:
      type: object
      additionalProperties: true
      properties:
        Container: { type: string, maxLength: 2048 }
        AudioCodec: { type: string, maxLength: 2048 }
        VideoCodec: { type: string, maxLength: 2048 }
        Type: { type: string, maxLength: 64 }
    TranscodingProfile:
      type: object
      additionalProperties: true
      properties:
        Container: { type: string, maxLength: 2048 }
        Type: { type: string, maxLength: 64 }
        VideoCodec: { type: string, maxLength: 2048 }
        AudioCodec: { type: string, maxLength: 2048 }
        Protocol: { type: string, maxLength: 64 }
        Context: { type: string, maxLength: 64 }
        EnableMpegtsM2TsMode: { type: boolean }
        BreakOnNonKeyFrames: { type: boolean }
    SubtitleProfile:
      type: object
      additionalProperties: true
      properties:
        Format: { type: string, maxLength: 2048 }
        Method: { type: string, maxLength: 64 }
    PlaybackProgressInfo:
      type: object
      required: [ItemId, PlaySessionId]
      properties:
        UserId:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: When present, must equal the profile bound to the credential.
        ItemId: { $ref: "#/components/schemas/UUID" }
        MediaSourceId: { type: string, minLength: 1, maxLength: 256 }
        PlaySessionId: { type: string, minLength: 1, maxLength: 256 }
        PositionTicks: { type: integer, format: int64, minimum: 0 }
        PlaybackStartTimeTicks: { type: integer, format: int64, minimum: 0 }
        IsPaused: { type: boolean }
        IsMuted: { type: boolean }
        PlayMethod: { type: string }
      description: Body is limited to 1 MiB; profile/item/source/session ownership is revalidated.
    PlaybackPing:
      type: object
      properties:
        PlaySessionId: { type: string, minLength: 1, maxLength: 256 }
      description: PlaySessionId may instead be supplied once in the query, but conflicting values fail.
    DisplayPreferencesDto:
      type: object
      additionalProperties: false
      required: [Id, ViewType, RememberIndexing, IndexBy, CustomPrefs, ScrollDirection]
      properties:
        Id: { type: string, minLength: 1, maxLength: 128 }
        ViewType: { type: string }
        RememberIndexing: { type: boolean }
        IndexBy: { type: string }
        CustomPrefs:
          type: object
          additionalProperties: { type: string }
        ScrollDirection: { type: string }
    PluginInfo:
      type: object
      additionalProperties: false
      maxProperties: 0
    PackageInfo:
      type: object
      additionalProperties: false
      maxProperties: 0
    BrandingConfiguration:
      type: object
      additionalProperties: false
      maxProperties: 0
    CompatErrorResponse:
      type: object
      additionalProperties: false
      required: [ResponseStatus]
      properties:
        ResponseStatus:
          $ref: "#/components/schemas/CompatErrorStatus"
    CompatErrorStatus:
      type: object
      additionalProperties: false
      required: [ErrorCode, Message]
      properties:
        ErrorCode: { type: string, minLength: 1, maxLength: 64 }
        Message:
          type: string
          minLength: 1
          maxLength: 256
          description: Public and scrubbed; never contains credentials, provider URLs, SQL, or raw upstream errors.
