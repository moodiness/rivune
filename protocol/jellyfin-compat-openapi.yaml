        Codec: { type: string, maxLength: 2048 }
        Conditions:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/ProfileCondition" }
    ProfileCondition:
      type: object
      additionalProperties: true
      properties:
        Condition: { type: string, maxLength: 64, description: LessThanEqual and NotEquals are recognized case-insensitively. }
        Property: { type: string, maxLength: 64, description: VideoLevel and VideoRangeType are recognized case-insensitively. }
        Value: { type: string, maxLength: 64 }
        IsRequired: { type: boolean }
      description: Required conditions whose inspected property is unknown prevent direct playback; optional unknown properties remain neutral.
    DirectPlayProfile:
      type: object
      additionalProperties: true
      properties:
        Container: { type: string, maxLength: 2048 }
        AudioCodec: { type: string, maxLength: 2048 }
        VideoCodec: { type: string, maxLength: 2048 }
        Type: { type: string, maxLength: 64 }
    TranscodingProfile:
      type: object
      additionalProperties: true
      properties:
        Container: { type: string, maxLength: 2048 }
        Type: { type: string, maxLength: 64 }
        VideoCodec: { type: string, maxLength: 2048 }
        AudioCodec: { type: string, maxLength: 2048 }
        Protocol: { type: string, maxLength: 64 }
        Context: { type: string, maxLength: 64 }
        MaxAudioChannels: { type: string, pattern: "^(?:[1-9]|[12][0-9]|3[0-2])$", maxLength: 2 }
        EnableMpegtsM2TsMode: { type: boolean }
        BreakOnNonKeyFrames: { type: boolean }
    SubtitleProfile:
      type: object
      additionalProperties: true
      properties:
        Format: { type: string, maxLength: 2048 }
        Method: { type: string, maxLength: 64 }
    PlaybackProgressInfo:
      type: object
      required: [ItemId, PlaySessionId]
      properties:
        UserId:
          allOf: [{ $ref: "#/components/schemas/UUIDInput" }]
          description: When present, must equal the profile bound to the credential.
        ItemId: { $ref: "#/components/schemas/UUIDInput" }
        MediaSourceId: { type: string, minLength: 1, maxLength: 256 }
        PlaySessionId: { type: string, minLength: 1, maxLength: 256 }
        PositionTicks: { type: integer, format: int64, minimum: 0 }
        AudioStreamIndex: { type: integer, minimum: 0, maximum: 2047 }
        SubtitleStreamIndex: { type: integer, minimum: -1, maximum: 2047 }
        CanSeek: { type: boolean }
        PlaybackStartTimeTicks: { type: integer, format: int64, minimum: 0 }
        IsPaused: { type: boolean }
        IsMuted: { type: boolean }
        PlayMethod: { type: string, enum: [DirectPlay, DirectStream, Transcode] }
      description: Body is limited to 1 MiB; profile/item/source/session ownership is revalidated.
    PlaybackPing:
      type: object
      properties:
        PlaySessionId: { type: string, minLength: 1, maxLength: 256 }
      description: PlaySessionId may instead be supplied once in the query, but conflicting values fail.
    DisplayPreferencesDto:
      type: object
