        Protocol: { type: string, const: File }
        Type: { type: string, const: Default }
        IsRemote: { type: boolean, const: false }
        SupportsDirectPlay: { type: boolean }
        SupportsDirectStream: { type: boolean }
        SupportsTranscoding: { type: boolean }
        SupportsProbing: { type: boolean, const: true }
        VideoType: { type: string, const: VideoFile }
        Size: { type: integer, format: int64, minimum: 0 }
        RunTimeTicks: { type: integer, format: int64, minimum: 0 }
        Bitrate: { type: integer, format: int64, minimum: 0 }
        ETag: { type: string }
        Formats:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 16 }
        RequiredHttpHeaders:
          type: object
          additionalProperties: { type: string, maxLength: 4096 }
          maxProperties: 32
        MediaAttachments:
          type: array
          maxItems: 64
          items: { type: object, additionalProperties: true }
        MediaStreams:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/MediaStreamInfo" }
        DefaultAudioStreamIndex: { type: integer, minimum: 0 }
        TranscodingUrl:
          type: string
          description: Local scoped HLS compatibility URL only, never an upstream provider URL.
        TranscodingSubProtocol: { type: string, const: hls }
        TranscodingContainer: { type: string, enum: [ts, mp4] }
