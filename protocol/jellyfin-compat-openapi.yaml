      additionalProperties: false
      required: [MediaSources, PlaySessionId]
      properties:
        MediaSources:
          type: array
          items: { $ref: "#/components/schemas/MediaSourceInfo" }
        PlaySessionId: { type: string, minLength: 36, maxLength: 36, pattern: "^rvp_[A-Za-z0-9_-]{32}$", description: "Reserved 192-bit owner/item/source-bound capability, never a general credential." }
        ErrorCode: { type: string }
