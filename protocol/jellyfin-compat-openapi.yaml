        UnplayedItemCount: { type: [integer, "null"], minimum: 0, description: Validated compatibility field; does not mutate state. }
        PlaybackPositionTicks: { type: [integer, "null"], format: int64, minimum: 0, maximum: 21474836470000000 }
        PlayCount: { type: [integer, "null"], minimum: 0, description: Validated compatibility field; does not mutate state. }
        IsFavorite: { type: [boolean, "null"] }
        Likes: { type: [boolean, "null"], description: Accepted compatibility field; does not mutate state. }
        LastPlayedDate: { type: [string, "null"], description: Accepted compatibility field; does not mutate state. }
