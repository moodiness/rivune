        StartTimeTicks: { type: integer, format: int64, minimum: 0, maximum: 6048000000000 }
        IsPlayback: { type: boolean, description: Accepted compatibility hint. }
        AutoOpenLiveStream: { type: boolean, description: Accepted compatibility hint. }
        MaxStreamingBitrate:
          anyOf:
            - { type: integer, format: int64, const: 0 }
            - { type: integer, format: int64, minimum: 64000, maximum: 2147483647, description: Client ceiling; values above Rivune's playback ceiling are accepted and safely clamped. }
        MaxAudioChannels: { type: integer, minimum: 0, maximum: 32 }
        MediaSourceId: { type: string, minLength: 1, maxLength: 128 }
        AudioStreamIndex: { type: [integer, "null"], minimum: -1, maximum: 1024 }
        SubtitleStreamIndex: { type: [integer, "null"], minimum: -1, maximum: 1024 }
        EnableDirectPlay: { type: [boolean, "null"] }
        EnableDirectStream: { type: [boolean, "null"] }
        EnableTranscoding: { type: [boolean, "null"] }
        AllowVideoStreamCopy: { type: [boolean, "null"] }
        AllowAudioStreamCopy: { type: [boolean, "null"] }
        DeviceProfile: { $ref: "#/components/schemas/DeviceProfile" }
      description: JSON body is limited to 256 KiB; one trailing JSON value is rejected. Query values override matching body fields.
