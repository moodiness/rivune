        SortBy: { type: string, maxLength: 128 }
        IndexBy: { type: string, maxLength: 128 }
        RememberIndexing: { type: boolean }
        PrimaryImageHeight: { type: integer, format: int32, minimum: 0, maximum: 8192 }
        PrimaryImageWidth: { type: integer, format: int32, minimum: 0, maximum: 8192 }
        CustomPrefs: { type: object, maxProperties: 64, propertyNames: { minLength: 1, maxLength: 64 }, additionalProperties: { type: string, maxLength: 1024 } }
        ScrollDirection: { type: string, maxLength: 128 }
        ShowBackdrop: { type: boolean }
        RememberSorting: { type: boolean }
        SortOrder: { type: string, maxLength: 128 }
        ShowSidebar: { type: boolean }
        Client: { type: string, minLength: 1, maxLength: 64 }
    DisplayPreferencesUpdateDto:
      type: object
      additionalProperties: false
      properties:
        Id: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._-]*$" }
        ViewType: { type: string, maxLength: 128 }
        SortBy: { type: string, maxLength: 128 }
        IndexBy: { type: string, maxLength: 128 }
        RememberIndexing: { type: boolean }
        PrimaryImageHeight: { type: integer, format: int32, minimum: 0, maximum: 8192 }
        PrimaryImageWidth: { type: integer, format: int32, minimum: 0, maximum: 8192 }
        CustomPrefs: { type: [object, "null"], maxProperties: 64, propertyNames: { minLength: 1, maxLength: 64 }, additionalProperties: { type: string, maxLength: 1024 } }
        ScrollDirection: { type: string, maxLength: 128 }
        ShowBackdrop: { type: boolean }
        RememberSorting: { type: boolean }
        SortOrder: { type: string, maxLength: 128 }
        ShowSidebar: { type: boolean }
        Client: { type: string, maxLength: 64 }
