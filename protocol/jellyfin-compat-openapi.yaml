          maxItems: 0
          items: { type: string }
        CollectionType: { type: string, enum: [movies, tvshows, boxsets, mixed, unknown] }
        ItemId: { $ref: "#/components/schemas/UUID" }
        Id: { $ref: "#/components/schemas/UUID" }
