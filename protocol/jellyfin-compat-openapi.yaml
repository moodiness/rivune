      type: object
      additionalProperties: false
      required: [Type, Index, IsDefault, IsForced, IsExternal, IsExternalUrl, IsTextSubtitleStream, SupportsExternalStream]
      properties:
        Codec: { type: string, enum: [h264, hevc, av1, vp9, aac, ac3, eac3, opus, dts, truehd, flac, mp3, srt, ass, webvtt, pgs] }
        Language: { type: string, pattern: "^[a-z]{1,12}$" }
        DisplayTitle: { type: string, maxLength: 16 }
        Type: { type: string, enum: [Video, Audio, Subtitle] }
        Index: { type: integer, minimum: 0, description: External subtitle facade bindings are additionally limited to 2047. }
        IsDefault: { type: boolean }
        IsForced: { type: boolean }
        IsExternal: { type: boolean }
        IsExternalUrl: { type: boolean, const: false }
        IsTextSubtitleStream: { type: boolean }
        SupportsExternalStream: { type: boolean }
        DeliveryMethod: { type: string, const: External }
        DeliveryUrl:
          type: string
          description: Same-origin VTT facade URL with only source, scoped capability, and optional start selectors.
        Width: { type: integer, minimum: 1, maximum: 16384 }
        Height: { type: integer, minimum: 1, maximum: 16384 }
        Channels: { type: integer, minimum: 1, maximum: 64 }
        BitRate: { type: integer, format: int64, minimum: 1 }
    DeviceProfile:
      type: object
      additionalProperties: true
      properties:
        Name: { type: string, maxLength: 128 }
        MaxStreamingBitrate:
          anyOf:
            - { type: integer, format: int64, const: 0 }
            - { type: integer, format: int64, minimum: 64000, maximum: 2147483647, description: Client ceiling; values above Rivune's playback ceiling are accepted and safely clamped. }
        CodecProfiles:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/CodecProfile" }
