        PlayCount: { type: integer, enum: [0, 1] }
        IsFavorite: { type: boolean, description: Active profile favorite state. }
        Likes: { type: boolean }
        LastPlayedDate: { type: string, format: date-time }
        Played: { type: boolean }
        Key: { $ref: "#/components/schemas/UUID" }
        ItemId: { $ref: "#/components/schemas/UUID" }
    UpdateUserItemDataDto:
      type: object
      additionalProperties: false
      properties:
        PlaybackPositionTicks: { type: [integer, "null"], format: int64, minimum: 0, maximum: 21474836470000000 }
        IsFavorite: { type: [boolean, "null"] }
        Played: { type: [boolean, "null"] }
        Key: { oneOf: [{ $ref: "#/components/schemas/UUIDInput" }, { type: "null" }], description: "When present, must identify the path item." }
        ItemId: { oneOf: [{ $ref: "#/components/schemas/UUIDInput" }, { type: "null" }], description: "When present, must identify the path item." }
      description: Body is limited to 16 KiB. Omitted and null fields mean unchanged; an empty object is valid. Unsupported Jellyfin user-data fields are rejected rather than silently ignored.
    SearchHintDto:
      type: object
      additionalProperties: false
      required: [ItemId, Id, Name, Type]
      properties:
        ItemId: { $ref: "#/components/schemas/UUID" }
        Id: { $ref: "#/components/schemas/UUID" }
        Name: { type: string }
        Type: { type: string, enum: [Movie, Series, Season, Episode] }
        MediaType: { type: string, enum: [Video] }
        PrimaryImageTag: { type: string }
        ThumbImageTag: { type: string }
        BackdropImageTag: { type: string }
        ProductionYear: { type: integer, minimum: 1, maximum: 9999 }
        RunTimeTicks: { type: integer, format: int64, minimum: 0 }
        ProviderIds:
          type: object
          additionalProperties: { type: string }
    SearchHintResult:
      type: object
      additionalProperties: false
      required: [SearchHints, TotalRecordCount]
      properties:
        SearchHints:
          type: array
          items: { $ref: "#/components/schemas/SearchHintDto" }
        TotalRecordCount: { type: integer, minimum: 0, description: "Exact deduplicated total when every source proves exhaustion; 0 when an enabled provider cannot supply an exact total." }
    VirtualFolderInfo:
      type: object
      additionalProperties: false
      required: [Name, Locations, CollectionType, ItemId, Id]
      properties:
        Name: { type: string, minLength: 1 }
        Locations:
