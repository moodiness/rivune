openapi: 3.1.0
info:
  title: Rivune Jellyfin Compatibility API
  version: 10.11.11
  description: |
    A deliberately bounded Jellyfin-compatible HTTP adapter for Rivune. The advertised
    `10.11.11` value is a compatibility contract version, not the Rivune product version
    and not a claim of general Jellyfin API compatibility.

    This contract is independent of Rivune's native `/api/v1` protocol and does not
    change its protocol version 19 semantics. A Jellyfin user is exactly one Rivune
    profile: authentication binds the compatibility credential to that profile, and
    every supplied `UserId`, item ID, media-source ID, or play-session ID is only a
    selector and never authority. A mismatched or inaccessible selector fails closed.

    Every documented root path also has one exact, lowercase, bounded `/emby` alias.
    The alias strips only the first `/emby` segment; `/Emby`, `/embyfoo`, and nested
    `/emby/emby` forms are not aliases. Unknown paths, unsupported methods, inaccessible
    resources, and disabled compatibility routing return a genuine 404 rather than the
    Rivune web application.

    LAN/UDP discovery and plugin/package ecosystems are non-goals. Clients must use a
    manually configured HTTP(S) URL. Rivune does not run Jellyfin plugins, expose
    provider URLs or credentials, or offer an unrestricted proxy. Only the operations
    in this document are supported.

    Browser-hosted Jellyfin clients receive CORS headers only for documented paths and
    methods. Preflight requests must name an implemented route and use the bounded
    allowlist of standard content, range, cache, and MediaBrowser authorization headers.

    Catalog/search/state list queries accept ASCII-case-insensitive parameter names,
    at most 64 values and 8,192 total name/value bytes; repeated scalar names are
    rejected while list parameters may repeat. Pages default to 100 items and never
    exceed 200. Compatibility authorization headers are limited to 2,048 bytes.
    Authentication JSON is limited to 16 KiB, PlaybackInfo JSON to 256 KiB, and
    playback-event JSON to 1 MiB. All adapter-generated JSON and error responses use
    `Cache-Control: no-store`, are
    PascalCase, bounded, and scrubbed of provider URLs, credentials, SQL, and raw
    upstream failures.

    Only the dedicated `rivune_jf_` credential audience is accepted; native
    `rivune_at_` tokens fail. Credential transports are inspected in Jellyfin order:
    `Authorization`, `X-Emby-Authorization`, `X-MediaBrowser-Authorization`,
    `X-Emby-Token`, `X-MediaBrowser-Token`, `ApiKey`, then `api_key`. The first
    populated token wins; lower-precedence transports are ignored. `Authorization`
    accepts `MediaBrowser`/`Emby` parameters or HTTP Bearer, while the two `X-*`
    authorization headers also accept unschemed parameters. Query credentials are
    accepted on every authenticated operation for protocol compatibility.

    Advertised media URLs use `rvp_` plus 192 bits of random material as a short-lived,
    item/source-bound `PlaySessionId` stream capability instead of serializing the profile credential.
    Artwork may instead use the opaque `tag` returned in item DTOs as an anonymous
    capability; a supplied invalid credential never falls back to an artwork tag.
    A stream with a missing or unusable credential may fall back to its matching scoped
    playback capability and revalidated owner. A valid foreign credential fails closed.

    Playback source enumeration remains bounded; the default source is opened during
    PlaybackInfo so clients receive inspected tracks, while alternate MediaSourceIds are
    opened only when selected. Compatibility play sessions contain opaque selectors, are bound to the
    credential/profile/device/item, and are capped at 256 active entries with a
    30-minute idle and two-hour absolute lifetime. Adapter-generated stream URLs carry only
    the scoped capability, never the general compatibility credential or a provider/source URL.

    The library hierarchy contains the stable `Movies`, `TV Shows`, and `Collections`
    virtual views plus one ordered, named view per profile-authorized Rivune collection.
    Collection views expose configured folders through `Items/Latest` and ordinary item
    browsing; promoted collection and folder projections use landscape `homevideos` cards
    with Primary, Thumb, Backdrop, and 16:9 metadata regardless of the native folder-cover
    preference. The synthetic Collections/BoxSet root preserves Jellyfin's poster contract.
    Opening a folder resolves only that folder into canonical Rivune movie/series UUIDs.
    Configured covers are reused directly;
    missing covers are hydrated through bounded folder resolution and registered as opaque
    same-origin artwork tags.
    `OrderedViews` and `MyMediaExcludes` are emitted as standard client presentation hints;
    clients remain responsible for their final home layout.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Exact compatibility routes at the Rivune server root.
  - url: /emby
    description: Single bounded lowercase alias for the same handlers.
tags:
  - name: Discovery
    description: Public and authenticated compatibility identity and bounded capability probes.
  - name: Authentication
    description: Profile-bound compatibility credential issuance and revocation.
  - name: Users
    description: The single Rivune profile bound to the compatibility credential.
  - name: Library
    description: Profile-authorized virtual views, hierarchy, and catalog items.
  - name: Search
    description: Bounded profile-authorized catalog hint search.
  - name: Artwork
    description: Authorized delivery of registered local artwork bytes.
  - name: Playback
    description: Bounded source negotiation and scoped in-process media delivery.
  - name: Sessions
    description: Bound playback lifecycle events and liveness.
  - name: Watch state
    description: Idempotent played state, resume items, and next-up projection.
security:
  - XEmbyToken: []
  - XMediaBrowserToken: []
  - AuthorizationToken: []
  - XEmbyAuthorizationToken: []
  - XMediaBrowserAuthorizationToken: []
  - BearerToken: []
  - ApiKeyQuery: []
  - ApiKeyCompactQuery: []
x-playback-security: &playbackSecurity
  - XEmbyToken: []
  - XMediaBrowserToken: []
  - AuthorizationToken: []
  - XEmbyAuthorizationToken: []
  - XMediaBrowserAuthorizationToken: []
  - BearerToken: []
  - ApiKeyQuery: []
  - ApiKeyCompactQuery: []
  - PlaybackCapabilityQuery: []
paths:
  /System/Info/Public:
    get:
      tags: [Discovery]
      summary: Get public server identity
      operationId: getJellyfinPublicSystemInfo
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicSystemInfo" }
        "404": { $ref: "#/components/responses/CompatibilityNotRegistered" }
        default: { $ref: "#/components/responses/CompatError" }
  /System/Ping:
    get:
      tags: [Discovery]
      summary: Probe compatibility availability
      operationId: pingJellyfinCompatibility
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ping" }
        "404": { $ref: "#/components/responses/CompatibilityNotRegistered" }
        default: { $ref: "#/components/responses/CompatError" }
    post:
      tags: [Discovery]
      summary: Probe compatibility availability
      operationId: postJellyfinCompatibilityPing
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ping" }
        "404": { $ref: "#/components/responses/CompatibilityNotRegistered" }
        default: { $ref: "#/components/responses/CompatError" }
  /System/Endpoint:
    get:
      tags: [Discovery]
      summary: Get conservative network classification
      operationId: getJellyfinSystemEndpoint
      security: []
      responses:
        "200": { $ref: "#/components/responses/SystemEndpoint" }
        "404": { $ref: "#/components/responses/CompatibilityNotRegistered" }
        default: { $ref: "#/components/responses/CompatError" }
  /QuickConnect/Enabled:
    get:
      tags: [Discovery]
      summary: Report Quick Connect as unsupported
      operationId: getJellyfinQuickConnectEnabled
      security: []
      responses:
        "200": { $ref: "#/components/responses/QuickConnectDisabled" }
        "404": { $ref: "#/components/responses/CompatibilityNotRegistered" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/AuthenticateByName:
    post:
      tags: [Authentication]
      summary: Authenticate a profile application credential
      description: |
        Client metadata is required in one `MediaBrowser` or `Emby` authorization
        parameter header: `Client` (1–64 runes), `Device` (1–120), `DeviceId`
        (1–128), and `Version` (1–32). The header is metadata here, not an existing
        credential. `Username` is the stable opaque UUID displayed in the profile's
        Rivune preferences and `Pw`/`Password` is its application password, displayed
        only once by Rivune when it is created or rotated.
        Native Rivune account names, account passwords, profile names, and profile PINs
        are never accepted. Every credential failure shares the same opaque 401 response.
      operationId: authenticateJellyfinByName
      security: []
      parameters:
        - { $ref: "#/components/parameters/ClientAuthorization" }
        - { $ref: "#/components/parameters/XEmbyClientAuthorization" }
        - { $ref: "#/components/parameters/XMediaBrowserClientAuthorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthenticateByName" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/Public:
    get:
      tags: [Users]
      summary: Return no public users
      description: Always returns a typed empty array to prevent profile/account disclosure.
      operationId: listJellyfinPublicUsers
      security: []
      responses:
        "200": { $ref: "#/components/responses/PublicUsers" }
        "404": { $ref: "#/components/responses/CompatibilityNotRegistered" }
        default: { $ref: "#/components/responses/CompatError" }
  /System/Info:
    get:
      tags: [Discovery]
      summary: Get authenticated server identity
      operationId: getJellyfinSystemInfo
      responses:
        "200": { $ref: "#/components/responses/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/Me:
    get:
      tags: [Users]
      summary: Get the credential-bound profile
      operationId: getJellyfinCurrentUser
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/{id}:
    parameters:
      - { $ref: "#/components/parameters/UserIdPath" }
    get:
      tags: [Users]
      summary: Get the credential-bound profile by ID
      description: The path ID must equal the bound profile UUID; mismatch is an opaque 404.
      operationId: getJellyfinUser
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Sessions/Logout:
    post:
      tags: [Authentication]
      summary: Revoke the compatibility and linked native session
      operationId: logoutJellyfinSession
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Sessions/Capabilities:
    post:
      tags: [Sessions]
      summary: Report bounded session capabilities from query and optional body
      description: Query capabilities replace the stored report; a wrapper body then replaces it, while a direct DeviceProfile body augments only the profile. The query is limited to 8,192 bytes and 64 values; the body to 65,536 bytes.
      operationId: updateJellyfinSessionCapabilitiesFromQuery
      parameters:
        - { $ref: "#/components/parameters/CapabilitySessionId" }
        - { $ref: "#/components/parameters/PlayableMediaTypes" }
        - { $ref: "#/components/parameters/SupportedCommands" }
        - { $ref: "#/components/parameters/SupportsMediaControl" }
        - { $ref: "#/components/parameters/SupportsPersistentIdentifier" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitiesReport" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        default: { $ref: "#/components/responses/CompatError" }
  /Sessions/Capabilities/Full:
    post:
      tags: [Sessions]
      summary: Cache a bounded capability wrapper or direct device profile
      operationId: updateJellyfinSessionCapabilities
      parameters:
        - { $ref: "#/components/parameters/CapabilitySessionId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitiesReport" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        default: { $ref: "#/components/responses/CompatError" }
  /SyncPlay/List:
    get:
      tags: [Sessions]
      summary: Return no SyncPlay groups
      operationId: listJellyfinSyncPlayGroups
      responses:
        "200":
          description: SyncPlay is unsupported, represented as a typed empty list.
          content:
            application/json:
              schema:
                type: array
                maxItems: 0
                items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Playback/BitrateTest:
    get:
      tags: [Playback]
      summary: Stream a bounded zero-filled bitrate probe
      operationId: runJellyfinBitrateTest
      parameters:
        - name: Size
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 4194304 }
      responses:
        "200":
          description: Exactly Size bytes, streamed without a Size-proportional allocation.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Plugins:
    get:
      tags: [Discovery]
      summary: Return no Jellyfin plugins
      operationId: listJellyfinPlugins
      responses:
        "200": { $ref: "#/components/responses/Plugins" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Packages:
    get:
      tags: [Discovery]
      summary: Return no Jellyfin packages
      operationId: listJellyfinPackages
      responses:
        "200": { $ref: "#/components/responses/Packages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/CompatError" }
  /Branding/Configuration:
    get:
      tags: [Discovery]
      summary: Get empty branding configuration
      operationId: getJellyfinBrandingConfiguration
      security: []
      responses:
        "200": { $ref: "#/components/responses/BrandingConfiguration" }
        default: { $ref: "#/components/responses/CompatError" }
  /Branding/Splashscreen:
    get:
      tags: [Discovery]
      summary: Report no splash screen
      operationId: getJellyfinBrandingSplashscreen
      security: []
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/CompatError" }
  /DisplayPreferences/{id}:
    parameters:
      - { $ref: "#/components/parameters/DisplayPreferenceIdPath" }
    get:
      tags: [Users]
      summary: Get minimal display preferences
      operationId: getJellyfinDisplayPreferences
      parameters:
        - { $ref: "#/components/parameters/DisplayClient" }
      responses:
        "200": { $ref: "#/components/responses/DisplayPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
    post:
      tags: [Users]
      summary: Store bounded session-lifetime display preferences
      operationId: updateJellyfinDisplayPreferences
      parameters:
        - { $ref: "#/components/parameters/DisplayClient" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisplayPreferencesUpdateDto" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/{id}/Views:
    parameters:
      - { $ref: "#/components/parameters/UserIdPath" }
    get:
      tags: [Library]
      summary: List stable media roots and authorized named Rivune collection views
      operationId: listJellyfinUserViews
      responses:
        "200": { $ref: "#/components/responses/ItemQueryResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /UserViews:
    get:
      tags: [Library]
      summary: List stable media roots and authorized named Rivune collection views
      operationId: listJellyfinViews
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
      responses:
        "200": { $ref: "#/components/responses/ItemQueryResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Library/VirtualFolders:
    get:
      tags: [Library]
      summary: List bounded virtual library folders
      operationId: listJellyfinVirtualFolders
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
      responses:
        "200": { $ref: "#/components/responses/VirtualFolders" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Library/SelectableMediaFolders:
    get:
      tags: [Library]
      summary: List selectable bounded virtual folders
      operationId: listJellyfinSelectableMediaFolders
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
      responses:
        "200": { $ref: "#/components/responses/VirtualFolders" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Items:
    get:
      tags: [Library]
      summary: List profile-authorized items
      operationId: listJellyfinItems
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
        - { $ref: "#/components/parameters/SearchTerm" }
        - { $ref: "#/components/parameters/ParentId" }
        - { $ref: "#/components/parameters/StartIndex" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Recursive" }
        - { $ref: "#/components/parameters/IncludeItemTypes" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/SortBy" }
        - { $ref: "#/components/parameters/SortOrder" }
        - { $ref: "#/components/parameters/EnableUserData" }
        - { $ref: "#/components/parameters/Ids" }
      responses:
        "200": { $ref: "#/components/responses/ItemQueryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/{id}/Items:
    parameters:
      - { $ref: "#/components/parameters/UserIdPath" }
    get:
      tags: [Library]
      summary: List bound-profile items
      operationId: listJellyfinUserItems
      parameters:
        - { $ref: "#/components/parameters/SearchTerm" }
        - { $ref: "#/components/parameters/ParentId" }
        - { $ref: "#/components/parameters/StartIndex" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Recursive" }
        - { $ref: "#/components/parameters/IncludeItemTypes" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/SortBy" }
        - { $ref: "#/components/parameters/SortOrder" }
        - { $ref: "#/components/parameters/EnableUserData" }
        - { $ref: "#/components/parameters/Ids" }
      responses:
        "200": { $ref: "#/components/responses/ItemQueryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Items/Latest:
    get:
      tags: [Library]
      summary: List latest media or ordered folders for an authorized collection view
      operationId: listJellyfinLatestItems
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
        - { $ref: "#/components/parameters/ParentId" }
        - { $ref: "#/components/parameters/StartIndex" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/EnableUserData" }
      responses:
        "200": { $ref: "#/components/responses/LatestItems" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Items/{id}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [Library]
      summary: Get one profile-authorized item
      operationId: getJellyfinItem
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
        - { $ref: "#/components/parameters/EnableUserData" }
      responses:
        "200": { $ref: "#/components/responses/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Users/{userId}/Items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/UserIdPathNamed" }
      - { $ref: "#/components/parameters/ItemIdPathNamed" }
    get:
      tags: [Library]
      summary: Get one bound-profile item
      operationId: getJellyfinUserItem
      parameters:
        - { $ref: "#/components/parameters/EnableUserData" }
      responses:
        "200": { $ref: "#/components/responses/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Shows/{seriesId}/Seasons:
    parameters:
      - { $ref: "#/components/parameters/SeriesIdPath" }
    get:
      tags: [Library]
      summary: List seasons for a series
      operationId: listJellyfinSeasons
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
        - { $ref: "#/components/parameters/StartIndex" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/SortBy" }
        - { $ref: "#/components/parameters/SortOrder" }
        - { $ref: "#/components/parameters/EnableUserData" }
      responses:
        "200": { $ref: "#/components/responses/ItemQueryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Shows/{seriesId}/Episodes:
    parameters:
      - { $ref: "#/components/parameters/SeriesIdPath" }
    get:
      tags: [Library]
      summary: List episodes for a series
      operationId: listJellyfinEpisodes
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
        - { $ref: "#/components/parameters/StartIndex" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Fields" }
        - { $ref: "#/components/parameters/SortBy" }
        - { $ref: "#/components/parameters/SortOrder" }
        - { $ref: "#/components/parameters/EnableUserData" }
      responses:
        "200": { $ref: "#/components/responses/ItemQueryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/CompatError" }
  /Search/Hints:
    get:
      tags: [Search]
      summary: Search profile-authorized item hints
      operationId: searchJellyfinHints
      parameters:
        - { $ref: "#/components/parameters/UserIdQuery" }
        - { $ref: "#/components/parameters/SearchTerm" }
        - { $ref: "#/components/parameters/ParentId" }
