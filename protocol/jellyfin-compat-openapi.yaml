      properties:
        Items: { type: array, maxItems: 0, items: { $ref: "#/components/schemas/BaseItemDto" } }
        TotalRecordCount: { type: integer, const: 0 }
        StartIndex: { type: integer, minimum: 0, maximum: 1000000 }
