        - Protocol
        - Type
        - IsRemote
        - SupportsDirectPlay
        - SupportsDirectStream
        - SupportsTranscoding
        - SupportsProbing
        - Formats
        - RequiredHttpHeaders
        - MediaAttachments
        - MediaStreams
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
