      parameters: [{ $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/StreamMediaSourceId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Static" }, { $ref: "#/components/parameters/UserIdQuery" }, { $ref: "#/components/parameters/MaxStreamingBitrate" }, { $ref: "#/components/parameters/MaxAudioChannels" }, { $ref: "#/components/parameters/AudioStreamIndex" }, { $ref: "#/components/parameters/SubtitleStreamIndex" }, { $ref: "#/components/parameters/EnableDirectPlay" }, { $ref: "#/components/parameters/EnableDirectStream" }, { $ref: "#/components/parameters/EnableTranscoding" }, { $ref: "#/components/parameters/AllowVideoStreamCopy" }, { $ref: "#/components/parameters/AllowAudioStreamCopy" }, { $ref: "#/components/parameters/SegmentContainer" }]
      responses: { "200": { $ref: "#/components/responses/HLSPlaylist" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/PlaybackUnavailable" }, "507": { $ref: "#/components/responses/InsufficientStorage" }, default: { $ref: "#/components/responses/CompatError" } }
    head:
      tags: [Playback]
      summary: Inspect a scoped HLS media playlist
      operationId: headJellyfinMainPlaylist
      security: *playbackSecurity
      parameters: [{ $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/StreamMediaSourceId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Static" }, { $ref: "#/components/parameters/UserIdQuery" }, { $ref: "#/components/parameters/MaxStreamingBitrate" }, { $ref: "#/components/parameters/MaxAudioChannels" }, { $ref: "#/components/parameters/AudioStreamIndex" }, { $ref: "#/components/parameters/SubtitleStreamIndex" }, { $ref: "#/components/parameters/EnableDirectPlay" }, { $ref: "#/components/parameters/EnableDirectStream" }, { $ref: "#/components/parameters/EnableTranscoding" }, { $ref: "#/components/parameters/AllowVideoStreamCopy" }, { $ref: "#/components/parameters/AllowAudioStreamCopy" }, { $ref: "#/components/parameters/SegmentContainer" }]
      responses: { "200": { $ref: "#/components/responses/HLSPlaylistHead" }, "400": { $ref: "#/components/responses/HeadError" }, "401": { $ref: "#/components/responses/HeadUnauthorized" }, "404": { $ref: "#/components/responses/HeadError" }, "422": { $ref: "#/components/responses/HeadError" }, "502": { $ref: "#/components/responses/HeadError" }, "503": { $ref: "#/components/responses/HeadPlaybackUnavailable" }, "507": { $ref: "#/components/responses/HeadError" }, default: { $ref: "#/components/responses/HeadError" } }
  /Videos/{id}/hls1/{playlistId}/{segmentId}.{container}:
    parameters: [{ $ref: "#/components/parameters/ItemIdPath" }, { $ref: "#/components/parameters/HLSPlaylistIdPath" }, { $ref: "#/components/parameters/HLSSegmentIdPath" }, { $ref: "#/components/parameters/ContainerPath" }]
    get:
      tags: [Playback]
      summary: Serve a scoped HLS child playlist, initialization segment, or media segment
      description: The playlistId path value is the owner/item/source-bound PlaySessionId capability; segmentId is a separate opaque child capability. Generated URLs also repeat PlaySessionId and api_key as the same scoped capability for Jellyfin client compatibility. Neither is a general credential.
      operationId: getJellyfinHLSSegment
      security: []
      x-rivune-path-capability: playlistId and segmentId
      parameters: [{ $ref: "#/components/parameters/RequiredStreamMediaSourceId" }, { $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/RivuneChildId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/HLSAsset" }, "206": { $ref: "#/components/responses/PartialStream" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "502": { $ref: "#/components/responses/BadGateway" }, default: { $ref: "#/components/responses/CompatError" } }
    head:
      tags: [Playback]
      summary: Inspect a scoped HLS child asset
      operationId: headJellyfinHLSSegment
      security: []
      x-rivune-path-capability: playlistId and segmentId
      parameters: [{ $ref: "#/components/parameters/RequiredStreamMediaSourceId" }, { $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/RivuneChildId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/HLSAssetHead" }, "206": { $ref: "#/components/responses/PartialStreamHead" }, "400": { $ref: "#/components/responses/HeadError" }, "401": { $ref: "#/components/responses/HeadUnauthorized" }, "404": { $ref: "#/components/responses/HeadError" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, default: { $ref: "#/components/responses/HeadError" } }
  /Videos/{id}/hls/{playlistId}/{segmentId}.{container}:
    parameters: [{ $ref: "#/components/parameters/ItemIdPath" }, { $ref: "#/components/parameters/HLSPlaylistIdPath" }, { $ref: "#/components/parameters/HLSSegmentIdPath" }, { $ref: "#/components/parameters/ContainerPath" }]
    get:
      tags: [Playback]
      summary: Serve a scoped HLS child asset through the legacy Jellyfin path
      operationId: getJellyfinLegacyHLSSegment
      security: []
      x-rivune-path-capability: playlistId and segmentId
      parameters: [{ $ref: "#/components/parameters/RequiredStreamMediaSourceId" }, { $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/RivuneChildId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/HLSAsset" }, "206": { $ref: "#/components/responses/PartialStream" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "502": { $ref: "#/components/responses/BadGateway" }, default: { $ref: "#/components/responses/CompatError" } }
    head:
      tags: [Playback]
      summary: Inspect a scoped HLS child asset through the legacy Jellyfin path
      operationId: headJellyfinLegacyHLSSegment
      security: []
      x-rivune-path-capability: playlistId and segmentId
      parameters: [{ $ref: "#/components/parameters/RequiredStreamMediaSourceId" }, { $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/RivuneChildId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/HLSAssetHead" }, "206": { $ref: "#/components/responses/PartialStreamHead" }, "400": { $ref: "#/components/responses/HeadError" }, "401": { $ref: "#/components/responses/HeadUnauthorized" }, "404": { $ref: "#/components/responses/HeadError" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, default: { $ref: "#/components/responses/HeadError" } }
  /Videos/{id}/{mediaSourceId}/Subtitles/{subtitleIndex}/Stream.{format}:
    parameters: [{ $ref: "#/components/parameters/ItemIdPath" }, { $ref: "#/components/parameters/MediaSourceIdPath" }, { $ref: "#/components/parameters/SubtitleIndexPath" }, { $ref: "#/components/parameters/SubtitleFormatPath" }]
    get:
      tags: [Playback]
      summary: Deliver one scoped external subtitle as WebVTT
      description: Generated facade URLs carry MediaSourceId plus the scoped PlaySessionId repeated as PlaySessionId and api_key, and optional StartTimeTicks; no profile or provider credential is embedded. A standard URL authenticated with a general credential may reuse only an existing owner-bound candidate when PlaySessionId is omitted.
      operationId: getJellyfinSubtitleStream
      security: *playbackSecurity
      parameters: [{ $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/StreamMediaSourceId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/Subtitle" }, "206": { $ref: "#/components/responses/PartialStream" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "502": { $ref: "#/components/responses/BadGateway" }, default: { $ref: "#/components/responses/CompatError" } }
    head:
      tags: [Playback]
      summary: Inspect one scoped external WebVTT subtitle
      operationId: headJellyfinSubtitleStream
      security: *playbackSecurity
      parameters: [{ $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/StreamMediaSourceId" }, { $ref: "#/components/parameters/StreamStartTimeTicks" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/SubtitleHead" }, "206": { $ref: "#/components/responses/PartialStreamHead" }, "401": { $ref: "#/components/responses/HeadUnauthorized" }, "404": { $ref: "#/components/responses/HeadError" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, default: { $ref: "#/components/responses/HeadError" } }
  /Videos/{id}/{mediaSourceId}/Subtitles/{subtitleIndex}/{startPositionTicks}/Stream.{format}:
    parameters: [{ $ref: "#/components/parameters/ItemIdPath" }, { $ref: "#/components/parameters/MediaSourceIdPath" }, { $ref: "#/components/parameters/SubtitleIndexPath" }, { $ref: "#/components/parameters/SubtitleStartTicksPath" }, { $ref: "#/components/parameters/SubtitleFormatPath" }]
    get:
      tags: [Playback]
      summary: Deliver one scoped external subtitle as WebVTT from an explicit start position
      operationId: getJellyfinSubtitleStreamAt
      security: *playbackSecurity
      parameters: [{ $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/StreamMediaSourceId" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/Subtitle" }, "206": { $ref: "#/components/responses/PartialStream" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "502": { $ref: "#/components/responses/BadGateway" }, default: { $ref: "#/components/responses/CompatError" } }
    head:
      tags: [Playback]
      summary: Inspect one scoped external WebVTT subtitle from an explicit start position
      operationId: headJellyfinSubtitleStreamAt
      security: *playbackSecurity
      parameters: [{ $ref: "#/components/parameters/StreamPlaySessionId" }, { $ref: "#/components/parameters/StreamMediaSourceId" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/SubtitleHead" }, "206": { $ref: "#/components/responses/PartialStreamHead" }, "401": { $ref: "#/components/responses/HeadUnauthorized" }, "404": { $ref: "#/components/responses/HeadError" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, default: { $ref: "#/components/responses/HeadError" } }
  /Items/{id}/Download:
    parameters: [{ $ref: "#/components/parameters/ItemIdPath" }]
    get:
      tags: [Playback]
      summary: Download an authorized original media file
      description: |
        Requires a general profile-bound compatibility credential and re-evaluates item and provider access on every request.
        Only a bounded, directly resolvable HTTP media-file source is eligible; provider pages, external-player links, playlists,
        YouTube/torrent selectors and sources requiring conversion fail explicitly; extensionless HTTP sources must first resolve to
        an inspected supported media container. The response is always
        streamed in-process: provider URLs, request headers, credentials, and native playback tokens are never returned. A supplied
        MediaSourceId must identify the item's primary source; it is never silently ignored. Range and HEAD preserve the resolved
        source semantics, while Content-Disposition is generated from a sanitized catalog title rather than provider metadata.
      operationId: downloadJellyfinItem
      parameters: [{ $ref: "#/components/parameters/UserIdQuery" }, { $ref: "#/components/parameters/MediaSourceId" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/Download" }, "206": { $ref: "#/components/responses/PartialDownload" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/PlaybackUnavailable" }, "507": { $ref: "#/components/responses/InsufficientStorage" }, default: { $ref: "#/components/responses/CompatError" } }
    head:
      tags: [Playback]
      summary: Inspect an authorized original media-file download
      operationId: headJellyfinItemDownload
      parameters: [{ $ref: "#/components/parameters/UserIdQuery" }, { $ref: "#/components/parameters/MediaSourceId" }, { $ref: "#/components/parameters/Range" }]
      responses: { "200": { $ref: "#/components/responses/DownloadHead" }, "206": { $ref: "#/components/responses/PartialDownloadHead" }, "400": { $ref: "#/components/responses/HeadError" }, "401": { $ref: "#/components/responses/HeadUnauthorized" }, "404": { $ref: "#/components/responses/HeadError" }, "416": { $ref: "#/components/responses/RangeNotSatisfiable" }, "422": { $ref: "#/components/responses/HeadError" }, "502": { $ref: "#/components/responses/HeadError" }, "503": { $ref: "#/components/responses/HeadPlaybackUnavailable" }, "507": { $ref: "#/components/responses/HeadError" }, default: { $ref: "#/components/responses/HeadError" } }
  /UserItems/{itemId}/UserData:
    parameters: [{ $ref: "#/components/parameters/ItemIdPathNamed" }]
    get:
      tags: [Watch state]
      summary: Get complete watch and library state for an authorized item
      operationId: getJellyfinItemUserData
      responses: { "200": { $ref: "#/components/responses/UserData" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
    post:
      tags: [Watch state]
      summary: Atomically update supplied watch or library state fields
      operationId: updateJellyfinItemUserData
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserItemDataDto" } } }
      responses: { "200": { $ref: "#/components/responses/UserData" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
  /Users/{userId}/Items/{itemId}/UserData:
    parameters: [{ $ref: "#/components/parameters/UserIdPathNamed" }, { $ref: "#/components/parameters/ItemIdPathNamed" }]
    get:
      tags: [Watch state]
      summary: Get complete state for a bound-profile item
      operationId: getJellyfinUserItemData
      responses: { "200": { $ref: "#/components/responses/UserData" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
    post:
      tags: [Watch state]
      summary: Atomically update supplied state fields for a bound-profile item
      operationId: updateJellyfinUserItemData
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserItemDataDto" } } }
      responses: { "200": { $ref: "#/components/responses/UserData" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
  /UserFavoriteItems/{itemId}:
    parameters: [{ $ref: "#/components/parameters/ItemIdPathNamed" }]
    post:
      tags: [Watch state]
      summary: Idempotently favorite an authorized item for the bound profile
      operationId: favoriteJellyfinItem
      responses: { "200": { $ref: "#/components/responses/UserData" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
    delete:
      tags: [Watch state]
      summary: Idempotently unfavorite an authorized item without changing library membership
      operationId: unfavoriteJellyfinItem
      responses: { "200": { $ref: "#/components/responses/UserData" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
  /Users/{userId}/FavoriteItems/{itemId}:
    parameters: [{ $ref: "#/components/parameters/UserIdPathNamed" }, { $ref: "#/components/parameters/ItemIdPathNamed" }]
    post:
      tags: [Watch state]
      summary: Idempotently favorite a bound-profile item
      operationId: favoriteJellyfinUserItem
      responses: { "200": { $ref: "#/components/responses/UserData" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
    delete:
      tags: [Watch state]
      summary: Idempotently unfavorite a bound-profile item without changing library membership
      operationId: unfavoriteJellyfinUserItem
      responses: { "200": { $ref: "#/components/responses/UserData" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/ServiceUnavailable" }, default: { $ref: "#/components/responses/CompatError" } }
components:
  securitySchemes:
    XEmbyToken:
      type: apiKey
      in: header
      name: X-Emby-Token
      description: Opaque `rivune_jf_…` compatibility credential.
    XMediaBrowserToken:
      type: apiKey
      in: header
      name: X-MediaBrowser-Token
      description: Opaque `rivune_jf_…` compatibility credential.
    AuthorizationToken:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `MediaBrowser` or `Emby` authorization parameters containing `Token="rivune_jf_…"`.
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: rivune_jf_
      description: HTTP Bearer transport for the compatibility credential.
    XEmbyAuthorizationToken:
      type: apiKey
      in: header
      name: X-Emby-Authorization
      description: >
        Optionally `MediaBrowser`/`Emby`-prefixed authorization parameters containing
        the compatibility `Token`, with optional bounded client metadata.
    XMediaBrowserAuthorizationToken:
      type: apiKey
      in: header
      name: X-MediaBrowser-Authorization
      description: >
        Optionally `MediaBrowser`/`Emby`-prefixed authorization parameters containing
        the compatibility `Token`, with optional bounded client metadata.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: >
        URL transport accepted on every authenticated operation. Lower-precedence
        transports are ignored after the first populated credential.
    ApiKeyCompactQuery:
      type: apiKey
      in: query
      name: ApiKey
      description: Underscore-free Jellyfin alias for the global URL credential transport.
    PlaybackCapabilityQuery:
      type: apiKey
      in: query
      name: PlaySessionId
      description: >
        Short-lived owner/item/source-bound stream capability. Missing or unusable
        credentials may fall back to this capability; a valid foreign credential may not.
  parameters:
    ClientAuthorization:
      name: Authorization
      in: header
      required: false
      description: >
        One MediaBrowser/Emby client-metadata header is required for login. Multiple
        transports must carry identical parameter sets.
      schema: { type: string, maxLength: 2048 }
    XEmbyClientAuthorization:
      name: X-Emby-Authorization
      in: header
      required: false
      description: MediaBrowser/Emby client metadata for login.
      schema: { type: string, maxLength: 2048 }
    XMediaBrowserClientAuthorization:
      name: X-MediaBrowser-Authorization
      in: header
      required: false
      description: MediaBrowser/Emby client metadata for login.
      schema: { type: string, maxLength: 2048 }
    UserIdPath:
      name: id
      in: path
      required: true
      description: UUID of the profile bound to the compatibility credential.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    UserIdPathNamed:
      name: userId
      in: path
      required: true
      description: UUID of the profile bound to the compatibility credential.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    ItemIdPath:
      name: id
      in: path
      required: true
      description: Canonical, compact, or deterministic virtual Rivune item UUID.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    ItemIdPathNamed:
      name: itemId
      in: path
      required: true
      description: Canonical or compact Rivune item UUID.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    TrickplayWidthPath:
      name: width
      in: path
      required: true
      description: Fixed thumbnail width from the advertised generated trickplay profile.
      schema: { type: integer, format: int32, minimum: 1, maximum: 1024 }
    TrickplayIndexPath:
      name: index
      in: path
      required: true
      description: Zero-based generated tile-sheet index.
      schema: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
    SeriesIdPath:
      name: seriesId
      in: path
      required: true
      description: Canonical or compact series UUID.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    DisplayPreferenceIdPath:
      name: displayPreferencesId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
    ImageTypePath:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [Primary, Backdrop, Logo, Thumb, Banner, Art] }
    ImageIndexPath:
      name: index
      in: path
      required: true
      description: Only the first image is implemented.
      schema: { type: string, const: "0" }
    ContainerPath:
      name: container
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9]+$" }
    UserIdQuery:
      name: UserId
      in: query
      required: false
      description: When present, must equal the bound profile UUID.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    SearchTerm:
      name: SearchTerm
      in: query
      required: false
      schema: { type: string, maxLength: 256 }
    ParentId:
      name: ParentId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UUIDInput" }
    StartIndex:
      name: StartIndex
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    Limit:
      name: Limit
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 1008, default: 100, description: Values through 1008 are accepted for pinned clients. General catalogue pages remain capped at 200; Items/Latest fulfills the requested window through bounded internal pages of at most 200. Zero returns an empty result. }
    StateLimit:
      name: Limit
      in: query
      required: false
      description: Production watch-state continuation pages are capped at 100 even though general catalog pages permit 200.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    SeasonId:
      name: SeasonId
      in: query
      required: false
      description: Optional authorized season selector; it must belong to the series path selector.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    Recursive:
      name: Recursive
      in: query
      required: false
      schema: { type: boolean, default: false }
    IncludeItemTypes:
      name: IncludeItemTypes
      in: query
      required: false
      description: Comma-separated, at most 100 values, each at most 256 bytes. Video selects canonical generic-video rows; when none are materialized it returns a typed empty result. BoxSet selects only the authorized Collections root listing; other valid kinds outside Rivune's projected domains contribute no results and never widen the filter.
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          enum: [AggregateFolder, Audio, AudioBook, BasePluginFolder, Book, BoxSet, Channel, ChannelFolderItem, CollectionFolder, Episode, Folder, Genre, LiveTvChannel, LiveTvProgram, ManualPlaylistsFolder, Movie, MusicAlbum, MusicArtist, MusicGenre, MusicVideo, Person, Photo, PhotoAlbum, Playlist, Program, Recording, Season, Series, Studio, Trailer, TvChannel, TvProgram, UserRootFolder, UserView, Video, Year]
      style: form
      explode: false
    ExcludeItemTypes:
      name: ExcludeItemTypes
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 256 } }
      style: form
      explode: false
    Filters:
      name: Filters
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, enum: [IsPlayed, IsUnplayed, IsFavorite, IsResumable, IsFolder, IsNotFolder] } }
      style: form
      explode: false
    IsPlayed:
      name: IsPlayed
      in: query
      required: false
      schema: { type: boolean }
    IsFavorite:
      name: IsFavorite
      in: query
      required: false
      schema: { type: boolean }
    IsResumable:
      name: IsResumable
      in: query
      required: false
      schema: { type: boolean }
    MinCommunityRating:
      name: MinCommunityRating
      in: query
      required: false
      description: Inclusive minimum over the authorized materialized community rating. Missing or malformed ratings do not match.
      schema: { type: number, format: double, minimum: 0, maximum: 10 }
    HasSubtitles:
      name: HasSubtitles
      in: query
      required: false
      description: Matches the bounded materialized subtitle-presence facet; missing facet data is treated as false.
      schema: { type: boolean }
    Genres:
      name: Genres
      in: query
      required: false
      description: Pipe-delimited according to the Jellyfin 10.11.11 string-name collection binder; at most 100 values, each at most 256 bytes.
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: pipeDelimited
      explode: false
    GenreIds:
      name: GenreIds
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: form
      explode: false
    Years:
      name: Years
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: integer, minimum: 1, maximum: 9999 } }
      style: form
      explode: false
    OfficialRatings:
      name: OfficialRatings
      in: query
      required: false
      description: Pipe-delimited according to the Jellyfin 10.11.11 string-name collection binder; at most 100 values, each at most 256 bytes.
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: pipeDelimited
      explode: false
    Tags:
      name: Tags
      in: query
      required: false
      description: Pipe-delimited according to the Jellyfin 10.11.11 string-name collection binder; at most 100 values, each at most 256 bytes.
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: pipeDelimited
      explode: false
    PersonIds:
      name: PersonIds
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: form
      explode: false
    Studios:
      name: Studios
      in: query
      required: false
      description: Pipe-delimited studio names matched case-insensitively against authorized canonical metadata.
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: pipeDelimited
      explode: false
    HasTrailer:
      name: HasTrailer
      in: query
      required: false
      description: Accepted fail-closed; current materialized catalog data has no trailer-presence facet, so a supplied filter returns no items.
      schema: { type: boolean }
    EnableImages:
      name: EnableImages
      in: query
      required: false
      schema: { type: boolean, default: true }
    EnableImageTypes:
      name: EnableImageTypes
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, enum: [Primary, Backdrop, Thumb, Logo, Banner, Art] } }
      style: form
      explode: false
    ImageTypeLimit:
      name: ImageTypeLimit
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100, default: 1 }
    EnableTotalRecordCount:
      name: EnableTotalRecordCount
      in: query
      required: false
      schema: { type: boolean, default: true }
    Fields:
      name: Fields
      in: query
      required: false
      description: Bounded comma-separated projected fields. Unsupported values are rejected rather than silently ignored.
      schema:
        type: array
        maxItems: 100
        items: { type: string, enum: [DisplayPreferencesId, Etag, Genres, MediaSources, MediaStreams, OriginalTitle, Overview, ParentId, Path, People, PrimaryImageAspectRatio, ProviderIds, SortName, Studios, Taglines] }
      style: form
      explode: false
    SortBy:
      name: SortBy
      in: query
      required: false
      description: Comma-separated Name or SortName keys select case-insensitive title order with canonical item ID as a stable final tie-breaker.
      schema:
        type: array
        maxItems: 100
        items: { type: string, enum: [Name, SortName] }
      style: form
      explode: false
    SortOrder:
      name: SortOrder
      in: query
      required: false
      description: Valid only when SortBy is supplied.
      schema: { type: string, enum: [Ascending, Descending] }
    EnableUserData:
      name: EnableUserData
      in: query
      required: false
      schema: { type: boolean, default: true }
    Ids:
      name: Ids
      in: query
      required: false
      description: Comma-separated canonical or compact item UUIDs, at most 100.
      schema:
        type: array
        maxItems: 100
        items: { $ref: "#/components/schemas/UUIDInput" }
      style: form
      explode: false
    ApiKey:
      name: api_key
      in: query
      required: false
      description: Opaque compatibility credential accepted globally, or the matching scoped PlaySessionId on generated stream URLs.
      schema: { type: string, minLength: 1 }
    ApiKeyCompact:
      name: ApiKey
      in: query
      required: false
      description: Underscore-free alias for the opaque global compatibility credential.
      schema: { type: string, minLength: 1 }
    ArtworkTag:
      name: tag
      in: query
      required: false
      description: Optional registered 64-hex cache selector; it must match the authenticated profile's requested item and image type and never replaces authentication.
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    ImageWidth:
      name: width
      in: query
      required: false
      description: Exact output width while preserving aspect ratio; mutually exclusive with max and fill dimensions.
      schema: { type: integer, minimum: 1, maximum: 16384 }
    ImageMaxWidth:
      name: maxWidth
      in: query
      required: false
      description: Fit ceiling that never upscales; may be paired with maxHeight.
      schema: { type: integer, minimum: 1, maximum: 16384 }
    ImageMaxHeight:
      name: maxHeight
      in: query
      required: false
      description: Fit ceiling that never upscales; may be paired with maxWidth.
      schema: { type: integer, minimum: 1, maximum: 16384 }
    ImageFillWidth:
      name: fillWidth
      in: query
      required: false
      description: Exact output width. Alone it preserves aspect ratio; paired with fillHeight it center-crops to the requested box.
      schema: { type: integer, minimum: 1, maximum: 16384 }
    ImageFillHeight:
      name: fillHeight
      in: query
      required: false
      description: Exact output height. Alone it preserves aspect ratio; paired with fillWidth it center-crops to the requested box.
      schema: { type: integer, minimum: 1, maximum: 16384 }
    ImageQuality:
      name: quality
      in: query
      required: false
      description: Bounded JPEG quality or PNG compression profile. Transforming WebP is explicitly rejected.
      schema: { type: integer, minimum: 1, maximum: 100, default: 90 }
    Range:
      name: Range
      in: header
      required: false
      description: A standard single byte range forwarded to the bounded delivery pipeline.
      schema: { type: string, pattern: "^bytes=[0-9]*-[0-9]*$" }
    StartTimeTicks:
      name: StartTimeTicks
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, maximum: 6048000000000, default: 0 }
    MaxStreamingBitrate:
      name: MaxStreamingBitrate
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 64000, maximum: 2147483647, description: Client ceiling; values above Rivune's playback ceiling are accepted and safely clamped. }
    MediaSourceId:
      name: MediaSourceId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    TrickplayMediaSourceId:
      name: mediaSourceId
      in: query
      required: false
      description: Optional canonical media-version UUID advertised by item trickplay metadata; alternate UUIDs are not found.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    IncludeSegmentTypes:
      name: includeSegmentTypes
      in: query
      required: false
      description: Jellyfin 10.11.11 segment filter. Repeated and comma-delimited values are accepted and applied after a real marker lookup.
      schema:
        type: array
        maxItems: 6
        items: { type: string, enum: [Unknown, Commercial, Preview, Recap, Outro, Intro] }
    PlaySessionId:
      name: PlaySessionId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    StreamPlaySessionId:
      name: PlaySessionId
      in: query
      required: false
      description: Required for negotiated delivery unless Static=true with a general credential. Adapter-generated values are `rvp_` plus 32 unpadded base64url characters (192 bits); bounded client selectors are accepted only on static compatibility requests and never emitted by Rivune.
      schema: { type: string, minLength: 1, maxLength: 128 }
    StreamMediaSourceId:
      name: MediaSourceId
      in: query
      required: false
      description: Required for negotiated delivery unless Static=true; adapter-generated source selectors are deterministic UUIDs.
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequiredStreamMediaSourceId:
      name: MediaSourceId
      in: query
      required: true
      description: Must equal the path or owning playback source selector.
      schema: { type: string, minLength: 16, maxLength: 128 }
    StreamStartTimeTicks:
      name: StartTimeTicks
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, maximum: 6048000000000, default: 0 }
    SeriesId:
      name: SeriesId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UUIDInput" }
    CapabilitySessionId:
      name: Id
      in: query
      required: false
      description: Empty or the authenticated compatibility session UUID; a foreign nonempty selector fails closed.
      schema:
        anyOf:
          - { $ref: "#/components/schemas/UUIDInput" }
          - { type: string, const: "" }
    PlayableMediaTypes:
      name: PlayableMediaTypes
      in: query
      required: false
      schema: { type: array, maxItems: 16, items: { type: string, minLength: 1, maxLength: 64 } }
      style: form
      explode: false
    SupportedCommands:
      name: SupportedCommands
      in: query
      required: false
      schema: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 64 } }
      style: form
      explode: false
    SupportsMediaControl:
      name: SupportsMediaControl
      in: query
      required: false
      schema: { type: boolean, default: false }
    SupportsPersistentIdentifier:
      name: SupportsPersistentIdentifier
      in: query
      required: false
      schema: { type: boolean, default: true }
    DisplayClient:
      name: Client
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 64 }
    DeviceId:
      name: DeviceId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequiredDeviceId:
      name: DeviceId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequiredPlaySessionId:
      name: PlaySessionId
      in: query
      required: true
      description: Bounded owner-scoped selector, not a general credential.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ActiveWithinSeconds:
      name: ActiveWithinSeconds
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
    ControllableByUserId:
      name: ControllableByUserId
      in: query
      required: false
      description: Validated but any supplied value intentionally yields an empty session list.
      schema: { $ref: "#/components/schemas/UUIDInput" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, maxLength: 2048 }
    WebSocketUpgrade:
      name: Upgrade
      in: header
      required: true
      schema: { type: string, pattern: "^[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]$" }
    WebSocketConnection:
      name: Connection
      in: header
      required: true
      description: Comma-separated connection tokens containing `upgrade` case-insensitively.
      schema: { type: string, minLength: 1 }
    GenreNamePath:
      name: genreName
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    PersonNamePath:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    MediaTypes:
      name: MediaTypes
      in: query
      required: false
      description: Repeated/comma-separated bounded values; only Video or Unknown retain catalog results, and continuation feeds require Video.
      schema: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 256 } }
      style: form
      explode: false
    IsMovie:
      name: IsMovie
      in: query
      required: false
      schema: { type: boolean }
    IsSeries:
      name: IsSeries
      in: query
      required: false
      schema: { type: boolean }
    IsAiring:
      name: IsAiring
      in: query
      required: false
      description: A true value selects an unsupported domain and therefore an empty result.
      schema: { type: boolean }
    IsSports:
      name: IsSports
      in: query
      required: false
      description: A true value selects an unsupported domain and therefore an empty result.
      schema: { type: boolean }
    IsKids:
      name: IsKids
      in: query
      required: false
      description: A true value selects an unsupported domain and therefore an empty result.
      schema: { type: boolean }
    IsNews:
      name: IsNews
      in: query
      required: false
      description: A true value selects an unsupported domain and therefore an empty result.
      schema: { type: boolean }
    SuggestionTypes:
      name: Type
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: form
      explode: false
    SuggestionMediaTypes:
      name: MediaType
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, maxLength: 256 } }
      style: form
      explode: false
    ExcludeArtistIds:
      name: ExcludeArtistIds
      in: query
      required: false
      description: Bounded UUID list validated for protocol compatibility but not used in similarity scoring.
      schema: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/UUIDInput" } }
      style: form
      explode: false
    AppearsInItemId:
      name: AppearsInItemId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UUIDInput" }
    PersonTypes:
      name: PersonTypes
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 256 } }
      style: form
      explode: false
    ExcludePersonTypes:
      name: ExcludePersonTypes
      in: query
      required: false
      schema: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 256 } }
      style: form
      explode: false
    CategoryLimit:
      name: CategoryLimit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
    ItemLimit:
      name: ItemLimit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 8 }
    MaxAudioChannels:
      name: MaxAudioChannels
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 32 }
    AudioStreamIndex:
      name: AudioStreamIndex
      in: query
      required: false
      schema: { type: integer, minimum: -1, maximum: 1024 }
    SubtitleStreamIndex:
      name: SubtitleStreamIndex
      in: query
      required: false
      schema: { type: integer, minimum: -1, maximum: 1024 }
    EnableDirectPlay:
      name: EnableDirectPlay
      in: query
      required: false
      schema: { type: boolean }
    EnableDirectStream:
      name: EnableDirectStream
      in: query
      required: false
      schema: { type: boolean }
    EnableTranscoding:
      name: EnableTranscoding
      in: query
      required: false
      schema: { type: boolean }
    AllowVideoStreamCopy:
      name: AllowVideoStreamCopy
      in: query
      required: false
      schema: { type: boolean }
    AllowAudioStreamCopy:
      name: AllowAudioStreamCopy
      in: query
      required: false
      schema: { type: boolean }
    Static:
      name: Static
      in: query
      required: false
      description: With a general credential, true permits bounded on-demand negotiation when scoped selectors are absent.
      schema: { type: boolean, default: false }
    SegmentContainer:
      name: SegmentContainer
      in: query
      required: false
      schema: { type: string, enum: [ts, mp4] }
    HLSPlaylistIdPath:
      name: playlistId
      in: path
      required: true
      description: Scoped PlaySessionId capability. Adapter values use the reserved `rvp_` namespace.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    HLSSegmentIdPath:
      name: segmentId
      in: path
      required: true
      description: Opaque child capability generated with 192 bits of randomness.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    RivuneChildId:
      name: RivuneChildId
      in: query
      required: false
      description: Generated URLs repeat the segmentId child capability here; if supplied it must match the path selector.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    MediaSourceIdPath:
      name: mediaSourceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDInput" }
    SubtitleIndexPath:
      name: subtitleIndex
      in: path
      required: true
      schema: { type: integer, minimum: 0, maximum: 2047 }
    SubtitleStartTicksPath:
      name: startPositionTicks
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0, maximum: 6048000000000 }
    SubtitleFormatPath:
      name: format
      in: path
      required: true
      schema: { type: string, const: vtt }
  headers:
    WWWAuthenticate:
      description: MediaBrowser authentication challenge.
      schema: { type: string, const: MediaBrowser }
    CacheControlNoStore:
      description: Compatibility JSON and errors are not cacheable.
      schema: { type: string, const: no-store }
    CacheControlImmutable:
      description: Registered artwork bytes are immutable for one year.
      schema: { type: string, const: "public, max-age=31536000, immutable" }
    CacheControlPrivateNoCache:
      description: Generated trickplay bytes are private and must be revalidated before reuse.
      schema: { type: string, const: "private, no-cache" }
    ContentLength:
      description: Byte length when known.
      schema: { type: integer, minimum: 0 }
    ContentDisposition:
      description: Attachment disposition with a bounded catalog-derived filename; provider metadata and path/control characters are excluded.
      schema: { type: string, pattern: '^attachment;' }
    Location:
      description: Same-origin capability-scoped HLS master playlist target; it never carries a global profile credential.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    ETag:
      description: Validator generated by the existing bounded delivery service.
      schema: { type: string }
    AcceptRanges:
      description: Supported range unit.
      schema: { type: string, const: bytes }
    ContentRange:
      description: Selected byte range or unsatisfied total length.
      schema: { type: string }
    RetryAfter:
      description: Seconds before retrying temporarily saturated watch synchronization.
      schema: { type: integer, const: 5 }
  responses:
    CompatibilityNotRegistered:
      description: The feature-gated compatibility adapter is disabled, so the exact route is not registered.
      content:
        text/plain:
          schema: { type: string }
    PublicSystemInfo:
      description: Public compatibility identity.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PublicSystemInfo" }
    Ping:
      description: Configured compatibility server name as a JSON string.
      content:
        application/json:
          schema: { type: string, minLength: 1, maxLength: 80 }
    SystemEndpoint:
      description: Bounded endpoint classification derived from the trusted canonical client address.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SystemEndpointInfo" }
    QuickConnectDisabled:
      description: Quick Connect is not implemented.
      content:
        application/json:
          schema: { type: boolean, const: false }
    AuthenticationResult:
      description: Bound profile, session metadata, and newly issued compatibility credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthenticationResult" }
    PublicUsers:
      description: Typed empty list; public profile enumeration is disabled.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: { $ref: "#/components/schemas/UserDto" }
    SystemInfo:
      description: Authenticated server identity.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SystemInfo" }
    User:
      description: The profile bound to this credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserDto" }
    Plugins:
      description: Typed empty plugin list; Jellyfin plugins are not hosted.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: { $ref: "#/components/schemas/PluginInfo" }
    Packages:
      description: Typed empty package list; Jellyfin packages are not hosted.
      content:
        application/json:
          schema:
            type: array
            maxItems: 0
            items: { $ref: "#/components/schemas/PackageInfo" }
    BrandingConfiguration:
      description: Empty branding object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BrandingConfiguration" }
    DisplayPreferences:
      description: Durable preferences isolated by native account, bound profile, client, and display-preference ID.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DisplayPreferencesDto" }
    VirtualFolders:
      description: Stable media roots plus profile-authorized named Rivune collection views.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/VirtualFolderInfo" }
    ItemQueryResult:
      description: Bounded authorized page. Catalog and configured-folder totals are exact; a resolved folder page may report the observed canonical window plus one while its provider has more items.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BaseItemQueryResult" }
    LatestItems:
      description: Bounded latest media, or configured folder cards for an authorized named collection view; pinned-client windows through 1008 are assembled from internal pages of at most 200.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1008
            items: { $ref: "#/components/schemas/BaseItemDto" }
    Item:
      description: One authorized catalog item.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BaseItemDto" }
    SearchHintResult:
      description: Bounded search hints; no privileged mutations or invented provider totals.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SearchHintResult" }
    ImageInfos:
      description: Projected image variants derived exclusively from opaque tags that still resolve to registered local cache records.
      content:
        application/json:
          schema:
            type: array
            maxItems: 6
            items: { $ref: "#/components/schemas/ImageInfo" }
    Image:
      description: Registered original or deterministic JPEG/PNG derivative; never an upstream redirect.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControlImmutable" }
      content:
        image/jpeg: { schema: { type: string, format: binary } }
        image/png: { schema: { type: string, format: binary } }
        image/webp: { schema: { type: string, format: binary } }
    ImageHead:
      description: Artwork metadata with the same headers as GET and no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControlImmutable" }
    ImageNotModified:
      description: The supplied If-None-Match weakly matches the current original or deterministic transform ETag; no body is returned and the cached object is not opened, fetched, transformed, or touched.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControlImmutable" }
    TrickplayImage:
      description: Complete deterministic trickplay JPEG sheet generated from an authorized playable source.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlPrivateNoCache" }
      content:
        image/jpeg: { schema: { type: string, format: binary } }
    PartialTrickplayImage:
      description: Satisfiable byte range from a deterministic trickplay JPEG sheet.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlPrivateNoCache" }
      content:
        image/jpeg: { schema: { type: string, format: binary } }
    TrickplayImageHead:
      description: Complete trickplay JPEG headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlPrivateNoCache" }
    PartialTrickplayImageHead:
      description: Partial trickplay JPEG headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlPrivateNoCache" }
    TrickplayImageNotModified:
      description: The supplied conditional validator matches the generated trickplay JPEG; no body is returned.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControlPrivateNoCache" }
    PlaybackInfo:
      description: Opaque, profile/session/device-bound playback negotiation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaybackInfoResponse" }
    HLSStreamRedirect:
      description: Legacy stream transport resolved to HLS remux or transcode; follow the capability-scoped master playlist with GET or HEAD as appropriate.
      headers:
        Location: { $ref: "#/components/headers/Location" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
    Stream:
      description: Complete stream bytes from the existing Rivune delivery pipeline.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
        video/mp4: { schema: { type: string, format: binary } }
        video/x-matroska: { schema: { type: string, format: binary } }
        application/vnd.apple.mpegurl: { schema: { type: string, format: binary } }
    PartialStream:
      description: Satisfiable byte range.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
        video/mp4: { schema: { type: string, format: binary } }
        video/x-matroska: { schema: { type: string, format: binary } }
        video/mp2t: { schema: { type: string, format: binary } }
        application/vnd.apple.mpegurl: { schema: { type: string } }
        text/vtt: { schema: { type: string } }
        application/x-subrip: { schema: { type: string } }
        text/plain: { schema: { type: string } }
    Download:
      description: Complete bytes from one authorized, directly resolvable original media file.
      headers:
        Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
        video/mp4: { schema: { type: string, format: binary } }
        video/x-matroska: { schema: { type: string, format: binary } }
        video/webm: { schema: { type: string, format: binary } }
    PartialDownload:
      description: Satisfiable byte range from one authorized original media file.
      headers:
        Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
        video/mp4: { schema: { type: string, format: binary } }
        video/x-matroska: { schema: { type: string, format: binary } }
        video/webm: { schema: { type: string, format: binary } }
    DownloadHead:
      description: Complete original media-file headers with no body.
      headers:
        Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
    PartialDownloadHead:
      description: Partial original media-file headers with no body.
      headers:
        Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
    StreamHead:
      description: Complete stream headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
    PartialStreamHead:
      description: Partial stream headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Content-Range: { $ref: "#/components/headers/ContentRange" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
        ETag: { $ref: "#/components/headers/ETag" }
    RangeNotSatisfiable:
      description: Requested byte range cannot be served.
      headers:
        Content-Range: { $ref: "#/components/headers/ContentRange" }
    UserData:
      description: Complete current watch and library state returned by reads and idempotent mutations.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserItemDataDto" }
    NoContent:
      description: Operation completed; no response body.
    BadRequest:
      description: Malformed, oversized, ambiguous, or out-of-bounds request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    Unauthorized:
      description: Missing, invalid, expired, revoked, or wrong-audience compatibility credential.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    NotFound:
      description: Unknown, inaccessible, mismatched-profile, or expired scoped resource; fails closed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    Conflict:
      description: Watch state changed concurrently after the one safe merge retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    ServiceUnavailable:
      description: Compatibility service or bounded watch synchronization is temporarily unavailable.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    BadGateway:
      description: Registered artwork or a bounded playback source could not be materialized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    ImageBadRequest:
      description: Invalid bounded query or a cached transformation that the source format or dimensions cannot satisfy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
        text/plain:
          schema: { type: string }
    ImageNotFound:
      description: Unknown, inaccessible, removed, or unregistered artwork.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
        text/plain:
          schema: { type: string }
    ImageBadGateway:
      description: Registered artwork could not be materialized from the bounded cache pipeline.
      content:
        text/plain:
          schema: { type: string }
    UnprocessableEntity:
      description: Device profile or selected source is unsupported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    PlaybackUnavailable:
      description: Playback capacity is temporarily exhausted.
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema: { type: integer, const: 10 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    InsufficientStorage:
      description: Bounded playback storage capacity is exhausted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    HeadError:
      description: Error status with no response body for a HEAD request.
    HeadUnauthorized:
      description: Authentication failed; no response body for a HEAD request.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
    HeadPlaybackUnavailable:
      description: Playback capacity is temporarily exhausted; no response body.
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema: { type: integer, const: 10 }
    CompatError:
      description: Public, secret-free compatibility error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompatErrorResponse" }
    Users:
      description: Exactly the authenticated credential owner's visible profile.
      content:
        application/json:
          schema: { type: array, minItems: 1, maxItems: 1, items: { $ref: "#/components/schemas/UserDto" } }
    Sessions:
      description: Owner-scoped compatibility sessions, or a typed empty list when a filter cannot match.
      content:
        application/json:
          schema: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/SessionInfoDto" } }
    UserAvatar:
      description: Deterministic 96×96 SVG derived only from the server and profile UUIDs.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { schema: { type: string, const: "private, no-cache" } }
      content:
        image/svg+xml: { schema: { type: string } }
    UserAvatarHead:
      description: Avatar metadata with the same headers as GET and no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { schema: { type: string, const: "private, no-cache" } }
    NotModified:
      description: The supplied avatar validator matched; no response body.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Cache-Control: { schema: { type: string, const: "private, no-cache" } }
    WebSocketUpgrade:
      description: WebSocket protocol switch with no HTTP response body, followed by bounded profile-authorized realtime frames.
      x-websocket-message-schema: { $ref: "#/components/schemas/WebSocketMessageDto" }
      x-websocket-input-schema: { $ref: "#/components/schemas/WebSocketInputDto" }
    GroupingOptions:
      description: Typed empty list; Rivune exposes no grouping plugins or special views.
      content:
        application/json:
          schema: { type: array, maxItems: 0, items: { $ref: "#/components/schemas/SpecialViewOptionDto" } }
    QueryFiltersLegacy:
      description: Bounded legacy genre/year facets derived from authorized items.
      content: { application/json: { schema: { $ref: "#/components/schemas/QueryFiltersLegacy" } } }
    QueryFilters:
      description: Bounded modern genre facets derived from authorized items.
      content: { application/json: { schema: { $ref: "#/components/schemas/QueryFilters" } } }
    EmptyItemQueryResult:
      description: Honest typed-empty catalog result for an unsupported Rivune domain.
      content: { application/json: { schema: { $ref: "#/components/schemas/EmptyBaseItemQueryResult" } } }
    EmptyItemList:
      description: Honest typed-empty item array for an unsupported Rivune domain.
      content:
        application/json:
          schema: { type: array, maxItems: 0, items: { $ref: "#/components/schemas/BaseItemDto" } }
    Recommendations:
      description: Bounded authorized similarity groups.
      content:
        application/json:
          schema: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/RecommendationDto" } }
    MediaSegments:
      description: Authorized real IntroDB segments. A successful empty result means a requested type was absent from a known non-empty marker set; unavailable data is 404.
      content: { application/json: { schema: { $ref: "#/components/schemas/MediaSegmentQueryResult" } } }
    AllThemeMedia:
      description: Three non-null typed-empty theme media groups for the authorized owner item.
      content: { application/json: { schema: { $ref: "#/components/schemas/AllThemeMediaResult" } } }
    ThemeMedia:
      description: Typed empty theme media result for the authorized owner item.
      content: { application/json: { schema: { $ref: "#/components/schemas/ThemeMediaResult" } } }
    HLSPlaylist:
      description: Bounded same-origin HLS playlist whose child references are scoped opaque capabilities.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/vnd.apple.mpegurl: { schema: { type: string, maxLength: 8388608 } }
    HLSPlaylistHead:
      description: HLS playlist headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Cache-Control: { schema: { type: string, const: no-store } }
    HLSAsset:
      description: Scoped HLS playlist, initialization segment, or media segment.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
      content:
        application/vnd.apple.mpegurl: { schema: { type: string, maxLength: 8388608 } }
        video/mp2t: { schema: { type: string, format: binary } }
        video/mp4: { schema: { type: string, format: binary } }
    HLSAssetHead:
      description: Scoped HLS child headers with no body.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
    Subtitle:
      description: Scoped external subtitle, normally converted to bounded WebVTT.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        text/vtt: { schema: { type: string } }
        application/x-subrip: { schema: { type: string } }
        text/plain: { schema: { type: string } }
        application/octet-stream: { schema: { type: string, format: binary } }
    SubtitleHead:
      description: Scoped subtitle metadata with no body; generated VTT deliberately omits Content-Length, while a directly proxied subtitle may include upstream length/range metadata.
      headers:
        Content-Length: { $ref: "#/components/headers/ContentLength" }
        ETag: { $ref: "#/components/headers/ETag" }
        Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }
    PayloadTooLarge:
      description: Request body exceeds the route's fixed byte budget.
      content: { application/json: { schema: { $ref: "#/components/schemas/CompatErrorResponse" } } }
    TooManyRequests:
      description: A bounded per-owner compatibility resource limit has been reached.
      content: { application/json: { schema: { $ref: "#/components/schemas/CompatErrorResponse" } } }
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    UUIDInput:
      type: string
      description: A canonical hyphenated UUID or the compact 32-hex Jellyfin representation; responses remain canonical.
      pattern: "^(?:[0-9a-fA-F]{32}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
    PublicSystemInfo:
      type: object
      additionalProperties: false
      required: [Id, LocalAddress, ServerName, Version, ProductName, OperatingSystem, StartupWizardCompleted]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        LocalAddress: { type: string }
        ServerName: { type: string, minLength: 1, maxLength: 80 }
        Version: { type: string, const: 10.11.11 }
        ProductName: { type: string, const: Jellyfin Server }
        OperatingSystem: { type: string }
        StartupWizardCompleted: { type: boolean, const: true }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [Id, LocalAddress, ServerName, Version, ProductName, OperatingSystem, StartupWizardCompleted]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        LocalAddress: { type: string }
        ServerName: { type: string, minLength: 1, maxLength: 80 }
        Version: { type: string, const: 10.11.11 }
        ProductName: { type: string, const: Jellyfin Server }
        StartupWizardCompleted: { type: boolean, const: true }
        OperatingSystem: { type: string }
    SystemEndpointInfo:
      type: object
      additionalProperties: false
      required: [IsLocal, IsInNetwork]
      properties:
        IsLocal: { type: boolean, description: True only when the trusted canonical client address is loopback. }
        IsInNetwork: { type: boolean, description: True only for a trusted loopback or explicit private-network client address. }
    AuthenticateByName:
      type: object
      additionalProperties: false
      anyOf:
        - required: [Username]
        - required: [UserName]
      allOf:
        - anyOf:
            - required: [Pw]
            - required: [Password]
      properties:
        Username:
          type: string
          format: uuid
          description: Stable opaque profile credential UUID issued by Rivune.
        UserName:
          type: string
          format: uuid
        Pw:
          type: string
          minLength: 54
          maxLength: 54
          pattern: "^rivune_jfa_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          x-maxUtf8Bytes: 54
          description: Canonical one-shot Rivune profile application password.
        Password:
          type: string
          minLength: 54
          maxLength: 54
          pattern: "^rivune_jfa_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          x-maxUtf8Bytes: 54
          description: Canonical one-shot Rivune profile application password.
      description: >
        If both aliases in a pair are sent they must be identical. The JSON body is
        limited to 16 KiB and unknown properties or multiple JSON values are rejected.
    AuthenticationResult:
      type: object
      additionalProperties: false
      required: [User, SessionInfo, AccessToken, ServerId]
      properties:
        User: { $ref: "#/components/schemas/UserDto" }
        SessionInfo: { $ref: "#/components/schemas/SessionInfoDto" }
        AccessToken:
          type: string
          pattern: "^rivune_jf_[A-Za-z0-9_-]+$"
          description: Returned only at issue time; the server persists its SHA-256 digest.
        ServerId: { $ref: "#/components/schemas/UUID" }
    UserDto:
      type: object
      additionalProperties: false
      required:
        - Name
        - ServerId
        - Id
        - HasPassword
        - HasConfiguredPassword
        - HasConfiguredEasyPassword
        - Policy
        - Configuration
      properties:
        Name: { type: string, minLength: 1, maxLength: 120 }
        ServerId: { $ref: "#/components/schemas/UUID" }
        Id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: UUID of the single profile bound to this compatibility credential.
        HasPassword: { type: boolean }
        HasConfiguredPassword: { type: boolean }
        HasConfiguredEasyPassword: { type: boolean, const: false, description: Profile PINs are not exposed through the compatibility API. }
        Policy: { $ref: "#/components/schemas/UserPolicy" }
        Configuration: { $ref: "#/components/schemas/UserConfiguration" }
    UserPolicy:
      type: object
      additionalProperties: false
      required: [IsAdministrator, IsHidden, IsDisabled, EnableUserPreferenceAccess, EnablePlayback, EnableMediaPlayback, EnableAudioPlaybackTranscoding, EnableVideoPlaybackTranscoding, EnablePlaybackRemuxing, ForceRemoteSourceTranscoding, EnableContentDownloading, EnableSyncTranscoding, EnableMediaConversion, EnableRemoteAccess, EnableRemoteControlOfOtherUsers, EnableSharedDeviceControl, EnableAllDevices, EnableAllChannels, EnableAllFolders, EnablePublicSharing, EnabledDevices, EnabledChannels, EnabledFolders, BlockedMediaFolders, BlockedChannels, MaxActiveSessions, RemoteClientBitrateLimit, AuthenticationProviderId, PasswordResetProviderId]
      properties:
        IsAdministrator: { type: boolean }
        IsHidden: { type: boolean }
        IsDisabled: { type: boolean }
        EnableUserPreferenceAccess: { type: boolean }
        EnablePlayback: { type: boolean }
        EnableMediaPlayback: { type: boolean }
        EnableAudioPlaybackTranscoding: { type: boolean }
        EnableVideoPlaybackTranscoding: { type: boolean }
        EnablePlaybackRemuxing: { type: boolean }
        ForceRemoteSourceTranscoding: { type: boolean }
        EnableContentDownloading: { type: boolean }
        EnableSyncTranscoding: { type: boolean }
        EnableMediaConversion: { type: boolean }
        EnableRemoteAccess: { type: boolean }
        EnableRemoteControlOfOtherUsers: { type: boolean }
        EnableSharedDeviceControl: { type: boolean }
        EnableAllDevices: { type: boolean }
        EnableAllChannels: { type: boolean }
        EnableAllFolders: { type: boolean }
        EnablePublicSharing: { type: boolean }
        EnabledDevices: { type: array, items: { type: string } }
        EnabledChannels: { type: array, items: { type: string } }
        EnabledFolders: { type: array, items: { type: string } }
        BlockedMediaFolders: { type: array, items: { type: string } }
        BlockedChannels: { type: array, items: { type: string } }
        MaxActiveSessions: { type: integer, format: int32, minimum: 0, maximum: 16 }
        RemoteClientBitrateLimit: { type: integer, format: int32, minimum: 0 }
        AuthenticationProviderId: { type: string }
        PasswordResetProviderId: { type: string }
    UserConfiguration:
      type: object
      additionalProperties: false
      required: [AudioLanguagePreference, PlayDefaultAudioTrack, SubtitleLanguagePreference, DisplayMissingEpisodes, GroupedFolders, SubtitleMode, DisplayCollectionsView, EnableLocalPassword, OrderedViews, LatestItemsExcludes, MyMediaExcludes, HidePlayedInLatest, RememberAudioSelections, RememberSubtitleSelections, EnableNextEpisodeAutoPlay, CastReceiverId]
      properties:
        AudioLanguagePreference: { type: [string, "null"], description: Null when the profile has no explicit audio-language preference. }
        PlayDefaultAudioTrack: { type: boolean }
        SubtitleLanguagePreference: { type: [string, "null"], description: Null when the profile has no explicit subtitle-language preference. }
        DisplayMissingEpisodes: { type: boolean }
        GroupedFolders: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        SubtitleMode: { type: string }
        DisplayCollectionsView: { type: boolean }
        EnableLocalPassword: { type: boolean }
        OrderedViews: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        LatestItemsExcludes: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        MyMediaExcludes:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
          description: Presentation hints for named collection views; client behavior is not mandated.
        HidePlayedInLatest: { type: boolean, const: true }
        RememberAudioSelections: { type: boolean, const: true }
        RememberSubtitleSelections: { type: boolean, const: true }
        EnableNextEpisodeAutoPlay: { type: boolean }
        CastReceiverId: { type: [string, "null"] }
    SessionInfoDto:
      type: object
      additionalProperties: false
      required: [Id, ServerId, IsActive, UserId, UserName, Client, DeviceName, DeviceType, DeviceId, ApplicationVersion, RemoteEndPoint, LastActivityDate, Capabilities, PlayableMediaTypes, SupportedCommands, SupportsMediaControl, SupportsRemoteControl, HasCustomDeviceName, AdditionalUsers, NowPlayingQueue, NowPlayingQueueFullItems]
      properties:
        Id: { $ref: "#/components/schemas/UUID" }
        ServerId: { $ref: "#/components/schemas/UUID" }
        IsActive: { type: boolean, const: true }
        UserId: { $ref: "#/components/schemas/UUID" }
        UserName: { type: string, minLength: 1, maxLength: 120 }
        Client: { type: string, minLength: 1, maxLength: 64 }
        DeviceName: { type: string, minLength: 1, maxLength: 120 }
        DeviceType: { type: string }
        DeviceId: { type: string, minLength: 1, maxLength: 128 }
        ApplicationVersion: { type: string, minLength: 1, maxLength: 32 }
        RemoteEndPoint: { type: string }
        LastActivityDate: { type: string, format: date-time }
        LastPlaybackCheckIn: { type: string, format: date-time }
        PlayState: { $ref: "#/components/schemas/PlayerStateInfo" }
        NowPlayingItem: { $ref: "#/components/schemas/BaseItemDto" }
        NowViewingItem: { $ref: "#/components/schemas/BaseItemDto" }
        Capabilities: { $ref: "#/components/schemas/ClientCapabilitiesDto" }
        PlayableMediaTypes: { type: array, maxItems: 16, items: { type: string, minLength: 1, maxLength: 64 } }
        SupportedCommands: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 64 } }
