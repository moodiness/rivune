name: Release gate

on:
  workflow_call:
    inputs:
      candidate_image:
        description: Optional immutable release-candidate image reference
        required: false
        type: string
        default: ""
      candidate_release_inputs:
        description: Same-run immutable Windows candidate artifact
        required: false
        type: string
        default: ""
      candidate_unsigned_android:
        description: Same-run immutable unsigned Android candidate artifact
        required: false
        type: string
        default: ""
      candidate_update_tool:
        description: Same-run immutable update verifier artifact
        required: false
        type: string
        default: ""
      release_version_name:
        description: Candidate release SemVer without v prefix
        required: false
        type: string
        default: ""
      release_version_code:
        description: Candidate Android versionCode
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  scope:
    name: Select checks and validate history
    runs-on: ubuntu-latest
    outputs:
      documentation: ${{ steps.select.outputs.documentation }}
      backend: ${{ steps.select.outputs.backend }}
      server_windows: ${{ steps.select.outputs.server_windows }}
      frontend: ${{ steps.select.outputs.frontend }}
      openapi: ${{ steps.select.outputs.openapi }}
      swift: ${{ steps.select.outputs.swift }}
      android: ${{ steps.select.outputs.android }}
      windows: ${{ steps.select.outputs.windows }}
      container: ${{ steps.select.outputs.container }}
      container_arm64: ${{ steps.select.outputs.container_arm64 }}
      tv: ${{ steps.select.outputs.tv }}
      tv_installer: ${{ steps.select.outputs.tv_installer }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned supply-chain workflow invariants
        run: node tools/openapi/verify-supply-chain.mjs
      - name: Select checks from changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checks=(documentation backend server_windows frontend openapi swift android windows container container_arm64 tv tv_installer)
          declare -A selected=()
          for check in "${checks[@]}"; do selected["${check}"]=false; done

          enable() {
            for check in "$@"; do selected["${check}"]=true; done
          }
          enable_all() { enable "${checks[@]}"; }
          classify() {
            case "$1" in
              .github/workflows/*|LICENSE|NOTICE)
                enable_all ;;
              *.md)
                enable documentation ;;
              scripts/ci/check-doc-links.go)
                enable documentation ;;
              server/Dockerfile|server/docker-entrypoint.sh)
                enable container container_arm64 ;;
              server/*)
                enable backend server_windows container container_arm64 ;;
              web/*)
                enable backend server_windows frontend container container_arm64 ;;
              protocol/*.yaml)
                enable backend openapi swift android windows tv ;;
              clients/apple/*)
                enable swift ;;
              clients/android/*)
                enable android ;;
              clients/update/*)
                enable android windows ;;
              clients/windows/*)
                enable windows ;;
              clients/tv-installer/*)
                enable tv_installer ;;
              clients/tv/*)
                enable tv tv_installer ;;
              rivune.ps1|scripts/*.ps1)
                enable windows ;;
              compose*.yaml|.dockerignore|rivune|scripts/*.sh|scripts/ci/*|templates/unraid/*)
                enable container container_arm64 ;;
              *)
                enable_all ;;
            esac
          }

          if [[ "${EVENT_NAME}" != pull_request ]] ||
             [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            enable_all
          else
            saw_path=false
            while IFS= read -r -d '' path; do
              saw_path=true
              classify "${path}"
            done < <(git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}")
            if [[ "${saw_path}" != true ]]; then enable_all; fi
          fi

          for check in "${checks[@]}"; do
            printf '%s=%s\n' "${check}" "${selected[${check}]}" | tee -a "${GITHUB_OUTPUT}"
          done
      - name: Require semantic-release Angular headers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: .+$'
          valid_header() { [[ "$1" =~ ${pattern} ]]; }
          valid_header 'feat(tv): add installer companion'
          if valid_header 'Add installer companion'; then
            echo 'Conventional header negative fixture unexpectedly passed.' >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == pull_request ]] && ! valid_header "${PR_TITLE}"; then
            echo "Pull request title is not semantic-release compatible: ${PR_TITLE}" >&2
            exit 1
          fi
          range="${HEAD_SHA}^..${HEAD_SHA}"
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}"; then
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          mapfile -t subjects < <(git log --no-merges --format='%s' "${range}")
          if (( ${#subjects[@]} == 0 )); then
            parent_count="$(git show -s --format='%P' "${HEAD_SHA}" | wc -w)"
            if (( parent_count < 2 )); then
              echo "No contributor commit was found in ${range}." >&2
              exit 1
            fi
          fi
          for subject in "${subjects[@]}"; do
            if ! valid_header "${subject}"; then
              echo "Commit is not semantic-release compatible: ${subject}" >&2
              exit 1
            fi
          done
      - name: Set up Go for documentation
        if: steps.select.outputs.documentation == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Verify internal Markdown links
        if: steps.select.outputs.documentation == 'true'
        shell: bash
        run: git ls-files -z '*.md' | xargs -0 go run scripts/ci/check-doc-links.go



  web-bundle:
    name: Production web bundle
    needs:
      - scope
    if: needs.scope.outputs.backend == 'true' || needs.scope.outputs.server_windows == 'true' || needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit frontend dependencies
        if: needs.scope.outputs.frontend == 'true'
        working-directory: web
        run: npm audit --audit-level=high
      - name: Build production frontend
        working-directory: web
        run: npm run build
      - name: Upload embedded frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/internal/webui/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false

  backend:
    name: Backend tests
    needs:
      - scope
      - web-bundle
    if: always() && needs.scope.outputs.backend == 'true' && needs['web-bundle'].result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        env:
          POSTGRES_DB: rivune_test
          POSTGRES_USER: rivune
          POSTGRES_PASSWORD: rivune-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivune -d rivune_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RIVUNE_TEST_DATABASE_URL: postgres://rivune:rivune-test-password@localhost:5432/rivune_test?sslmode=disable
      RIVUNE_DATABASE_URL: postgres://rivune:rivune-test-password@localhost:5432/rivune_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Remove committed frontend snapshot
        run: rm -rf server/internal/webui/dist
      - name: Download embedded frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/internal/webui/dist/
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Initialize PostgreSQL schema for integration tests
        working-directory: server
        run: go run ./cmd/rivune-migrate
      - name: Vet backend
        working-directory: server
        run: go vet ./...
      - name: Run backend tests with PostgreSQL integration coverage and race detector
        working-directory: server
        run: go test -race -p 1 ./...

  server-windows:
    name: Server Windows compile
    needs:
      - scope
      - web-bundle
    if: always() && needs.scope.outputs.server_windows == 'true' && needs['web-bundle'].result == 'success'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Remove committed frontend snapshot
        shell: pwsh
        run: if (Test-Path -LiteralPath server/internal/webui/dist) { Remove-Item -LiteralPath server/internal/webui/dist -Recurse -Force }
      - name: Download embedded frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/internal/webui/dist/
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Compile server and Windows test binaries
        working-directory: server
        run: go test -run '^$' ./...
      - name: Build Windows server commands
        working-directory: server
        run: go build ./cmd/rivune ./cmd/rivune-migrate

  frontend:
    name: Frontend E2E (${{ matrix.shard }})
    needs:
      - scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "1/2"
          - "2/2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run deterministic browser E2E shard
        working-directory: web
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Upload frontend E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-e2e-failure-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  openapi:
    name: OpenAPI lint and contract resolution
    needs:
      - scope
    if: needs.scope.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - name: Install locked OpenAPI tooling
        working-directory: tools/openapi
        run: npm ci --ignore-scripts
      - name: Lint OpenAPI contract with locked Redocly
        working-directory: tools/openapi
        run: npm exec --offline -- redocly lint ../../protocol/openapi.yaml --format=github-actions
      - name: Lint Jellyfin compatibility contract with locked Redocly
        working-directory: tools/openapi
        run: npm exec --offline -- redocly lint ../../protocol/jellyfin-compat-openapi.yaml --format=github-actions
      - name: Resolve the complete OpenAPI contract offline
        working-directory: tools/openapi
        run: npm exec --offline -- redocly bundle ../../protocol/openapi.yaml --output /tmp/rivune-openapi.yaml
      - name: Verify committed resolved contract is current
        run: diff -u protocol/openapi.resolved.yaml /tmp/rivune-openapi.yaml

  swift-client:
    name: Swift API client
    needs:
      - scope
    if: needs.scope.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksummed Apple project tooling
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/rivune-apple-tools"
          mkdir -p "${tools}/bin" "${tools}/lib/xcode-build-server/1.3.0"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${tools}/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "${tools}/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "${tools}/xcodegen.zip" "${tools}/xcodegen"
          cp "${tools}/xcodegen/xcodegen/bin/xcodegen" "${tools}/bin/xcodegen"
          cp -R "${tools}/xcodegen/xcodegen/share/." "${tools}/share/"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${tools}/xcode-build-server.zip" \
            https://github.com/SolaWing/xcode-build-server/archive/refs/tags/v1.3.0.zip
          printf '%s  %s\n' afec26de54fd93084cdf8bae83f8cc436293f0c229064f17601d5f5945aee178 "${tools}/xcode-build-server.zip" | shasum -a 256 -c -
          ditto -x -k "${tools}/xcode-build-server.zip" "${tools}/xcode-build-server-src"
          cp -R "${tools}/xcode-build-server-src/xcode-build-server-1.3.0/." "${tools}/lib/xcode-build-server/1.3.0/"
          jq_url=https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-macos-arm64
          jq_sha=a9fe3ea2f86dfc72f6728417521ec9067b343277152b114f4e98d8cb0e263603
          if [[ "$(uname -m)" == x86_64 ]]; then
            jq_url=https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-macos-amd64
            jq_sha=e80dbe0d2a2597e3c11c404f03337b981d74b4a8504b70586c354b7697a7c27f
          fi
          curl --fail --location --proto '=https' --tlsv1.2 --output "${tools}/bin/jq" "${jq_url}"
          printf '%s  %s\n' "${jq_sha}" "${tools}/bin/jq" | shasum -a 256 -c -
          chmod +x "${tools}/bin/xcodegen" "${tools}/lib/xcode-build-server/1.3.0/xcode-build-server" "${tools}/bin/jq"
          echo "${tools}/bin" >> "${GITHUB_PATH}"
          echo "${tools}/lib/xcode-build-server/1.3.0" >> "${GITHUB_PATH}"
      - name: Test Swift package
        timeout-minutes: 10
        run: swift test --disable-swift-testing --package-path clients/apple
      - name: Test local Apple signing command
        run: clients/apple/Scripts/test-sign-and-install.sh
      - name: Test SourceKit preparation command
        run: clients/apple/Scripts/test-prepare-sourcekit.sh
      - name: Verify Xcode project and all Apple schemes
        timeout-minutes: 30
        run: clients/apple/Scripts/prepare-sourcekit.sh --check

  android-client:
    name: Android client
    needs:
      - scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Test update manifest contract
        working-directory: clients/update
        run: go test ./...
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test and build Android clients
        run: |
          set -euo pipefail
          bash clients/android/gradlew -p clients/android --no-daemon \
            :rivune-api:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundlePlayRelease

          github_apk='clients/android/app/build/outputs/apk/release/app-release-unsigned.apk'
          shopt -s nullglob
          play_bundles=(clients/android/app/build/outputs/bundle/playRelease/*.aab)
          if [[ ! -s "${github_apk}" ]] || (( ${#play_bundles[@]} != 1 )) || [[ ! -s "${play_bundles[0]}" ]]; then
            echo 'Stable GitHub APK or the single Play release bundle is absent or empty.' >&2
            exit 1
          fi

          play_manifest_found=false
          while IFS= read -r play_manifest; do
            if ! grep -Fq '<manifest' "${play_manifest}"; then
              continue
            fi
            play_manifest_found=true
            if grep -Eq 'android.permission.REQUEST_INSTALL_PACKAGES|AppUpdateInstallReceiver' "${play_manifest}"; then
              echo "Play merged manifest contains sideload updater capability: ${play_manifest}" >&2
              exit 1
            fi
          done < <(find clients/android/app/build/intermediates -type f -path '*/playRelease/*' -name AndroidManifest.xml -print)
          if [[ "${play_manifest_found}" != true ]]; then
            echo 'No textual Play merged manifest was produced.' >&2
            exit 1
          fi

          mapfile -t play_build_configs < <(find clients/android/app/build/generated \
            -type f -path '*/playRelease/*' -name BuildConfig.java -print)
          if (( ${#play_build_configs[@]} != 1 )) ||
             ! grep -Eq 'APP_UPDATES_ENABLED[[:space:]]*=[[:space:]]*false' "${play_build_configs[0]}"; then
            echo 'Play build must compile out the GitHub self-updater.' >&2
            exit 1
          fi

  windows-client:
    name: Windows ${{ matrix.label }} portable client
    needs:
      - scope
    if: needs.scope.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
            runtime: win-x64
            platform: x64
            file_name: Rivune-x64.exe
            machine: '0x8664'
          - label: ARM64
            runner: ${{ format('windows-{0}-arm', 11) }} # windows-11-arm native runner
            runtime: win-arm64
            platform: ARM64
            file_name: Rivune-arm64.exe
            machine: '0xAA64'
    runs-on: ${{ matrix.runner }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: clients/windows/global.json
      - name: Set up Go for universal Windows setup
        if: matrix.label == 'x64'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Test private Windows environment-file creation
        if: matrix.label == 'x64'
        run: pwsh -NoProfile -File scripts/create-env.Tests.ps1
      - name: Test Windows library
        if: matrix.label == 'x64'
        run: dotnet test clients/windows/Rivune.Windows.Tests/Rivune.Windows.Tests.csproj --configuration Release --nologo
      - name: Test Windows operator lifecycle delegation
        if: matrix.label == 'x64'
        run: pwsh -NoProfile -File scripts/rivune.Tests.ps1
      - name: Smoke Windows host DNS-SD supervision
        if: matrix.label == 'x64'
        run: pwsh -NoProfile -File scripts/windows-discovery.Tests.ps1
      - name: Publish, inspect, and smoke the unsigned developer executable
        env:
          ASSET_FILE_NAME: ${{ matrix.file_name }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          PLATFORM: ${{ matrix.platform }}
          RUNTIME: ${{ matrix.runtime }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'clients/windows/Rivune.App/Rivune.App.csproj'
          $publish = Join-Path $env:RUNNER_TEMP 'rivune-portable-publish'
          & dotnet publish $project --configuration Release --runtime $env:RUNTIME --output $publish --nologo `
            -p:NuGetLockFilePath=packages.$env:RUNTIME.lock.json `
            -p:RestoreLockedMode=true `
            -p:Platform=$env:PLATFORM `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=1.12.4 `
            -p:AssemblyVersion=1.12.4.0 `
            -p:FileVersion=1.12.4.0 `
            -p:InformationalVersion=1.12.4 `
            -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw "Windows $env:PLATFORM portable publish failed." }

          $distributable = @(Get-ChildItem -LiteralPath $publish -File -Recurse |
            Where-Object { $_.Extension -ne '.pdb' })
          if ($distributable.Count -ne 1 -or $distributable[0].Name -cne $env:ASSET_FILE_NAME) {
            throw "Portable publish must contain exactly $env:ASSET_FILE_NAME; found: $($distributable.Name -join ', ')."
          }
          $stage = Join-Path $env:RUNNER_TEMP 'rivune-portable-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $executable = Join-Path $stage $env:ASSET_FILE_NAME
          Copy-Item -LiteralPath $distributable[0].FullName -Destination $executable
          $stagedFiles = @(Get-ChildItem -LiteralPath $stage -File)
          if ($stagedFiles.Count -ne 1 -or $stagedFiles[0].Name -cne $env:ASSET_FILE_NAME) {
            throw "Portable staging must contain exactly $env:ASSET_FILE_NAME."
          }
          $stream = [IO.File]::OpenRead($executable)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Portable executable has no DOS PE header.' }
            $stream.Position = 0x3c
            $peOffset = $reader.ReadUInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Portable executable has no PE signature.' }
            if ($reader.ReadUInt16() -ne [Convert]::ToUInt16($env:EXPECTED_MACHINE.Substring(2), 16)) {
              throw "Portable executable PE machine is not $env:PLATFORM."
            }
          } finally {
            if ($null -ne $reader) { $reader.Dispose() } else { $stream.Dispose() }
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($executable)
          if ($version.FileVersion -ne '1.12.4.0' -or $version.ProductVersion -ne '1.12.4') {
            throw "Portable executable version metadata is invalid: FileVersion=$($version.FileVersion), ProductVersion=$($version.ProductVersion)."
          }
          if ((Get-AuthenticodeSignature -FilePath $executable).Status -ne 'NotSigned') {
            throw 'Developer smoke executable must remain unsigned.'
          }
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "Portable executable exited during smoke test with code $($process.ExitCode)." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build and smoke the universal Windows setup
        if: matrix.label == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'rivune-setup-payloads'
          New-Item -ItemType Directory -Force -Path $payloadRoot | Out-Null
          Copy-Item `
            -LiteralPath (Join-Path $env:RUNNER_TEMP 'rivune-portable-stage/Rivune-x64.exe') `
            -Destination (Join-Path $payloadRoot 'Rivune-x64.exe')

          $appProject = Join-Path $env:GITHUB_WORKSPACE 'clients/windows/Rivune.App/Rivune.App.csproj'
          $arm64Publish = Join-Path $env:RUNNER_TEMP 'rivune-setup-arm64-publish'
          & dotnet publish $appProject --configuration Release --runtime win-arm64 --output $arm64Publish --nologo `
            -p:NuGetLockFilePath=packages.win-arm64.lock.json `
            -p:RestoreLockedMode=true `
            -p:Platform=ARM64 `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=1.12.4 `
            -p:AssemblyVersion=1.12.4.0 `
            -p:FileVersion=1.12.4.0 `
            -p:InformationalVersion=1.12.4 `
            -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 setup payload publish failed.' }
          $arm64Files = @(Get-ChildItem -LiteralPath $arm64Publish -File -Recurse | Where-Object { $_.Extension -ne '.pdb' })
          if ($arm64Files.Count -ne 1 -or $arm64Files[0].Name -cne 'Rivune-arm64.exe') {
            throw "ARM64 setup payload publish is invalid: $($arm64Files.Name -join ', ')."
          }
          Copy-Item -LiteralPath $arm64Files[0].FullName -Destination (Join-Path $payloadRoot 'Rivune-arm64.exe')

          $uninstaller = Join-Path $payloadRoot 'Rivune-Uninstall.exe'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'clients/windows/uninstaller')
          try {
            $env:CGO_ENABLED = '0'
            $env:GOOS = 'windows'
            $env:GOARCH = '386'
            & go build -trimpath -ldflags '-s -w -H windowsgui' -o $uninstaller .
            if ($LASTEXITCODE -ne 0) { throw 'Windows uninstaller build failed.' }
          } finally {
            Pop-Location
            Remove-Item Env:CGO_ENABLED, Env:GOOS, Env:GOARCH -ErrorAction SilentlyContinue
          }

          $bootstrapperProject = Join-Path $env:GITHUB_WORKSPACE 'clients/windows/Rivune.Bootstrapper/Rivune.Bootstrapper.csproj'
          $bootstrapperPublish = Join-Path $env:RUNNER_TEMP 'rivune-setup-bootstrapper'
          & dotnet publish $bootstrapperProject --configuration Release --runtime win-x86 --output $bootstrapperPublish --nologo `
            -p:NuGetLockFilePath=packages.win-x86.lock.json `
            -p:RestoreLockedMode=true `
            -p:Version=1.12.4 `
            -p:AssemblyVersion=1.12.4.0 `
            -p:FileVersion=1.12.4.0 `
            -p:InformationalVersion=1.12.4 `
            -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows setup bootstrapper publish failed.' }
          $bootstrapperFiles = @(Get-ChildItem -LiteralPath $bootstrapperPublish -File -Recurse | Where-Object { $_.Extension -ne '.pdb' })
          if ($bootstrapperFiles.Count -ne 1 -or $bootstrapperFiles[0].Name -cne 'Rivune.Bootstrapper.exe') {
            throw "Windows setup bootstrapper publish is invalid: $($bootstrapperFiles.Name -join ', ')."
          }

          $bundle = Join-Path $env:RUNNER_TEMP 'Rivune-Windows.exe'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'clients/tv-installer')
          try {
            & go run ./cmd/windows-bundle `
              $bootstrapperFiles[0].FullName `
              $bundle `
              (Join-Path $payloadRoot 'Rivune-x64.exe') `
              (Join-Path $payloadRoot 'Rivune-arm64.exe') `
              $uninstaller
            if ($LASTEXITCODE -ne 0) { throw 'Universal Windows setup packaging failed.' }
          } finally {
            Pop-Location
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($bundle)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            $expected = @('Rivune-Uninstall.exe', 'Rivune-arm64.exe', 'Rivune-x64.exe')
            if (Compare-Object -ReferenceObject $expected -DifferenceObject $entries -CaseSensitive) {
              throw "Universal setup payload is invalid: $($entries -join ', ')."
            }
          } finally {
            $archive.Dispose()
          }
          $process = Start-Process -FilePath $bundle -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "Universal setup exited during UI smoke test with code $($process.ExitCode)." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  container:
    name: Container, migrations, and HTTPS proxy (amd64)
    needs:
      - scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test private POSIX environment-file creation
        run: bash scripts/create-env_test.sh
      - name: Test operator CLI and macOS discovery delegation
        run: bash scripts/rivune_test.sh
      - name: Validate CPU-only and optional AMD/Intel Compose modes
        env:
          RIVUNE_DATABASE_PASSWORD: compose-validation-database-password
          RIVUNE_POSTGRES_SUPERUSER_PASSWORD: compose-validation-superuser-password
          RIVUNE_RESTORE_PASSWORD: compose-validation-restore-password
          RIVUNE_SETUP_TOKEN: compose-validation-setup-token
          RIVUNE_ENCRYPTION_KEYS: 1:1212121212121212121212121212121212121212121212121212121212121212
          RIVUNE_DISCOVERY_URL: http://192.168.1.20:8080
          RIVUNE_DISCOVERY_NAME: Living room
          RIVUNE_VIDEO_GROUP_ID: 109
          RIVUNE_VIDEO_DEVICE: /dev/dri/renderD129
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml config --format json | jq -e '
            (.services.rivune.environment | has("RIVUNE_ALLOW_TRANSCODING")) and
            (.services.rivune.environment | has("RIVUNE_VIDEO_GROUP_ID") | not) and
            (.services.rivune | has("devices") | not) and
            (.services.rivune | has("group_add") | not) and
            (.services.rivune.cap_add == ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]) and
            (.services.rivune.environment.RIVUNE_MEDIA_TEMP_DIR == "/var/lib/rivune/media") and
            (any(.services.rivune.volumes[]; .type == "volume" and .source == "media_workspace" and .target == "/var/lib/rivune/media")) and
            (any(.services.rivune.volumes[]; .type == "volume" and .source == "artwork_cache" and .target == "/var/lib/rivune/artwork")) and
            (.services.rivune.tmpfs == ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m"]) and
            (.volumes | has("media_workspace")) and
            (.volumes | has("artwork_cache")) and
            ((.services.rivune.networks | keys | sort) == ["database", "edge"]) and
            ((.services.postgres.networks | keys) == ["database"]) and
            (.networks.database.internal == true) and
            (.networks.edge.name == "rivune-edge")
          ' >/dev/null

          docker compose -f compose.yaml --profile discovery config --format json | jq -e '
            .services.discovery.network_mode == "host" and
            .services.discovery.environment.RIVUNE_DISCOVERY_URL == "http://192.168.1.20:8080" and
            .services.discovery.environment.RIVUNE_DISCOVERY_NAME == "Living room" and
            .services.discovery.command == ["mdns"] and
            .services.discovery.cap_drop == ["ALL"] and
            .services.discovery.read_only == true
          ' >/dev/null

          docker compose -f compose.yaml -f compose.amd-intel.yaml config --quiet
          docker compose -f compose.yaml -f compose.amd-intel.yaml config --format json | jq -e '
            .services.rivune.environment.RIVUNE_VIDEO_GROUP_ID == "109" and
            .services.rivune.devices == [{"source":"/dev/dri/renderD129","target":"/dev/dri/renderD128","permissions":"rwm"}] and
            .services.rivune.group_add == ["109"]
          ' >/dev/null
      - name: Test PostgreSQL backup hardening and scheduling
        run: |
          bash scripts/postgres-backup_test.sh
          bash scripts/postgres-backup-scheduler_test.sh
      - name: Set up Docker Buildx
        if: inputs.candidate_image == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build testable linux/amd64 image
        if: inputs.candidate_image == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: rivune-ci:current
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=rivune-container
      - name: Pull the exact linux/amd64 release candidate
        if: inputs.candidate_image != ''
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "${CANDIDATE_IMAGE}"
          docker tag "${CANDIDATE_IMAGE}" rivune-ci:current
      - name: Test container identity and video group
        run: |
          test "$(docker run --rm -e PUID=10001 -e PGID=10002 rivune-ci:current id -G)" = 10002
          test "$(docker run --rm -e PUID=10001 -e PGID=10002 -e RIVUNE_VIDEO_GROUP_ID=109 rivune-ci:current id -u)" = 10001
          test "$(docker run --rm -e PUID=10001 -e PGID=10002 -e RIVUNE_VIDEO_GROUP_ID=109 rivune-ci:current id -g)" = 10002
          docker run --rm -e PUID=10001 -e PGID=10002 -e RIVUNE_VIDEO_GROUP_ID=109 rivune-ci:current id -G |
            tr ' ' '\n' | grep -qx 109
          docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add SETGID --cap-add SETUID \
            -e PUID=10001 -e PGID=10002 rivune-ci:current --healthcheck sh -ceu '
              test "$(id -u)" = 10001
              test "$(id -g)" = 10002
              test "$(sed -n "s/^CapEff:[[:space:]]*//p" /proc/self/status)" = 0000000000000000
              test "$(sed -n "s/^CapPrm:[[:space:]]*//p" /proc/self/status)" = 0000000000000000
            '
      - name: Test Unraid and Pangolin CPU-only startup
        env:
          RIVUNE_IMAGE: rivune-ci:current
        run: bash scripts/ci/unraid-smoke.sh
      - name: Test clean-install and upgrade migrations
        env:
          RIVUNE_IMAGE: rivune-ci:current
        run: bash scripts/ci/migrations.sh
      - name: Smoke-test HTTPS and forwarded headers
        env:
          RIVUNE_IMAGE: rivune-ci:current
        run: bash scripts/ci/reverse-proxy-smoke.sh

  container-arm64:
    name: Container image (arm64)
    needs:
      - scope
    if: needs.scope.outputs.container_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
