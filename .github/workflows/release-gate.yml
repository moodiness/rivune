      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/tv-installer/go.mod
          cache: false
      - name: Test and build Windows and macOS TV installer companions
        shell: bash
        run: |
          set -euo pipefail
          (cd clients/tv-installer && go test ./...)
          version="$(jq -er '.version | select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' clients/tv/package.json)"
          clients/tv-installer/scripts/build-release.sh "${version}" tv-installer-assets
          expected_files="$(printf '%s\n' Rivune-TV-Installer-Windows.exe Rivune-TV-Installer-macOS.dmg | sort)"
          actual_files="$(find tv-installer-assets -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort)"
          [[ "${actual_files}" == "${expected_files}" ]]
  candidate-release-assets:
    name: Verify immutable candidate Windows and Android release inputs
    if: inputs.candidate_release_inputs != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download Windows candidate and metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_release_inputs }}
          path: candidate-release-inputs
      - name: Download unsigned Android candidate and metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_unsigned_android }}
          path: candidate-unsigned-android
      - name: Download candidate update verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_update_tool }}
          path: candidate-update-tool
      - name: Verify exact candidate artifact sets and bound digests
        env:
          RELEASE_VERSION_NAME: ${{ inputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION_NAME}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "${RELEASE_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]
          [[ "$(find candidate-release-inputs -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)" == $'Rivune-Windows.exe\ncandidate-release.json' ]]
          [[ "$(find candidate-unsigned-android -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)" == $'app-release-unsigned.apk\ncandidate-release.json' ]]
          [[ "$(find candidate-update-tool -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)" == $'candidate-update-tool.json\nrivune-update-tool' ]]
          cmp candidate-release-inputs/candidate-release.json candidate-unsigned-android/candidate-release.json
          descriptor=candidate-release-inputs/candidate-release.json
          jq -e --arg versionName "${RELEASE_VERSION_NAME}" --arg versionCode "${RELEASE_VERSION_CODE}" \
            --arg windows "$(sha256sum candidate-release-inputs/Rivune-Windows.exe | cut -d ' ' -f1)" \
            --arg android "$(sha256sum candidate-unsigned-android/app-release-unsigned.apk | cut -d ' ' -f1)" '
              .versionName == $versionName and .versionCode == $versionCode and
              .windows.sha256 == $windows and .android.sha256 == $android
            ' "${descriptor}" >/dev/null
          tool_digest="$(sha256sum candidate-update-tool/rivune-update-tool | cut -d ' ' -f1)"
          jq -e --arg digest "${tool_digest}" '.fileName == "rivune-update-tool" and .sha256 == $digest' candidate-update-tool/candidate-update-tool.json >/dev/null
          chmod +x candidate-update-tool/rivune-update-tool
          candidate-update-tool/rivune-update-tool help >/dev/null


  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs:
      - scope
      - web-bundle
      - backend
      - server-windows
      - frontend
      - openapi
      - swift-client
      - android-client
      - windows-client
      - container
      - container-arm64
      - tv-client
      - tv-installer
      - candidate-release-assets
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected project check
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          jq -e '
            . as $jobs |
            ($jobs.scope.result == "success") and
            (all($jobs[]; .result == "success" or .result == "skipped")) and
            ([
              ["backend", "backend"],
              ["server-windows", "server_windows"],
              ["frontend", "frontend"],
              ["openapi", "openapi"],
              ["swift-client", "swift"],
              ["android-client", "android"],
              ["windows-client", "windows"],
              ["container", "container"],
              ["container-arm64", "container_arm64"],
              ["tv-client", "tv"],
              ["tv-installer", "tv_installer"]
            ] | all(.[];
              ($jobs.scope.outputs[.[1]] == "true") ==
              ($jobs[.[0]].result == "success")
            )) and
            (((
              $jobs.scope.outputs.backend == "true" or
              $jobs.scope.outputs.server_windows == "true" or
              $jobs.scope.outputs.frontend == "true"
            )) == ($jobs["web-bundle"].result == "success"))
          ' <<<"${JOB_RESULTS}"
