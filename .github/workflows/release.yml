name: Publish release

on:
  workflow_run:
    workflows:
      - Release candidate CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  authorize:
    name: Authorize tested release candidate
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      sha: ${{ steps.authorize.outputs.sha }}
      stable: ${{ steps.authorize.outputs.stable }}
      tag: ${{ steps.authorize.outputs.tag }}
    steps:
      - name: Verify release policy and candidate provenance
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_EVENT: ${{ github.event.workflow_run.event }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RELEASE_PATH: ${{ github.event.workflow_run.path }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TITLE: ${{ github.event.workflow_run.display_title }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          candidate_metadata_is_valid() {
            local tag="$1" title="$2" event="$3" conclusion="$4" path="$5" head_repository="$6" expected_repository="$7" sha="$8"
            local numeric='0|[1-9][0-9]*'
            local prerelease_identifier='0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*'
            local semver="^v(${numeric})\.(${numeric})\.(${numeric})(-(${prerelease_identifier})(\.(${prerelease_identifier}))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
            [[ "${title}" == "Release candidate ${tag}" ]] &&
              [[ "${event}" == push || "${event}" == workflow_dispatch ]] &&
              [[ "${conclusion}" == success ]] &&
              [[ "${path}" == .github/workflows/release-candidate.yml ]] &&
              [[ "${head_repository}" == "${expected_repository}" ]] &&
              [[ "${tag}" =~ ${semver} ]] &&
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          }

          release_run_is_authorized() {
            local run_sha="$1" tag_sha="$2" main_sha="$3" release_count="$4"
            [[ "${run_sha}" == "${tag_sha}" ]] &&
              (( release_count <= 1 )) &&
              { [[ "${run_sha}" == "${main_sha}" ]] || (( release_count == 1 )); }
          }
          annotated_tag_ref_is_valid() {
            jq -e '.object.type == "tag" and (.object.sha | strings | test("^[0-9a-f]{40}$"))' >/dev/null <<<"$1"
          }
          expect_rejection() {
            local label="$1"
            shift
            if "$@"; then
              echo "Negative policy fixture unexpectedly passed: ${label}" >&2
              return 1
            fi
          }

          # Behavioral policy checks use the same predicates as live authorization.
          fixture_sha=0123456789abcdef0123456789abcdef01234567
          candidate_metadata_is_valid v1.2.3 "Release candidate v1.2.3" push success .github/workflows/release-candidate.yml owner/repo owner/repo "${fixture_sha}"
          expect_rejection malformed-tag candidate_metadata_is_valid release-1 "Release candidate release-1" push success .github/workflows/release-candidate.yml owner/repo owner/repo "${fixture_sha}"
          expect_rejection mismatched-title candidate_metadata_is_valid v1.2.3 "Release candidate v9.9.9" push success .github/workflows/release-candidate.yml owner/repo owner/repo "${fixture_sha}"
          expect_rejection pull-request-event candidate_metadata_is_valid v1.2.3 "Release candidate v1.2.3" pull_request success .github/workflows/release-candidate.yml owner/repo owner/repo "${fixture_sha}"
          candidate_metadata_is_valid v1.2.3 "Release candidate v1.2.3" workflow_dispatch success .github/workflows/release-candidate.yml owner/repo owner/repo "${fixture_sha}"
          expect_rejection scheduled-event candidate_metadata_is_valid v1.2.3 "Release candidate v1.2.3" schedule success .github/workflows/release-candidate.yml owner/repo owner/repo "${fixture_sha}"
          expect_rejection wrong-workflow candidate_metadata_is_valid v1.2.3 "Release candidate v1.2.3" push success .github/workflows/other.yml owner/repo owner/repo "${fixture_sha}"
          release_run_is_authorized "${fixture_sha}" "${fixture_sha}" "${fixture_sha}" 0
          expect_rejection mismatched-commit release_run_is_authorized "${fixture_sha}" ffffffffffffffffffffffffffffffffffffffff "${fixture_sha}" 0
          release_run_is_authorized "${fixture_sha}" "${fixture_sha}" ffffffffffffffffffffffffffffffffffffffff 1
          expect_rejection advanced-main-without-release release_run_is_authorized "${fixture_sha}" "${fixture_sha}" ffffffffffffffffffffffffffffffffffffffff 0
          expect_rejection multiple-releases release_run_is_authorized "${fixture_sha}" "${fixture_sha}" "${fixture_sha}" 2
          fixture_tag_object=89abcdef0123456789abcdef0123456789abcdef
          annotated_tag_ref_is_valid "{\"object\":{\"type\":\"tag\",\"sha\":\"${fixture_tag_object}\"}}"
          expect_rejection lightweight-tag-ref annotated_tag_ref_is_valid "{\"object\":{\"type\":\"commit\",\"sha\":\"${fixture_tag_object}\"}}"
          expect_rejection absent-tag-ref annotated_tag_ref_is_valid '{}'

          release_prefix='Release candidate '
          RELEASE_TAG="${RELEASE_TITLE#"${release_prefix}"}"
          if ! candidate_metadata_is_valid "${RELEASE_TAG}" "${RELEASE_TITLE}" "${RELEASE_EVENT}" "${RELEASE_CONCLUSION}" "${RELEASE_PATH}" "${RELEASE_HEAD_REPOSITORY}" "${REPOSITORY}" "${RELEASE_SHA}"; then
            echo "The completed run is not an eligible release-tag CI run." >&2
            exit 1
          fi

          api() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/$1"
          }

          main_sha="$(api git/ref/heads/main | jq -er '.object.sha')"
          if ! tag_ref="$(api "git/ref/tags/${RELEASE_TAG}")" || ! annotated_tag_ref_is_valid "${tag_ref}"; then
            echo "Release tag must exist as an annotated Git tag object." >&2
            exit 1
          fi
          tag_object_sha="$(jq -er '.object.sha' <<<"${tag_ref}")"
          if ! tag_sha="$(api "git/tags/${tag_object_sha}" | jq -er 'select(.object.type == "commit") | .object.sha | select(test("^[0-9a-f]{40}$"))')"; then
            echo "Annotated release tag must target a commit." >&2
            exit 1
          fi
          release_count="$(gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" |
            jq --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)] | length')"
          if ! release_run_is_authorized "${RELEASE_SHA}" "${tag_sha}" "${main_sha}" "${release_count}"; then
            echo "The successful CI run must match the immutable tag and current main, unless exactly one matching Release already exists for full downstream validation." >&2
            exit 1
          fi

          release_core="${RELEASE_TAG%%+*}"
          stable=true
          if [[ "${release_core}" == *-* ]]; then
            stable=false
          fi

          {
            echo "authorized=true"
            echo "sha=${RELEASE_SHA}"
            echo "stable=${stable}"
            echo "tag=${RELEASE_TAG}"
          } >> "${GITHUB_OUTPUT}"

  windows-asset:
    name: Build and verify Windows x64 portable executable
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
    runs-on: windows-latest
    outputs:
      artifact_name: windows-release-asset-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish and inspect unsigned x64 executable
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Release tag is not valid SemVer: $env:RELEASE_TAG"
          }
          $components = @([uint64]$Matches[1], [uint64]$Matches[2], [uint64]$Matches[3])
          if ($components | Where-Object { $_ -gt 65535 }) {
            throw 'Every SemVer core component must be at most 65535 for Windows file-version metadata.'
          }
          $versionName = $env:RELEASE_TAG.Substring(1)
          $fileVersion = "$($components[0]).$($components[1]).$($components[2]).0"
          $project = Join-Path $env:GITHUB_WORKSPACE 'clients/windows/Rivune.App/Rivune.App.csproj'
          $publish = Join-Path $env:RUNNER_TEMP 'rivune-portable-publish'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'windows-release-asset'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          & dotnet publish $project --configuration Release --runtime win-x64 --output $publish --nologo `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=$versionName `
            -p:AssemblyVersion=$fileVersion `
            -p:FileVersion=$fileVersion `
            -p:InformationalVersion=$versionName `
            -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 portable publish failed.' }

          $distributable = @(Get-ChildItem -LiteralPath $publish -File -Recurse |
            Where-Object { $_.Extension -ne '.pdb' })
          if ($distributable.Count -ne 1 -or $distributable[0].Extension -ne '.exe') {
            throw "Portable publish must contain exactly one distributable executable; found: $($distributable.Name -join ', ')."
          }
          $asset = Join-Path $artifactDirectory 'Rivune.exe'
          Copy-Item -LiteralPath $distributable[0].FullName -Destination $asset
          $stream = [IO.File]::OpenRead($asset)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Rivune.exe has no DOS PE header.' }
            $stream.Position = 0x3c
            $peOffset = $reader.ReadUInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Rivune.exe has no PE signature.' }
            if ($reader.ReadUInt16() -ne 0x8664) { throw 'Rivune.exe PE machine is not x64.' }
          } finally {
            if ($null -ne $reader) { $reader.Dispose() } else { $stream.Dispose() }
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($asset)
          if ($version.FileVersion -ne $fileVersion -or $version.ProductVersion -ne $versionName) {
            throw "Rivune.exe version metadata is invalid: FileVersion=$($version.FileVersion), ProductVersion=$($version.ProductVersion)."
          }
          if ((Get-AuthenticodeSignature -FilePath $asset).Status -ne 'NotSigned') {
            throw 'Rivune.exe must be unsigned.'
          }
          $size = (Get-Item -LiteralPath $asset).Length
          if ($size -le 0 -or $size -gt 2147483647) { throw "Rivune.exe size is invalid: $size bytes." }
          $files = @(Get-ChildItem -LiteralPath $artifactDirectory -File)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'Rivune.exe') {
            throw 'Windows release artifact must contain exactly Rivune.exe.'
          }
      - name: Upload immutable Windows release executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-asset-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-release-asset/Rivune.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  build-assets:
    name: Build unsigned Android and Windows release inputs
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - windows-asset
    runs-on: ubuntu-latest
    outputs:
      release_inputs_artifact_name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      unsigned_android_artifact_name: unsigned-android-${{ github.run_id }}-${{ github.run_attempt }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      channel: ${{ steps.metadata.outputs.channel }}
      published_at: ${{ steps.metadata.outputs.published_at }}
      android_asset_name: ${{ steps.metadata.outputs.android_asset_name }}
      source_asset_name: ${{ steps.metadata.outputs.source_asset_name }}
      windows_asset_name: ${{ steps.metadata.outputs.windows_asset_name }}
      release_url: ${{ steps.metadata.outputs.release_url }}
      android_asset_url: ${{ steps.metadata.outputs.android_asset_url }}
      windows_asset_url: ${{ steps.metadata.outputs.windows_asset_url }}
    permissions:
      contents: read
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download immutable Windows release executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.windows-asset.outputs.artifact_name }}
          path: release-assets
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build unsigned Android release and corresponding source
        id: metadata
        env:
          GITHUB_RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_STABLE: ${{ needs.authorize.outputs.stable }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RELEASE_WORKFLOW_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf .release-private' EXIT

          version_name="${RELEASE_TAG#v}"
          # github.run_number increases between releases but remains unchanged for rerun attempts.
          # Reserve the 2,000,000,000 namespace above the former commit-count-derived codes.
          version_code_namespace=2000000000
          android_version_code_max=2100000000
          if [[ ! "${GITHUB_RELEASE_RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The release workflow run number is invalid: ${GITHUB_RELEASE_RUN_NUMBER}" >&2
            exit 1
          fi
          if (( ${#GITHUB_RELEASE_RUN_NUMBER} > 10 )); then
            echo "The release workflow run number exceeds the Android versionCode namespace: ${GITHUB_RELEASE_RUN_NUMBER}" >&2
            exit 1
          fi
          release_run_number=$((10#${GITHUB_RELEASE_RUN_NUMBER}))
          if (( release_run_number > android_version_code_max - version_code_namespace )); then
            echo "The release workflow run number exceeds the Android versionCode namespace: ${GITHUB_RELEASE_RUN_NUMBER}" >&2
            exit 1
          fi
          version_code=$((version_code_namespace + release_run_number))
          if [[ "${RELEASE_STABLE}" == true ]]; then
            channel=stable
          else
            channel=prerelease
          fi
          if ! published_at="$(date -u --date="${RELEASE_WORKFLOW_CREATED_AT}" +'%Y-%m-%dT%H:%M:%SZ')" ||
             [[ "${published_at}" != "${RELEASE_WORKFLOW_CREATED_AT}" ]]; then
            echo "The source workflow creation time is not canonical RFC3339 UTC: ${RELEASE_WORKFLOW_CREATED_AT}" >&2
            exit 1
          fi
          asset_name="rivune-android-${version_name}.apk"
          source_asset_name="rivune-android-${version_name}-corresponding-source.tar.gz"
          windows_asset_name='Rivune.exe'
          release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          asset_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          windows_asset_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${windows_asset_name}"
          windows_size="$(stat -c %s "release-assets/${windows_asset_name}")"
          if (( windows_size <= 0 || windows_size > 2147483647 )); then
            echo "Rivune.exe size is invalid: ${windows_size} bytes." >&2
            exit 1
          fi

          mkdir -p release-assets .release-private release-inputs unsigned-android-input
          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "channel=${channel}"
            echo "published_at=${published_at}"
            echo "android_asset_name=${asset_name}"
            echo "source_asset_name=${source_asset_name}"
            echo "windows_asset_name=${windows_asset_name}"
            echo "release_url=${release_url}"
            echo "android_asset_url=${asset_url}"
            echo "windows_asset_url=${windows_asset_url}"
          } >> "${GITHUB_OUTPUT}"

          export RIVUNE_ANDROID_VERSION_NAME="${version_name}"
          export RIVUNE_ANDROID_VERSION_CODE="${version_code}"

          bash clients/android/gradlew -p clients/android --no-daemon :app:assembleRelease
          mapfile -t libmpv_aars < <(find "${GRADLE_USER_HOME:-${HOME}/.gradle}/caches/modules-2/files-2.1/dev.jdtech.mpv/libmpv/1.0.0" \
            -type f -name 'libmpv-1.0.0.aar' -print)
          if (( ${#libmpv_aars[@]} == 0 )); then
            echo "The pinned libmpv 1.0.0 AAR was not present after the release build." >&2
            exit 1
          fi
          for libmpv_aar in "${libmpv_aars[@]}"; do
            printf '%s  %s\n' \
              df146592480fc8418415a06b1f1a1d6318b0088e21f52254b0e9a82b61ca8fa2 \
              "${libmpv_aar}" | sha256sum --check --strict
          done

          unsigned_apk='clients/android/app/build/outputs/apk/release/app-release-unsigned.apk'
          if [[ ! -s "${unsigned_apk}" ]]; then
            echo "Gradle did not produce the expected unsigned release APK." >&2
            exit 1
          fi
          cp "${unsigned_apk}" unsigned-android-input/app-release-unsigned.apk

          # Bundle the exact approved Rivune tree and the complete native source graph
          # used by dev.jdtech.mpv:libmpv:1.0.0. Git object IDs authenticate each
          # immutable upstream checkout; downloaded source archives use pinned SHA-256.
          source_root=".release-private/corresponding-source"
          third_party_root="${source_root}/third-party/libmpv-android-1.0.0"
          mkdir -p "${source_root}/rivune" "${third_party_root}/buildscripts/deps"
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "The checked-out Rivune source does not match the approved release commit." >&2
            exit 1
          fi
          git archive --format=tar "${RELEASE_SHA}" | tar -xf - -C "${source_root}/rivune"

          runtime_inventory="${GITHUB_WORKSPACE}/.release-private/runtime-inventory.tsv"
          runtime_components="${GITHUB_WORKSPACE}/.release-private/runtime-components.txt"
          runtime_artifacts="${GITHUB_WORKSPACE}/.release-private/runtime-artifacts"
          runtime_sources="${GITHUB_WORKSPACE}/.release-private/runtime-sources"
          RIVUNE_RUNTIME_INVENTORY_PATH="${runtime_inventory}" \
          RIVUNE_RUNTIME_ARTIFACTS_PATH="${runtime_artifacts}" \
          RIVUNE_RUNTIME_COMPONENTS_PATH="${runtime_components}" \
          RIVUNE_RUNTIME_SOURCES_PATH="${runtime_sources}" \
            bash clients/android/gradlew -p clients/android --no-daemon :app:writeReleaseRuntimeInventory
          local_libmpv_aar="${runtime_artifacts}/dev.jdtech.mpv/libmpv/1.0.0/libmpv-1.0.0.aar"
          printf '%s  %s\n' \
            df146592480fc8418415a06b1f1a1d6318b0088e21f52254b0e9a82b61ca8fa2 \
            "${local_libmpv_aar}" | sha256sum --check --strict
          RIVUNE_LIBMPV_AAR_PATH="${local_libmpv_aar}" \
            bash clients/android/gradlew -p clients/android --no-daemon :app:verifyLocalLibmpvOverride

          jvm_source_root="${source_root}/third-party/jvm-runtime-sources"
          RIVUNE_RUNTIME_COMPONENTS_FILE="${runtime_components}" \
            python3 - "${runtime_inventory}" "${runtime_artifacts}" "${runtime_sources}" "${jvm_source_root}" <<'PYTHON'
          import hashlib
          import os
          import pathlib
          import shutil
          import sys
          import urllib.error
          import urllib.request
          import zipfile

          inventory_path, artifacts_path, sources_path, output_path = map(pathlib.Path, sys.argv[1:])
          rows = []
          for line_number, line in enumerate(inventory_path.read_text(encoding="utf-8").splitlines(), 1):
              fields = line.split("\t")
              if len(fields) != 3:
                  raise SystemExit(f"invalid runtime inventory line {line_number}")
              coordinate, filename, artifact_sha256 = fields
              parts = coordinate.split(":")
              if len(parts) != 3 or not all(parts) or len(artifact_sha256) != 64:
                  raise SystemExit(f"invalid runtime inventory identity on line {line_number}")
              rows.append((coordinate, *parts, filename, artifact_sha256))
          if len(rows) != 90 or rows != sorted(rows, key=lambda row: (row[0], row[4], row[5])):
              raise SystemExit("runtime inventory must contain the exact 90 deterministically sorted release artifacts")
          if len({(row[0], row[4]) for row in rows}) != len(rows):
              raise SystemExit("runtime inventory contains duplicate module artifacts")
          opener = urllib.request.build_opener()
          opener.addheaders = [("User-Agent", "rivune-release-source-bundler")]

          def digest(path, algorithm="sha256"):
              value = hashlib.new(algorithm)
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          def fetch(url, destination, optional=False):
              try:
                  with opener.open(url, timeout=60) as response:
                      content = response.read()
              except urllib.error.HTTPError as error:
                  if optional and error.code == 404:
                      return False
                  raise SystemExit(f"source material fetch failed ({error.code}): {url}") from error
              destination.write_bytes(content)
              return True

          def verify_published_checksum(path, url, google):
              algorithms = ("sha256", "sha1") if google else ("sha1",)
              for algorithm in algorithms:
                  checksum_path = path.with_name(path.name + f".{algorithm}")
                  if not fetch(url + f".{algorithm}", checksum_path, optional=(google and algorithm == "sha256")):
                      continue
                  expected = checksum_path.read_text(encoding="ascii").strip().split()[0].lower()
                  if len(expected) != hashlib.new(algorithm).digest_size * 2 or digest(path, algorithm) != expected:
                      raise SystemExit(f"published checksum mismatch for {url}")
                  return
              raise SystemExit(f"no published checksum for {url}")

          def safe_member(name):
              normalized = pathlib.PurePosixPath(name)
              return not normalized.is_absolute() and ".." not in normalized.parts and name not in ("", ".")

          manifest = []
          for coordinate, group, name, version, artifact_filename, artifact_sha256 in rows:
              relative_module = pathlib.Path(group, name, version)
              runtime_artifact = artifacts_path / relative_module / artifact_filename
              if not runtime_artifact.is_file() or digest(runtime_artifact) != artifact_sha256:
                  raise SystemExit(f"runtime artifact differs from Gradle inventory: {coordinate} {artifact_filename}")

              google = group == "androidx" or group.startswith("androidx.")
              repository = "https://dl.google.com/dl/android/maven2" if google else "https://repo1.maven.org/maven2"
              repository_path = "/".join((*group.split("."), name, version))
              base_url = f"{repository}/{repository_path}"
              module_output = output_path / relative_module
              module_output.mkdir(parents=True)

              runtime_remote_name = f"{name}-{version}{runtime_artifact.suffix}"
              runtime_url = f"{base_url}/{runtime_remote_name}"
              verify_published_checksum(runtime_artifact, runtime_url, google)

              source_directory = sources_path / relative_module
              source_archives = sorted(source_directory.glob("*-sources.jar")) if source_directory.is_dir() else []
              if len(source_archives) > 1:
                  raise SystemExit(f"multiple source archives resolved for {coordinate}")
              has_classes = False
