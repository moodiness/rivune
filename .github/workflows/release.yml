          if find "${source_root}" \
            \( -type d \( -name .release-private -o -name .gradle -o -name .cxx -o -name node_modules \) \
            -o -type f \( -name .env -o -iname '*.apk' -o -iname '*.aar' -o -iname '*.jks' -o -iname '*.keystore' \) \) \
            -print -quit | grep -q .; then
            echo "Corresponding Source contains a forbidden private, cache, build, or binary path." >&2
            exit 1
          fi
          if find "${source_root}" -path "${jvm_upstreams}" -prune -o \
            -type f \( -iname '*.dex' -o -iname '*.class' -o -iname '*.o' -o -iname '*.so' \) \
            -print -quit | grep -q .; then
            echo "Corresponding Source contains a generated binary outside an authenticated upstream tree." >&2
            exit 1
          fi
          canonical_source_root="$(realpath "${source_root}")"
          while IFS= read -r -d '' link; do
            resolved_link="$(realpath -m "${link}")"
            if [[ "${resolved_link}" != "${canonical_source_root}"/* ]]; then
              echo "Corresponding Source symlink escapes the archive root: ${link}" >&2
              exit 1
            fi
          done < <(find "${source_root}" -type l -print0)

          required_source_entries=(
            UPSTREAM_SOURCES.txt
            REBUILDING.txt
            RELEASE_BUILD_ENV
            rebuild-android.sh
            third-party/jvm-runtime-sources/RESOLVED_COMPONENTS.txt
            third-party/jvm-runtime-sources/RUNTIME_MODULES.tsv
            third-party/jvm-runtime-sources/SOURCE_SHA256SUMS
            third-party/jvm-runtime-sources/FULL_UPSTREAMS.tsv
            third-party/jvm-runtime-sources/ANDROIDX_COORDINATES.tsv
            third-party/jvm-runtime-sources/checkout-androidx-support.sh
            third-party/jvm-runtime-sources/full-upstreams/androidx-support-repository
            third-party/jvm-runtime-sources/REMOVED_NON_SOURCE_FILES.txt
            rivune/clients/android/app/src/main/assets/legal/LICENSE.txt
            rivune/clients/android/app/src/main/assets/legal/NOTICE
            rivune/clients/android/app/src/main/assets/legal/THIRD_PARTY_NOTICES.txt
            rivune/clients/android/app/src/main/assets/legal/licenses/GPL-3.0.txt
            rivune/clients/android/app/src/main/assets/legal/licenses/AndroidX-Media-Apache-2.0.txt
            rivune/clients/android/app/build.gradle.kts
            rivune/clients/android/gradlew
            rivune/clients/android/gradle/libs.versions.toml
            third-party/libmpv-android-1.0.0/buildscripts/build.sh
            third-party/libmpv-android-1.0.0/buildscripts/include/depinfo.sh
            third-party/libmpv-android-1.0.0/buildscripts/include/download-deps.sh
            third-party/libmpv-android-1.0.0/buildscripts/scripts/ffmpeg.sh
          )
          for dependency in mbedtls dav1d ffmpeg freetype fribidi harfbuzz libunibreak libxml2 fontconfig libass lua libplacebo mpv; do
            required_source_entries+=("third-party/libmpv-android-1.0.0/buildscripts/deps/${dependency}")
          done
          for required_entry in "${required_source_entries[@]}"; do
            if [[ ! -e "${source_root}/${required_entry}" ]]; then
              echo "Corresponding Source is missing required entry: ${required_entry}" >&2
              exit 1
            fi
          done

          source_date_epoch="$(git show -s --format=%ct "${RELEASE_SHA}")"
          LC_ALL=C tar --sort=name --format=posix --owner=0 --group=0 --numeric-owner \
            --mtime="@${source_date_epoch}" \
            --pax-option=delete=atime,delete=ctime \
            -cf ".release-private/${source_asset_name%.gz}" -C "${source_root}" .
          gzip -n -9 ".release-private/${source_asset_name%.gz}"
          mv ".release-private/${source_asset_name}" "release-assets/${source_asset_name}"
          source_archive_size="$(stat -c %s "release-assets/${source_asset_name}")"
          if (( source_archive_size > 2040109465 )); then
            echo "Corresponding Source archive exceeds the 1.9 GiB release-asset safety limit." >&2
            exit 1
          fi
          archive_entries="$(tar -tzf "release-assets/${source_asset_name}")"
          if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$)|(^|/)\.release-private(/|$))' <<<"${archive_entries}"; then
            echo "Corresponding Source archive contains an unsafe or forbidden path." >&2
            exit 1
          fi
          for required_entry in "${required_source_entries[@]}"; do
            if ! grep -Fxq "./${required_entry}" <<<"${archive_entries}" &&
               ! grep -Fxq "./${required_entry}/" <<<"${archive_entries}"; then
              echo "Corresponding Source archive is missing required entry: ${required_entry}" >&2
              exit 1
            fi
          done
          mv "release-assets/${source_asset_name}" release-inputs/
          mv "release-assets/${windows_asset_name}" release-inputs/
          rm -rf .release-private
          trap - EXIT
      - name: Upload immutable unsigned Android input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned-android-input/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
      - name: Upload immutable Windows and source inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-inputs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  sign-android:
    name: Sign Android release on an isolated runner
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - build-assets
    runs-on: ubuntu-latest
    environment: release
    outputs:
      artifact_name: signed-android-${{ github.run_id }}-${{ github.run_attempt }}
      signing_certificate_sha256: ${{ steps.sign.outputs.signing_certificate_sha256 }}
    permissions:
      contents: read
    steps:
      - name: Download immutable unsigned Android input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-assets.outputs.unsigned_android_artifact_name }}
          path: unsigned-android-input
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android signing tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Sign and verify Android release APK
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          RIVUNE_RELEASE_ANDROID_ASSET_NAME: ${{ needs.build-assets.outputs.android_asset_name }}
          RIVUNE_RELEASE_VERSION_CODE: ${{ needs.build-assets.outputs.version_code }}
          RIVUNE_RELEASE_VERSION_NAME: ${{ needs.build-assets.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release signing configuration is missing: ${name}" >&2
              exit 1
            fi
          done

          keystore_base64="${ANDROID_KEYSTORE_BASE64}"
          store_password="${ANDROID_KEYSTORE_PASSWORD}"
          key_password="${ANDROID_KEY_PASSWORD}"
          key_alias="${ANDROID_KEY_ALIAS}"
          expected_cert="${ANDROID_SIGNING_CERT_SHA256//:/}"
          expected_cert="${expected_cert,,}"
          unset ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS ANDROID_SIGNING_CERT_SHA256
          if [[ ! "${expected_cert}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ANDROID_SIGNING_CERT_SHA256 is not a SHA-256 certificate fingerprint." >&2
            exit 1
          fi

          signing_dir="$(mktemp -d "${RUNNER_TEMP}/rivune-android-signing.XXXXXX")"
          trap 'rm -rf -- "${signing_dir}"' EXIT
          keystore="${signing_dir}/rivune-release.keystore"
          store_password_file="${signing_dir}/store-password"
          key_password_file="${signing_dir}/key-password"
          aligned_apk="${signing_dir}/rivune-aligned.apk"
          printf '%s' "${store_password}" > "${store_password_file}"
          printf '%s' "${key_password}" > "${key_password_file}"
          unset store_password key_password
          if [[ ! "${keystore_base64}" =~ ^[A-Za-z0-9+/]*={0,2}$ ]] ||
             (( ${#keystore_base64} % 4 != 0 )) ||
             ! printf '%s' "${keystore_base64}" | base64 --decode > "${keystore}"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          unset keystore_base64
          if [[ ! -s "${keystore}" ]]; then
            echo "Decoded Android keystore is empty." >&2
            exit 1
          fi

          unsigned_apk='unsigned-android-input/app-release-unsigned.apk'
          mkdir signed-android
          asset_path="signed-android/${RIVUNE_RELEASE_ANDROID_ASSET_NAME}"
          if [[ ! -s "${unsigned_apk}" ]] || [[ -e "${asset_path}" ]]; then
            echo "The unsigned APK is absent or the signed output path already exists." >&2
            exit 1
          fi
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${android_home}" ]]; then
            echo "The isolated runner does not expose a preinstalled Android SDK." >&2
            exit 1
          fi
          build_tools="${android_home}/build-tools/36.0.0"
          zipalign="${build_tools}/zipalign"
          apksigner="${build_tools}/apksigner"
          aapt="${build_tools}/aapt"
          for tool in "${zipalign}" "${apksigner}" "${aapt}"; do
            if [[ ! -x "${tool}" ]]; then
              echo "The isolated runner is missing required Android signing tool: ${tool}" >&2
              exit 1
            fi
          done
          "${zipalign}" -f -p 4 "${unsigned_apk}" "${aligned_apk}"
          "${apksigner}" sign \
            --ks "${keystore}" \
            --ks-key-alias "${key_alias}" \
            --ks-pass "file:${store_password_file}" \
            --key-pass "file:${key_password_file}" \
            --v4-signing-enabled false \
            --out "${asset_path}" \
            "${aligned_apk}"
          "${apksigner}" verify --verbose --print-certs "${asset_path}" > "${signing_dir}/apksigner.txt"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${signing_dir}/apksigner.txt" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual_cert}" != "${expected_cert}" ]]; then
            echo "The APK signing certificate does not match ANDROID_SIGNING_CERT_SHA256." >&2
            exit 1
          fi
          if [[ "$(grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' "${signing_dir}/apksigner.txt")" != 1 ]]; then
            echo "The APK must have exactly one signing certificate." >&2
            exit 1
          fi
          badging="$("${aapt}" dump badging "${asset_path}" | sed -n '1p')"
          [[ "${badging}" == *"package: name='io.rivune.app'"* ]] || { echo "Unexpected APK applicationId." >&2; exit 1; }
          [[ "${badging}" == *" versionCode='${RIVUNE_RELEASE_VERSION_CODE}'"* ]] || { echo "Unexpected APK versionCode." >&2; exit 1; }
          [[ "${badging}" == *" versionName='${RIVUNE_RELEASE_VERSION_NAME}'"* ]] || { echo "Unexpected APK versionName." >&2; exit 1; }
          echo "signing_certificate_sha256=${expected_cert}" >> "${GITHUB_OUTPUT}"
      - name: Remove Android signing material
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}"/rivune-android-signing.*
      - name: Upload immutable signed Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  publish:
    name: Assemble release assets and publish image by digest
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - build-assets
      - sign-android
    runs-on: ubuntu-latest
    outputs:
      artifact_name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
      image_digest: ${{ steps.container.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Download immutable Windows and source inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-assets.outputs.release_inputs_artifact_name }}
          path: release-assets
      - name: Download immutable signed Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign-android.outputs.artifact_name }}
          path: release-assets
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: false
      - name: Generate and verify public release manifests
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RIVUNE_RELEASE_VERSION_NAME: ${{ needs.build-assets.outputs.version_name }}
          RIVUNE_RELEASE_VERSION_CODE: ${{ needs.build-assets.outputs.version_code }}
          RIVUNE_RELEASE_CHANNEL: ${{ needs.build-assets.outputs.channel }}
          RIVUNE_RELEASE_PUBLISHED_AT: ${{ needs.build-assets.outputs.published_at }}
          RIVUNE_RELEASE_ANDROID_ASSET_NAME: ${{ needs.build-assets.outputs.android_asset_name }}
          RIVUNE_RELEASE_SOURCE_ASSET_NAME: ${{ needs.build-assets.outputs.source_asset_name }}
          RIVUNE_RELEASE_WINDOWS_ASSET_NAME: ${{ needs.build-assets.outputs.windows_asset_name }}
          RIVUNE_RELEASE_URL: ${{ needs.build-assets.outputs.release_url }}
          RIVUNE_RELEASE_ANDROID_ASSET_URL: ${{ needs.build-assets.outputs.android_asset_url }}
          RIVUNE_RELEASE_WINDOWS_ASSET_URL: ${{ needs.build-assets.outputs.windows_asset_url }}
          RIVUNE_RELEASE_SIGNING_CERT_SHA256: ${{ needs.sign-android.outputs.signing_certificate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            RIVUNE_RELEASE_VERSION_NAME \
            RIVUNE_RELEASE_VERSION_CODE \
            RIVUNE_RELEASE_CHANNEL \
            RIVUNE_RELEASE_PUBLISHED_AT \
            RIVUNE_RELEASE_ANDROID_ASSET_NAME \
            RIVUNE_RELEASE_SOURCE_ASSET_NAME \
            RIVUNE_RELEASE_WINDOWS_ASSET_NAME \
            RIVUNE_RELEASE_URL \
            RIVUNE_RELEASE_ANDROID_ASSET_URL \
            RIVUNE_RELEASE_WINDOWS_ASSET_URL \
            RIVUNE_RELEASE_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release metadata is missing: ${name}" >&2
              exit 1
            fi
          done
          (
            cd clients/update
            go run . generate \
              --apk "${GITHUB_WORKSPACE}/release-assets/${RIVUNE_RELEASE_ANDROID_ASSET_NAME}" \
              --output "${GITHUB_WORKSPACE}/release-assets/rivune-update.json" \
              --legacy-android-output "${GITHUB_WORKSPACE}/release-assets/rivune-android-update.json" \
              --channel "${RIVUNE_RELEASE_CHANNEL}" \
              --tag-name "${RELEASE_TAG}" \
              --published-at "${RIVUNE_RELEASE_PUBLISHED_AT}" \
              --release-url "${RIVUNE_RELEASE_URL}" \
              --apk-url "${RIVUNE_RELEASE_ANDROID_ASSET_URL}" \
              --application-id io.rivune.app \
              --build-version "${RIVUNE_RELEASE_VERSION_CODE}" \
              --signing-certificate-sha256 "${RIVUNE_RELEASE_SIGNING_CERT_SHA256}" \
              --windows-executable "${GITHUB_WORKSPACE}/release-assets/${RIVUNE_RELEASE_WINDOWS_ASSET_NAME}" \
              --windows-executable-url "${RIVUNE_RELEASE_WINDOWS_ASSET_URL}"
            go run . validate \
              --apk "${GITHUB_WORKSPACE}/release-assets/${RIVUNE_RELEASE_ANDROID_ASSET_NAME}" \
              --channel "${RIVUNE_RELEASE_CHANNEL}" \
              --tag-name "${RELEASE_TAG}" \
              --release-url "${RIVUNE_RELEASE_URL}" \
              --apk-url "${RIVUNE_RELEASE_ANDROID_ASSET_URL}" \
              --application-id io.rivune.app \
              --build-version "${RIVUNE_RELEASE_VERSION_CODE}" \
              --signing-certificate-sha256 "${RIVUNE_RELEASE_SIGNING_CERT_SHA256}" \
              --windows-executable "${GITHUB_WORKSPACE}/release-assets/${RIVUNE_RELEASE_WINDOWS_ASSET_NAME}" \
              --windows-executable-url "${RIVUNE_RELEASE_WINDOWS_ASSET_URL}" \
              --legacy-android-manifest "${GITHUB_WORKSPACE}/release-assets/rivune-android-update.json" \
              "${GITHUB_WORKSPACE}/release-assets/rivune-update.json"
          )
          (
            cd release-assets
            sha256sum \
              "${RIVUNE_RELEASE_ANDROID_ASSET_NAME}" \
              "${RIVUNE_RELEASE_SOURCE_ASSET_NAME}" \
              "${RIVUNE_RELEASE_WINDOWS_ASSET_NAME}" \
              rivune-update.json \
              rivune-android-update.json > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reauthorize refs immediately before image digest publication
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/$1"
          }
          main_sha="$(api git/ref/heads/main | jq -er '.object.sha')"
          tag_ref="$(api "git/ref/tags/${RELEASE_TAG}")" || {
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          }
          tag_object_sha="$(jq -er 'select(.object.type == "tag") | .object.sha | select(test("^[0-9a-f]{40}$"))' <<<"${tag_ref}")" || {
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          }
          tag_sha="$(api "git/tags/${tag_object_sha}" | jq -er 'select(.object.type == "commit") | .object.sha | select(test("^[0-9a-f]{40}$"))')" || {
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          }
          release_count="$(gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" |
            jq --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)] | length')"
          if [[ "${APPROVED_SHA}" != "${tag_sha}" ]] ||
             (( release_count > 1 )) ||
             { [[ "${APPROVED_SHA}" != "${main_sha}" ]] && (( release_count != 1 )); }; then
            echo "Release authorization expired because the tag moved, multiple matching Releases exist, or main moved before the first matching Release was created." >&2
            exit 1
          fi
      - name: Publish unlisted linux/amd64 and linux/arm64 image by digest
        id: container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.authorize.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=rivune-container
      - name: Upload immutable public release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  release:
    name: Prepare or adopt validated GitHub release
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - publish
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      image_digest: ${{ steps.draft.outputs.image_digest }}
    permissions:
      contents: write
    steps:
      - name: Check out approved release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android verification tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download immutable release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.publish.outputs.artifact_name }}
          path: release-assets
      - name: Verify release assets and references
        env:
          RELEASE_STABLE: ${{ needs.authorize.outputs.stable }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG#v}"
          asset_name="rivune-android-${version_name}.apk"
          source_asset_name="rivune-android-${version_name}-corresponding-source.tar.gz"
          windows_asset_name='Rivune.exe'
          expected_files="$(printf '%s\n' SHA256SUMS rivune-update.json rivune-android-update.json "${asset_name}" "${source_asset_name}" "${windows_asset_name}" | sort)"
          actual_files="$(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${actual_files}" != "${expected_files}" ]]; then
            echo "Immutable artifact does not contain the exact release asset set." >&2
            exit 1
          fi
          checksum_files="$(sed -nE 's/^[0-9a-f]{64}  (.+)$/\1/p' release-assets/SHA256SUMS | sort)"
          expected_checksum_files="$(printf '%s\n' rivune-update.json rivune-android-update.json "${asset_name}" "${source_asset_name}" "${windows_asset_name}" | sort)"
          if [[ "${checksum_files}" != "${expected_checksum_files}" ]]; then
            echo "SHA256SUMS must contain exactly the APK, Corresponding Source, Rivune.exe, and both update manifests." >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )
          windows_size="$(stat -c %s "release-assets/${windows_asset_name}")"
          if (( windows_size <= 0 || windows_size > 2147483647 )); then
            echo "Rivune.exe size is invalid: ${windows_size} bytes." >&2
            exit 1
          fi
          if (( $(stat -c %s "release-assets/${source_asset_name}") > 2040109465 )); then
            echo "Corresponding Source archive exceeds the 1.9 GiB release-asset safety limit." >&2
            exit 1
          fi
          archive_entries="$(tar -tzf "release-assets/${source_asset_name}")"
          if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$)|(^|/)\.release-private(/|$))' <<<"${archive_entries}"; then
            echo "Corresponding Source archive contains an unsafe or forbidden path." >&2
            exit 1
          fi
          required_archive_entries=(
            ./UPSTREAM_SOURCES.txt
            ./REBUILDING.txt
            ./rebuild-android.sh
            ./RELEASE_BUILD_ENV
            ./third-party/jvm-runtime-sources/RUNTIME_MODULES.tsv
            ./third-party/jvm-runtime-sources/SOURCE_SHA256SUMS
            ./third-party/jvm-runtime-sources/FULL_UPSTREAMS.tsv
            ./third-party/jvm-runtime-sources/ANDROIDX_COORDINATES.tsv
            ./third-party/jvm-runtime-sources/checkout-androidx-support.sh
            ./third-party/jvm-runtime-sources/full-upstreams/androidx-support-repository/
            ./third-party/jvm-runtime-sources/REMOVED_NON_SOURCE_FILES.txt
            ./rivune/clients/android/app/build.gradle.kts
            ./rivune/clients/android/gradle/libs.versions.toml
            ./rivune/clients/android/app/src/main/assets/legal/LICENSE.txt
            ./rivune/clients/android/app/src/main/assets/legal/NOTICE
            ./rivune/clients/android/app/src/main/assets/legal/THIRD_PARTY_NOTICES.txt
            ./rivune/clients/android/app/src/main/assets/legal/licenses/GPL-3.0.txt
            ./rivune/clients/android/app/src/main/assets/legal/licenses/AndroidX-Media-Apache-2.0.txt
            ./third-party/libmpv-android-1.0.0/buildscripts/include/depinfo.sh
            ./third-party/libmpv-android-1.0.0/buildscripts/include/download-deps.sh
            ./third-party/libmpv-android-1.0.0/buildscripts/scripts/ffmpeg.sh
            ./third-party/jvm-runtime-sources/RESOLVED_COMPONENTS.txt
          )
          for dependency in mbedtls dav1d ffmpeg freetype fribidi harfbuzz libunibreak libxml2 fontconfig libass lua libplacebo mpv; do
            required_archive_entries+=("./third-party/libmpv-android-1.0.0/buildscripts/deps/${dependency}/")
          done
          for required_entry in "${required_archive_entries[@]}"; do
            if ! grep -Fxq "${required_entry}" <<<"${archive_entries}"; then
              echo "Corresponding Source archive is missing required entry: ${required_entry}" >&2
              exit 1
            fi
          done
          if [[ "${RELEASE_STABLE}" == true ]]; then
            expected_channel=stable
          else
            expected_channel=prerelease
          fi
          expected_release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          expected_asset_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          expected_windows_asset_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${windows_asset_name}"
          (
            cd clients/update
            go run . validate \
              --apk "${GITHUB_WORKSPACE}/release-assets/${asset_name}" \
              --channel "${expected_channel}" \
              --tag-name "${RELEASE_TAG}" \
              --release-url "${expected_release_url}" \
              --apk-url "${expected_asset_url}" \
              --application-id io.rivune.app \
              --build-version "$(jq -er '.packages.android.buildVersion' "${GITHUB_WORKSPACE}/release-assets/rivune-update.json")" \
              --signing-certificate-sha256 "$(jq -er '.packages.android.signingCertificateSha256' "${GITHUB_WORKSPACE}/release-assets/rivune-update.json")" \
              --windows-executable "${GITHUB_WORKSPACE}/release-assets/${windows_asset_name}" \
              --windows-executable-url "${expected_windows_asset_url}" \
              --legacy-android-manifest "${GITHUB_WORKSPACE}/release-assets/rivune-android-update.json" \
              "${GITHUB_WORKSPACE}/release-assets/rivune-update.json"
          )
      - name: Validate curated release notes
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          IFS= read -r heading < .github/release-notes.md
          if [[ "${heading}" != "# Rivune ${RELEASE_TAG}" ]]; then
            echo ".github/release-notes.md must start with: # Rivune ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Reauthorize refs immediately before release preparation
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/$1"
          }
          main_sha="$(api git/ref/heads/main | jq -er '.object.sha')"
          if ! tag_ref="$(api "git/ref/tags/${RELEASE_TAG}")" ||
             ! tag_object_sha="$(jq -er 'select(.object.type == "tag") | .object.sha | select(test("^[0-9a-f]{40}$"))' <<<"${tag_ref}")" ||
             ! tag_sha="$(api "git/tags/${tag_object_sha}" | jq -er 'select(.object.type == "commit") | .object.sha | select(test("^[0-9a-f]{40}$"))')"; then
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          fi
          release_count="$(gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" |
            jq --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)] | length')"
          if [[ "${APPROVED_SHA}" != "${tag_sha}" ]]; then
            echo "Release authorization expired because the tag moved." >&2
            exit 1
          fi
          if [[ "${release_count}" == 0 ]] && [[ "${APPROVED_SHA}" != "${main_sha}" ]]; then
            echo "Release authorization expired before initial release creation because main moved." >&2
            exit 1
          fi
      - name: Create or adopt and validate release
        id: draft
        env:
          CURRENT_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_STABLE: ${{ needs.authorize.outputs.stable }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_id=""
          created_release=false
          created_release_json='{}'
          digest_marker_prefix='<!-- rivune-oci-image-digest:'

          matching_releases() {
            gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" |
              jq --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)]'
          }
          observe_matching_releases() {
            local candidate='[]' candidate_id='' releases release_count release_id attempt
            for attempt in {1..12}; do
              releases="$(matching_releases)"
              release_count="$(jq 'length' <<<"${releases}")"
              if (( release_count > 1 )); then
                echo "Expected zero or one GitHub Release for ${RELEASE_TAG}, found ${release_count}." >&2
                return 1
              fi
              if (( release_count == 1 )); then
                release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${releases}")"
                if [[ -n "${candidate_id}" ]] && [[ "${release_id}" != "${candidate_id}" ]]; then
                  echo "The matching GitHub Release changed during the bounded observation window." >&2
                  return 1
                fi
                candidate_id="${release_id}"
                candidate="${releases}"
              fi
              if (( attempt < 12 )); then
                sleep 1
              fi
            done
            printf '%s' "${candidate}"
          }
          wait_for_created_release() {
            local expected_id="$1" candidate='' releases release_count attempt
            for attempt in {1..12}; do
              releases="$(matching_releases)"
              release_count="$(jq 'length' <<<"${releases}")"
              if (( release_count > 0 )); then
                if ! jq -e --argjson id "${expected_id}" 'length == 1 and .[0].id == $id' <<<"${releases}" >/dev/null; then
                  echo "Release creation converged to a different or duplicate release." >&2
                  return 1
                fi
                candidate="${releases}"
              fi
              if (( attempt < 12 )); then
                sleep 1
              fi
            done
            if [[ -z "${candidate}" ]]; then
              echo "The created GitHub Release was not visible after the bounded convergence wait." >&2
              return 1
            fi
            printf '%s' "${candidate}"
          }
          cleanup_created_draft() {
            local status=$? attempt current_release
            if (( status == 0 )); then
              return 0
            fi
            if [[ "${created_release}" == true ]] &&
               [[ "${release_id}" =~ ^[1-9][0-9]*$ ]] &&
               validate_release_metadata "${created_release_json}" &&
               jq -e --argjson id "${release_id}" '.id == $id and .draft == true' <<<"${created_release_json}" >/dev/null 2>&1; then
              for attempt in {1..12}; do
                current_release="$(gh api "repos/${REPOSITORY}/releases/${release_id}" 2>/dev/null || true)"
                if [[ -n "${current_release}" ]]; then
                  if ! validate_release_metadata "${current_release}" ||
                     ! jq -e --argjson id "${release_id}" --argjson created "${created_release_json}" '
                       .id == $id and
                       .draft == true and
                       .body == $created.body and
                       (.assets | type == "array" and length == 0)
                     ' <<<"${current_release}" >/dev/null 2>&1; then
                    echo "::warning::Preserving a created draft that changed or already contains release assets." >&2
                    return 0
                  fi
                  if gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}" >/dev/null 2>&1; then
                    return 0
                  fi
                fi
                if (( attempt < 12 )); then
                  sleep 1
                fi
              done
              echo "::warning::The draft created by this attempt could not be deleted after bounded retries." >&2
            fi
          }
          upload_release_asset() {
            local asset_path="$1" content_type="$2" asset_name expected_size response
            asset_name="${asset_path##*/}"
            expected_size="$(stat -c '%s' "${asset_path}")"
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Content-Type: ${content_type}" \
              --url-query "name=${asset_name}" \
              --upload-file "${asset_path}" \
              "${upload_url}")"
            if ! jq -e --arg name "${asset_name}" --argjson size "${expected_size}" '
              .id as $id |
              ($id | type == "number") and
              ($id > 0) and
              .name == $name and
              .size == $size and
              .state == "uploaded"
            ' <<<"${response}" >/dev/null; then
              echo "The uploaded GitHub Release asset response is invalid for ${asset_name}." >&2
              return 1
            fi
          }
          complete_partial_release_assets() {
            local release_json="$1" release_asset_id release_asset_name adopted_sha trusted_sha
            local candidate_release_id content_type expected_upload_url upload_url
            local version_name="${RELEASE_TAG#v}"
            local apk_name="rivune-android-${version_name}.apk"
            local source_name="rivune-android-${version_name}-corresponding-source.tar.gz"
            local windows_name='Rivune.exe'
            local -a expected_names=(
              SHA256SUMS
              rivune-update.json
              rivune-android-update.json
              "${apk_name}"
              "${source_name}"
              "${windows_name}"
            )
            local -A seen=()

            if ! jq -e '
              .assets | arrays |
              all(.[];
                (.id | type == "number") and .id > 0 and
                (.name | type == "string") and
                .state == "uploaded")
            ' <<<"${release_json}" >/dev/null; then
              echo "The partial GitHub Release asset metadata is invalid." >&2
              return 1
            fi

            while IFS=$'\t' read -r release_asset_id release_asset_name; do
              if [[ ! "${release_asset_id}" =~ ^[1-9][0-9]*$ ]]; then
                echo "The partial GitHub Release contains an invalid asset ID." >&2
                return 1
              fi
              case "${release_asset_name}" in
                SHA256SUMS|rivune-update.json|rivune-android-update.json|"${apk_name}"|"${source_name}"|"${windows_name}") ;;
                *)
                  echo "The partial GitHub Release contains an unexpected asset: ${release_asset_name}" >&2
                  return 1
                  ;;
              esac
              if [[ -v "seen[${release_asset_name}]" ]]; then
                echo "The partial GitHub Release contains a duplicate asset: ${release_asset_name}" >&2
                return 1
              fi
              seen["${release_asset_name}"]=1
            done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"${release_json}")

            if (( ${#seen[@]} == ${#expected_names[@]} )); then
              return 0
            fi
            if ! jq -e '.draft == true' <<<"${release_json}" >/dev/null; then
              echo "A published GitHub Release has an incomplete asset set and cannot be repaired." >&2
              return 1
            fi

            rm -rf partial-release-assets
            mkdir partial-release-assets
            while IFS=$'\t' read -r release_asset_id release_asset_name; do
              gh api \
                --header 'Accept: application/octet-stream' \
                "repos/${REPOSITORY}/releases/assets/${release_asset_id}" > "partial-release-assets/${release_asset_name}"
              adopted_sha="$(sha256sum "partial-release-assets/${release_asset_name}" | cut -d ' ' -f1)"
              trusted_sha="$(sha256sum "release-assets/${release_asset_name}" | cut -d ' ' -f1)"
              if [[ "${adopted_sha}" != "${trusted_sha}" ]]; then
                echo "The partial ${release_asset_name} differs from the trusted release artifact." >&2
                return 1
              fi
            done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"${release_json}")

            candidate_release_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${release_json}")"
            if [[ "${candidate_release_id}" != "${release_id}" ]]; then
              echo "The partial GitHub Release ID changed during adoption." >&2
              return 1
            fi
            upload_url="$(jq -er '.upload_url | strings' <<<"${release_json}")"
            expected_upload_url="https://uploads.github.com/repos/${REPOSITORY}/releases/${candidate_release_id}/assets{?name,label}"
            if [[ "${upload_url}" != "${expected_upload_url}" ]]; then
              echo "The partial GitHub Release returned an unexpected asset upload URL." >&2
              return 1
            fi
            upload_url="${upload_url%%\{*}"
            for release_asset_name in "${expected_names[@]}"; do
              if [[ -v "seen[${release_asset_name}]" ]]; then
                continue
              fi
              case "${release_asset_name}" in
                SHA256SUMS) content_type='text/plain' ;;
                rivune-update.json|rivune-android-update.json) content_type='application/json' ;;
                "${apk_name}") content_type='application/vnd.android.package-archive' ;;
                "${source_name}") content_type='application/gzip' ;;
                "${windows_name}") content_type='application/vnd.microsoft.portable-executable' ;;
              esac
              upload_release_asset "release-assets/${release_asset_name}" "${content_type}"
            done
            release="$(gh api "repos/${REPOSITORY}/releases/${candidate_release_id}")"
          }
          validate_body_and_digest() {
            local release_json="$1" body marker_mentions
            body="$(jq -er '.body | strings' <<<"${release_json}")"
            mapfile -t digest_markers < <(sed -nE 's/^<!-- rivune-oci-image-digest: (sha256:[0-9a-f]{64}) -->$/\1/p' <<<"${body}")
            marker_mentions="$( (grep -oF "${digest_marker_prefix}" <<<"${body}" || true) | wc -l)"
            if (( ${#digest_markers[@]} != 1 )) || [[ "${marker_mentions}" != 1 ]]; then
              echo "The GitHub Release body must contain exactly one valid OCI image digest marker." >&2
              return 1
            fi
            printf '%s\n\n<!-- rivune-oci-image-digest: %s -->' "$(cat .github/release-notes.md)" "${digest_markers[0]}" > expected-release-notes.md
            if ! jq -e --rawfile expected_body expected-release-notes.md '.body == $expected_body' <<<"${release_json}" >/dev/null; then
              echo "The GitHub Release body does not match the curated notes and recorded digest." >&2
              return 1
            fi
            printf '%s' "${digest_markers[0]}"
          }
          validate_release_metadata() {
            local release_json="$1" expected_prerelease=true
            if [[ "${RELEASE_STABLE}" == true ]]; then
              expected_prerelease=false
            fi
            jq -e \
              --arg tag "${RELEASE_TAG}" \
              --arg sha "${RELEASE_SHA}" \
              --argjson prerelease "${expected_prerelease}" '
                .tag_name == $tag and
                .name == $tag and
                .target_commitish == $sha and
                .prerelease == $prerelease and
                ((.draft == true and .published_at == null) or
                 (.draft == false and (.published_at | type == "string" and length > 0)))
              ' <<<"${release_json}" >/dev/null
          }
          validate_remote_assets() {
            local release_json="$1" asset_id asset_name
            local version_name="${RELEASE_TAG#v}"
            local apk_name="rivune-android-${version_name}.apk"
            local source_name="rivune-android-${version_name}-corresponding-source.tar.gz"
            local windows_name='Rivune.exe'
            local expected_assets actual_assets expected_channel expected_release_url expected_apk_url expected_windows_url
            expected_assets="$(printf '%s\n' SHA256SUMS rivune-update.json rivune-android-update.json "${apk_name}" "${source_name}" "${windows_name}" | sort)"
            actual_assets="$(jq -r '.assets[].name' <<<"${release_json}" | sort)"
            if [[ "${actual_assets}" != "${expected_assets}" ]]; then
              echo "The GitHub Release asset set is incomplete or contains unexpected files." >&2
              return 1
            fi

            rm -rf adopted-release-assets
            mkdir adopted-release-assets
            while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "${asset_id}" =~ ^[1-9][0-9]*$ ]]; then
                echo "The GitHub Release contains an invalid asset ID." >&2
                return 1
              fi
              gh api \
                --header 'Accept: application/octet-stream' \
                "repos/${REPOSITORY}/releases/assets/${asset_id}" > "adopted-release-assets/${asset_name}"
            done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"${release_json}")

            local checksum_files expected_checksum_files
            checksum_files="$(sed -nE 's/^[0-9a-f]{64}  (.+)$/\1/p' adopted-release-assets/SHA256SUMS | sort)"
            expected_checksum_files="$(printf '%s\n' rivune-update.json rivune-android-update.json "${apk_name}" "${source_name}" "${windows_name}" | sort)"
            if [[ "${checksum_files}" != "${expected_checksum_files}" ]]; then
              echo "The adopted SHA256SUMS must contain exactly the APK, Corresponding Source, Rivune.exe, and both update manifests." >&2
              return 1
            fi
            (
              cd adopted-release-assets
              sha256sum --check --strict SHA256SUMS
            )
            local adopted_windows_size
            adopted_windows_size="$(stat -c %s "adopted-release-assets/${windows_name}")"
            if (( adopted_windows_size <= 0 || adopted_windows_size > 2147483647 )); then
              echo "The adopted Rivune.exe size is invalid: ${adopted_windows_size} bytes." >&2
              return 1
            fi

            local trusted_asset adopted_asset_sha trusted_asset_sha archive_entries
            for trusted_asset in \
              SHA256SUMS \
              rivune-update.json \
              rivune-android-update.json \
              "${apk_name}" \
              "${source_name}" \
              "${windows_name}"; do
              adopted_asset_sha="$(sha256sum "adopted-release-assets/${trusted_asset}" | cut -d ' ' -f1)"
              trusted_asset_sha="$(sha256sum "release-assets/${trusted_asset}" | cut -d ' ' -f1)"
              if [[ "${adopted_asset_sha}" != "${trusted_asset_sha}" ]]; then
                echo "The adopted ${trusted_asset} differs from the trusted release artifact." >&2
                return 1
              fi
            done
            if (( $(stat -c %s "adopted-release-assets/${source_name}") > 2040109465 )); then
              echo "The adopted Corresponding Source exceeds the 1.9 GiB release-asset safety limit." >&2
              return 1
            fi
            archive_entries="$(tar -tzf "adopted-release-assets/${source_name}")"
            if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$)|(^|/)\.release-private(/|$))' <<<"${archive_entries}"; then
              echo "The adopted Corresponding Source contains an unsafe or forbidden path." >&2
              return 1
            fi
            for required_entry in \
              ./UPSTREAM_SOURCES.txt \
              ./REBUILDING.txt \
              ./rebuild-android.sh \
              ./RELEASE_BUILD_ENV \
              ./third-party/jvm-runtime-sources/RESOLVED_COMPONENTS.txt \
              ./third-party/jvm-runtime-sources/RUNTIME_MODULES.tsv \
              ./third-party/jvm-runtime-sources/SOURCE_SHA256SUMS \
              ./third-party/jvm-runtime-sources/FULL_UPSTREAMS.tsv \
              ./third-party/jvm-runtime-sources/ANDROIDX_COORDINATES.tsv \
              ./third-party/jvm-runtime-sources/checkout-androidx-support.sh \
              ./third-party/jvm-runtime-sources/full-upstreams/androidx-support-repository/ \
              ./third-party/jvm-runtime-sources/REMOVED_NON_SOURCE_FILES.txt \
              ./rivune/clients/android/app/build.gradle.kts \
              ./rivune/clients/android/gradle/libs.versions.toml \
              ./rivune/clients/android/app/src/main/assets/legal/LICENSE.txt \
              ./rivune/clients/android/app/src/main/assets/legal/NOTICE \
              ./rivune/clients/android/app/src/main/assets/legal/THIRD_PARTY_NOTICES.txt \
              ./rivune/clients/android/app/src/main/assets/legal/licenses/GPL-3.0.txt \
              ./rivune/clients/android/app/src/main/assets/legal/licenses/AndroidX-Media-Apache-2.0.txt \
              ./third-party/libmpv-android-1.0.0/buildscripts/include/depinfo.sh \
              ./third-party/libmpv-android-1.0.0/buildscripts/include/download-deps.sh \
              ./third-party/libmpv-android-1.0.0/buildscripts/scripts/ffmpeg.sh; do
              if ! grep -Fxq "${required_entry}" <<<"${archive_entries}"; then
                echo "The adopted Corresponding Source is missing required entry: ${required_entry}" >&2
                return 1
              fi
            done
            for dependency in mbedtls dav1d ffmpeg freetype fribidi harfbuzz libunibreak libxml2 fontconfig libass lua libplacebo mpv; do
              if ! grep -Fxq "./third-party/libmpv-android-1.0.0/buildscripts/deps/${dependency}/" <<<"${archive_entries}"; then
                echo "The adopted Corresponding Source is missing dependency source: ${dependency}" >&2
                return 1
              fi
            done

            if [[ "${RELEASE_STABLE}" == true ]]; then
              expected_channel=stable
            else
              expected_channel=prerelease
            fi
            expected_release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
            expected_apk_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_name}"
            expected_windows_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${windows_name}"
            (
              cd clients/update
              go run . validate \
                --apk "${GITHUB_WORKSPACE}/adopted-release-assets/${apk_name}" \
                --channel "${expected_channel}" \
                --tag-name "${RELEASE_TAG}" \
                --release-url "${expected_release_url}" \
                --apk-url "${expected_apk_url}" \
                --windows-executable "${GITHUB_WORKSPACE}/adopted-release-assets/${windows_name}" \
                --windows-executable-url "${expected_windows_url}" \
                --application-id io.rivune.app \
                --build-version "$(jq -er '.packages.android.buildVersion' "${GITHUB_WORKSPACE}/adopted-release-assets/rivune-update.json")" \
                --signing-certificate-sha256 "$(jq -er '.packages.android.signingCertificateSha256' "${GITHUB_WORKSPACE}/adopted-release-assets/rivune-update.json")" \
                --legacy-android-manifest "${GITHUB_WORKSPACE}/adopted-release-assets/rivune-android-update.json" \
                "${GITHUB_WORKSPACE}/adopted-release-assets/rivune-update.json"
            )
            local trusted_application_id trusted_build_version trusted_cert trusted_version_name
            trusted_application_id="$(jq -er '.package.applicationId' release-assets/rivune-android-update.json)"
            trusted_build_version="$(jq -er '.package.buildVersion' release-assets/rivune-android-update.json)"
            trusted_cert="$(jq -er '.package.signingCertificateSha256' release-assets/rivune-android-update.json)"
            trusted_version_name="$(jq -er '.version' release-assets/rivune-android-update.json)"
            local apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
            local aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
            local actual_cert apksigner_output badging
            apksigner_output="$("${apksigner}" verify --verbose --print-certs "adopted-release-assets/${apk_name}")"
            actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"${apksigner_output}" |
              tr '[:upper:]' '[:lower:]')"
            if [[ "${actual_cert}" != "${trusted_cert}" ]] ||
               [[ "$(grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' <<<"${apksigner_output}")" != 1 ]]; then
              echo "The adopted APK signing certificate differs from the trusted release artifact." >&2
              return 1
            fi
            badging="$("${aapt}" dump badging "adopted-release-assets/${apk_name}" | sed -n '1p')"
            [[ "${badging}" == *"package: name='${trusted_application_id}'"* ]] || {
              echo "The adopted APK applicationId differs from the trusted release artifact." >&2
              return 1
            }
            [[ "${badging}" == *" versionCode='${trusted_build_version}'"* ]] || {
              echo "The adopted APK versionCode differs from the trusted release artifact." >&2
              return 1
            }
            [[ "${badging}" == *" versionName='${trusted_version_name}'"* ]] || {
              echo "The adopted APK versionName differs from the trusted release artifact." >&2
              return 1
            }
            if ! jq -e --slurpfile trusted release-assets/rivune-android-update.json '
              .version == $trusted[0].version and
              .channel == $trusted[0].channel and
              .tagName == $trusted[0].tagName and
              .package.format == $trusted[0].package.format and
              .package.architectures == $trusted[0].package.architectures and
              .package.applicationId == $trusted[0].package.applicationId and
              .package.buildVersion == $trusted[0].package.buildVersion and
              .package.minimumOsVersion == $trusted[0].package.minimumOsVersion and
              .package.fileName == $trusted[0].package.fileName and
              .package.signingCertificateSha256 == $trusted[0].package.signingCertificateSha256
            ' adopted-release-assets/rivune-android-update.json >/dev/null; then
              echo "The adopted manifest identity, signing, or version differs from the trusted release artifact." >&2
              return 1
            fi
          }

          if [[ ! "${CURRENT_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The newly published OCI image digest is invalid: ${CURRENT_IMAGE_DIGEST}" >&2
            exit 1
          fi
          releases="$(observe_matching_releases)"
          release_count="$(jq 'length' <<<"${releases}")"
          if [[ "${release_count}" == 0 ]]; then
            printf '%s\n\n<!-- rivune-oci-image-digest: %s -->' "$(cat .github/release-notes.md)" "${CURRENT_IMAGE_DIGEST}" > prepared-release-notes.md
            expected_prerelease=true
            if [[ "${RELEASE_STABLE}" == true ]]; then
              expected_prerelease=false
            fi
            release_request="$(jq -n \
              --arg tag "${RELEASE_TAG}" \
              --arg sha "${RELEASE_SHA}" \
              --rawfile body prepared-release-notes.md \
              --argjson prerelease "${expected_prerelease}" '
                {
                  tag_name: $tag,
                  target_commitish: $sha,
                  name: $tag,
                  body: $body,
                  draft: true,
                  prerelease: $prerelease
                }
              ')"
            trap cleanup_created_draft EXIT
            created_release_json="$(gh api --method POST "repos/${REPOSITORY}/releases" --input - <<<"${release_request}")"
            created_release=true
            release_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${created_release_json}")"
            if ! validate_release_metadata "${created_release_json}" ||
               ! jq -e '.assets | type == "array" and length == 0' <<<"${created_release_json}" >/dev/null; then
              echo "The created GitHub Release response does not match the authorized empty draft." >&2
              exit 1
            fi
            created_image_digest="$(validate_body_and_digest "${created_release_json}")"
            if [[ "${created_image_digest}" != "${CURRENT_IMAGE_DIGEST}" ]]; then
              echo "The created GitHub Release did not record the published OCI image digest." >&2
              exit 1
            fi
            releases="$(wait_for_created_release "${release_id}")"
          elif [[ "${release_count}" != 1 ]]; then
            echo "Expected zero or one GitHub Release for ${RELEASE_TAG}, found ${release_count}." >&2
            exit 1
          fi

          release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${releases}")"
          release="$(gh api "repos/${REPOSITORY}/releases/${release_id}")"
          if ! validate_release_metadata "${release}"; then
            echo "The existing GitHub Release metadata does not match the authorized release." >&2
            exit 1
          fi
          validate_body_and_digest "${release}" >/dev/null
          complete_partial_release_assets "${release}"
          if ! validate_release_metadata "${release}"; then
            echo "The completed GitHub Release metadata changed unexpectedly." >&2
            exit 1
          fi
          effective_image_digest="$(validate_body_and_digest "${release}")"
          validate_remote_assets "${release}"
          if [[ "${created_release}" == true ]] && [[ "${effective_image_digest}" != "${CURRENT_IMAGE_DIGEST}" ]]; then
            echo "The newly created release did not record the published OCI image digest." >&2
            exit 1
          fi

          {
            echo "release_id=${release_id}"
            echo "image_digest=${effective_image_digest}"
          } >> "${GITHUB_OUTPUT}"
          trap - EXIT

  verify-windows-release:
    name: Verify adopted Windows x64 executable
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - release
    runs-on: windows-latest
    permissions:
      # GitHub exposes draft release assets only to tokens with contents: write.
      contents: write
    steps:
      - name: Verify remote executable architecture, version, hash, and unsigned state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('GH_TOKEN', 'RELEASE_ID', 'RELEASE_TAG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Windows release verification value is missing: $name"
            }
          }
          if ($env:RELEASE_ID -notmatch '^[1-9][0-9]*$') { throw 'Validated GitHub Release ID is invalid.' }
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Release tag is not valid SemVer: $env:RELEASE_TAG"
          }
          $components = @([uint64]$Matches[1], [uint64]$Matches[2], [uint64]$Matches[3])
          if ($components | Where-Object { $_ -gt 65535 }) {
            throw 'Every SemVer core component must be at most 65535 for Windows file-version metadata.'
          }
          $versionName = $env:RELEASE_TAG.Substring(1)
          $fileVersion = "$($components[0]).$($components[1]).$($components[2]).0"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -ne $env:RELEASE_TAG) {
            throw 'Could not retrieve the validated GitHub Release.'
          }
          $asset = @($release.assets | Where-Object { $_.name -ceq 'Rivune.exe' })
          $manifestAsset = @($release.assets | Where-Object { $_.name -ceq 'rivune-update.json' })
          if ($asset.Count -ne 1 -or $manifestAsset.Count -ne 1 -or
              $asset[0].id -notmatch '^[1-9][0-9]*$' -or $manifestAsset[0].id -notmatch '^[1-9][0-9]*$') {
            throw 'GitHub Release must contain exactly one Rivune.exe and one global update manifest.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'rivune-adopted-windows'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $executable = Join-Path $root 'Rivune.exe'
          $manifestPath = Join-Path $root 'rivune-update.json'
          $headers = @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset[0].id)" `
            -Headers $headers -OutFile $executable
          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($manifestAsset[0].id)" `
            -Headers $headers -OutFile $manifestPath

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $windows = $manifest.packages.windows
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/Rivune.exe"
          if ($windows.format -cne 'exe' -or $windows.fileName -cne 'Rivune.exe' -or
              $windows.url -cne $expectedUrl -or @($windows.architectures).Count -ne 1 -or
              $windows.architectures[0] -cne 'x64' -or $windows.minimumOsVersion -cne '10.0.19041.0' -or
              $windows.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $windows.size -isnot [long] -or $windows.size -le 0 -or $windows.size -gt 2147483647) {
            throw 'Global update manifest has invalid Windows executable metadata.'
          }
          $actualSize = (Get-Item -LiteralPath $executable).Length
          $actualHash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSize -ne $windows.size -or $actualHash -cne $windows.sha256) {
            throw 'Rivune.exe size or SHA-256 does not match the global update manifest.'
          }
          $stream = [IO.File]::OpenRead($executable)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Rivune.exe has no DOS PE header.' }
            $stream.Position = 0x3c
            $peOffset = $reader.ReadUInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Rivune.exe has no PE signature.' }
            if ($reader.ReadUInt16() -ne 0x8664) { throw 'Rivune.exe PE machine is not x64.' }
          } finally {
            if ($null -ne $reader) { $reader.Dispose() } else { $stream.Dispose() }
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($executable)
          if ($version.FileVersion -ne $fileVersion -or $version.ProductVersion -ne $versionName) {
            throw "Rivune.exe version metadata is invalid: FileVersion=$($version.FileVersion), ProductVersion=$($version.ProductVersion)."
          }
          if ((Get-AuthenticodeSignature -FilePath $executable).Status -ne 'NotSigned') {
            throw 'Adopted Rivune.exe must be unsigned.'
          }

  promote:
    name: Publish release and promote container tags
    if: needs.authorize.outputs.authorized == 'true'
    needs:
      - authorize
      - publish
      - release
      - verify-windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable release image tag
        id: version
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.authorize.outputs.tag }}
      - name: Generate mutable stable image aliases
        if: needs.authorize.outputs.stable == 'true'
        id: aliases
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.authorize.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.authorize.outputs.tag }}
            type=raw,value=latest
      - name: Verify the prepared release before image promotion
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.authorize.outputs.stable }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/$1"
          }
          tag_ref="$(api "git/ref/tags/${RELEASE_TAG}")" || {
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          }
          tag_object_sha="$(jq -er 'select(.object.type == "tag") | .object.sha | select(test("^[0-9a-f]{40}$"))' <<<"${tag_ref}")" || {
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          }
          tag_sha="$(api "git/tags/${tag_object_sha}" | jq -er 'select(.object.type == "commit") | .object.sha | select(test("^[0-9a-f]{40}$"))')" || {
            echo "Release authorization expired because the annotated tag ref is absent or invalid." >&2
            exit 1
          }
          if [[ "${APPROVED_SHA}" != "${tag_sha}" ]]; then
            echo "Release authorization expired because the tag moved." >&2
            exit 1
          fi

          expected_prerelease=true
          if [[ "${RELEASE_STABLE}" == true ]]; then
            expected_prerelease=false
          fi
          release="$(api "releases/${{ needs.release.outputs.release_id }}")"
          if ! jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg sha "${APPROVED_SHA}" \
            --argjson prerelease "${expected_prerelease}" '
              .tag_name == $tag and
              .name == $tag and
              .target_commitish == $sha and
              .prerelease == $prerelease and
              ((.draft == true and .published_at == null) or
               (.draft == false and (.published_at | type == "string" and length > 0)))
            ' <<<"${release}" >/dev/null; then
            echo "The GitHub Release is neither the expected validated draft nor its published form." >&2
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The effective OCI image digest is invalid: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          release_body="$(jq -er '.body | strings' <<<"${release}")"
          mapfile -t recorded_digests < <(sed -nE 's/^<!-- rivune-oci-image-digest: (sha256:[0-9a-f]{64}) -->$/\1/p' <<<"${release_body}")
          marker_mentions="$( (grep -oF '<!-- rivune-oci-image-digest:' <<<"${release_body}" || true) | wc -l)"
          if (( ${#recorded_digests[@]} != 1 )) ||
             [[ "${marker_mentions}" != 1 ]] ||
             [[ "${recorded_digests[0]}" != "${IMAGE_DIGEST}" ]]; then
            echo "The prepared GitHub Release does not record the effective OCI image digest exactly once." >&2
            exit 1
          fi
          expected_assets="$(printf '%s\n' SHA256SUMS rivune-update.json rivune-android-update.json "rivune-android-${RELEASE_TAG#v}.apk" "rivune-android-${RELEASE_TAG#v}-corresponding-source.tar.gz" Rivune.exe | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"${release}" | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "The prepared GitHub Release asset set is incomplete or contains unexpected files." >&2
            exit 1
          fi
      - name: Promote exact image, publish release, and promote mutable aliases
        env:
          PUBLISHED_EXACT_IMAGE_TAGS: ${{ steps.version.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
          PUBLISHED_MUTABLE_IMAGE_TAGS: ${{ steps.aliases.outputs.tags }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_STABLE: ${{ needs.authorize.outputs.stable }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The validated release ID is invalid: ${RELEASE_ID}" >&2
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The immutable multi-architecture image digest is invalid: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          prepared_release="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}")"
          prepared_body="$(jq -er '.body | strings' <<<"${prepared_release}")"
          mapfile -t prepared_digests < <(sed -nE 's/^<!-- rivune-oci-image-digest: (sha256:[0-9a-f]{64}) -->$/\1/p' <<<"${prepared_body}")
          marker_mentions="$( (grep -oF '<!-- rivune-oci-image-digest:' <<<"${prepared_body}" || true) | wc -l)"
          if (( ${#prepared_digests[@]} != 1 )) ||
             [[ "${marker_mentions}" != 1 ]] ||
             [[ "${prepared_digests[0]}" != "${IMAGE_DIGEST}" ]]; then
            echo "The GitHub Release no longer records the effective OCI image digest exactly once." >&2
            exit 1
          fi
          mapfile -t exact_image_tags < <(sed '/^$/d' <<<"${PUBLISHED_EXACT_IMAGE_TAGS}")
          mapfile -t mutable_image_tags < <(sed '/^$/d' <<<"${PUBLISHED_MUTABLE_IMAGE_TAGS:-}")
          if (( ${#exact_image_tags[@]} != 1 )); then
            echo "Expected exactly one immutable release-version image tag." >&2
            exit 1
          fi
          expected_mutable_tag_count=0
          prerelease=true
          make_latest=false
          if [[ "${RELEASE_STABLE}" == true ]]; then
            expected_mutable_tag_count=3
            prerelease=false
            make_latest=true
          fi
          if (( ${#mutable_image_tags[@]} != expected_mutable_tag_count )); then
            echo "Expected mutable major, major.minor, and latest aliases only for a stable release." >&2
            exit 1
          fi

          existing_exact_digest="$(docker buildx imagetools inspect "${exact_image_tags[0]}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ -n "${existing_exact_digest}" ]] && [[ "${existing_exact_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo "Immutable image tag ${exact_image_tags[0]} already resolves to a different digest." >&2
            exit 1
          fi
          if [[ -z "${existing_exact_digest}" ]]; then
            docker buildx imagetools create \
              --tag "${exact_image_tags[0]}" \
              "${IMAGE}@${IMAGE_DIGEST}"
          fi
          exact_digest="$(docker buildx imagetools inspect "${exact_image_tags[0]}" --format '{{.Manifest.Digest}}')"
          if [[ "${exact_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo "Immutable image tag ${exact_image_tags[0]} does not resolve to ${IMAGE_DIGEST}." >&2
            exit 1
          fi


          if jq -e '.draft == true' <<<"${prepared_release}" >/dev/null; then
            published_release="$(gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease="${prerelease}" \
              -f make_latest="${make_latest}")"
          else
            published_release="${prepared_release}"
          fi
          if ! jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg sha "${RELEASE_SHA}" \
            --argjson prerelease "${prerelease}" '
              .tag_name == $tag and
              .name == $tag and
              .target_commitish == $sha and
              .draft == false and
              .prerelease == $prerelease and
              (.published_at | type == "string" and length > 0)
            ' <<<"${published_release}" >/dev/null; then
            echo "Published release metadata does not match the authorized release." >&2
            exit 1
          fi

          if (( ${#mutable_image_tags[@]} > 0 )); then
            latest_stable_tag="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [[ "${latest_stable_tag}" == "${RELEASE_TAG}" ]]; then
              create_args=()
              for image_tag in "${mutable_image_tags[@]}"; do
                create_args+=(--tag "${image_tag}")
              done
              docker buildx imagetools create "${create_args[@]}" "${IMAGE}@${IMAGE_DIGEST}"
              for image_tag in "${mutable_image_tags[@]}"; do
                actual_digest="$(docker buildx imagetools inspect "${image_tag}" --format '{{.Manifest.Digest}}')"
                if [[ "${actual_digest}" != "${IMAGE_DIGEST}" ]]; then
                  echo "Mutable image alias ${image_tag} does not resolve to ${IMAGE_DIGEST}." >&2
                  exit 1
                fi
              done
            else
              echo "Skipping mutable aliases because ${RELEASE_TAG} is no longer the latest stable release."
            fi
          fi

          final_release="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}")"
          if ! jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg sha "${RELEASE_SHA}" \
            --argjson prerelease "${prerelease}" '
              .tag_name == $tag and
              .name == $tag and
              .target_commitish == $sha and
              .draft == false and
              .prerelease == $prerelease and
              (.published_at | type == "string" and length > 0)
            ' <<<"${final_release}" >/dev/null; then
            echo "Final published release metadata does not match the authorized release." >&2
            exit 1
          fi
          expected_assets="$(printf '%s\n' SHA256SUMS rivune-update.json rivune-android-update.json "rivune-android-${RELEASE_TAG#v}.apk" "rivune-android-${RELEASE_TAG#v}-corresponding-source.tar.gz" Rivune.exe | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"${final_release}" | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "Final published release asset set is incomplete or contains unexpected files." >&2
            exit 1
          fi
