name: Publish applications page

on:
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build public applications page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build public applications page
        working-directory: web
        env:
          RIVUNE_PUBLIC_APPS_BUILD: "1"
        run: npm run build
      - name: Mirror latest stable TV update assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${REPOSITORY}/releases/latest")"
          tag="$(jq -er '.tag_name | select(type == "string" and test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' <<<"${release}")"
          version="${tag#v}"
          if jq -ne --arg version "${version}" '($version | split(".") | map(tonumber)) < [1, 12, 0]' >/dev/null; then
            echo "Latest stable release ${tag} predates TV runtime updates; no mirror is required."
            exit 0
          fi
          target="server/internal/webui/dist/tv-runtime/${tag}"
          mkdir -p "${target}"
          for asset_name in rivune-update.json Rivune-TV-runtime.json; do
            asset_id="$(jq -er '[.assets[] | select(.name == $name and .state == "uploaded" and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))] | select(length == 1) | .[0].id' --arg name "${asset_name}" <<<"${release}")"
            gh api --header 'Accept: application/octet-stream' "repos/${REPOSITORY}/releases/assets/${asset_id}" > "${target}/${asset_name}"
            expected="$(jq -er '[.assets[] | select(.id == ($id | tonumber))] | select(length == 1) | .[0].digest' --arg id "${asset_id}" <<<"${release}")"
            actual="sha256:$(sha256sum "${target}/${asset_name}" | cut -d ' ' -f1)"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Mirrored ${asset_name} differs from the GitHub release digest." >&2
              exit 1
            fi
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: server/internal/webui/dist

  deploy:
    name: Deploy public applications page
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
