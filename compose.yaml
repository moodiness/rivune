services:
  server:
    image: ghcr.io/moodiness/rivune:${RIVUNE_VERSION:-latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RIVUNE_LISTEN_ADDRESS: ":8080"
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-65532}
      PGID: ${PGID:-65532}
      RIVUNE_VIDEO_GROUP_ID: ${RIVUNE_VIDEO_GROUP_ID:-}
      RIVUNE_PUBLIC_URL: ${RIVUNE_PUBLIC_URL:-http://localhost:8080}
      RIVUNE_TRUSTED_PROXIES: ${RIVUNE_TRUSTED_PROXIES:-}
      RIVUNE_NAT64_PREFIXES: ${RIVUNE_NAT64_PREFIXES:-}
      RIVUNE_JELLYFIN_ENABLED: ${RIVUNE_JELLYFIN_ENABLED:-false}
      RIVUNE_DATABASE_HOST: postgres
      RIVUNE_DATABASE_PORT: "5432"
      RIVUNE_DATABASE_NAME: rivune
      RIVUNE_DATABASE_USER: rivune
      RIVUNE_DATABASE_PASSWORD: ${RIVUNE_DATABASE_PASSWORD:?Set RIVUNE_DATABASE_PASSWORD in .env}
      RIVUNE_DATABASE_SSLMODE: disable
      RIVUNE_SETUP_TOKEN: ${RIVUNE_SETUP_TOKEN:?Set RIVUNE_SETUP_TOKEN in .env}
      RIVUNE_ACCESS_TOKEN_TTL: ${RIVUNE_ACCESS_TOKEN_TTL:-15m}
      RIVUNE_REFRESH_TOKEN_TTL: ${RIVUNE_REFRESH_TOKEN_TTL:-720h}
      RIVUNE_PROFILE_GRANT_TTL: ${RIVUNE_PROFILE_GRANT_TTL:-12h}
      RIVUNE_TMDB_ACCESS_TOKEN: ${RIVUNE_TMDB_ACCESS_TOKEN:-}
      RIVUNE_FANART_API_KEY: ${RIVUNE_FANART_API_KEY:-}
      RIVUNE_MDBLIST_API_KEY: ${RIVUNE_MDBLIST_API_KEY:-}
      RIVUNE_TVDB_API_KEY: ${RIVUNE_TVDB_API_KEY:-}
      RIVUNE_TVDB_PIN: ${RIVUNE_TVDB_PIN:-}
      RIVUNE_TRAKT_CLIENT_ID: ${RIVUNE_TRAKT_CLIENT_ID:-}
      RIVUNE_TRAKT_CLIENT_SECRET: ${RIVUNE_TRAKT_CLIENT_SECRET:-}
      RIVUNE_SIMKL_CLIENT_ID: ${RIVUNE_SIMKL_CLIENT_ID:-}
      RIVUNE_TRACKING_ENCRYPTION_KEY: ${RIVUNE_TRACKING_ENCRYPTION_KEY:-}
      RIVUNE_METADATA_CACHE_TTL: ${RIVUNE_METADATA_CACHE_TTL:-24h}
      RIVUNE_FFMPEG_PATH: ${RIVUNE_FFMPEG_PATH:-ffmpeg}
      RIVUNE_FFPROBE_PATH: ${RIVUNE_FFPROBE_PATH:-ffprobe}
      RIVUNE_REMUX_CONCURRENCY: ${RIVUNE_REMUX_CONCURRENCY:-2}
      RIVUNE_TRANSCODE_THREADS: ${RIVUNE_TRANSCODE_THREADS:-4}
      RIVUNE_TRANSCODE_MAX_BITRATE_KBPS: ${RIVUNE_TRANSCODE_MAX_BITRATE_KBPS:-12000}
      RIVUNE_HARDWARE_ACCELERATION: ${RIVUNE_HARDWARE_ACCELERATION:-auto}
      RIVUNE_VIDEO_DEVICE: ${RIVUNE_VIDEO_DEVICE:-/dev/dri/renderD128}
      RIVUNE_MEDIA_TEMP_DIR: ${RIVUNE_MEDIA_TEMP_DIR:-/tmp}
      RIVUNE_MEDIA_MAX_STORAGE_MB: ${RIVUNE_MEDIA_MAX_STORAGE_MB:-20480}
      RIVUNE_ARTWORK_CACHE_DIR: /var/lib/rivune/artwork
      RIVUNE_ARTWORK_MAX_STORAGE_MB: ${RIVUNE_ARTWORK_MAX_STORAGE_MB:-20480}
      RIVUNE_LAN_ARTWORK_ORIGINS: ${RIVUNE_LAN_ARTWORK_ORIGINS:-}
    ports:
      - "127.0.0.1:${RIVUNE_PORT:-8080}:8080"
    volumes:
      - artwork_cache:/var/lib/rivune/artwork
    stop_grace_period: 15s

  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    read_only: true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RIVUNE_POSTGRES_SUPERUSER_PASSWORD:?Set a bootstrap-only RIVUNE_POSTGRES_SUPERUSER_PASSWORD in .env}
      RIVUNE_DATABASE_PASSWORD: ${RIVUNE_DATABASE_PASSWORD:?Set RIVUNE_DATABASE_PASSWORD in .env}
      RIVUNE_RESTORE_PASSWORD: ${RIVUNE_RESTORE_PASSWORD:?Set a distinct RIVUNE_RESTORE_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres-init-rivune.sh:/docker-entrypoint-initdb.d/10-rivune.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivune -d rivune"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  artwork_cache:
