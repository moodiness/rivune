services:
  rivune:
    image: ghcr.io/moodiness/rivune:${RIVUNE_VERSION:-1.13.4}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 6G
          pids: 512
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RIVUNE_LISTEN_ADDRESS: ":8080"
      RIVUNE_PUBLIC_URL: ${RIVUNE_PUBLIC_URL:-http://localhost:8080}
      RIVUNE_TRUSTED_PROXIES: ${RIVUNE_TRUSTED_PROXIES:-172.31.0.0/24}
      RIVUNE_NAT64_PREFIXES: ${RIVUNE_NAT64_PREFIXES:-}
      RIVUNE_LAN_ARTWORK_ORIGINS: ${RIVUNE_LAN_ARTWORK_ORIGINS:-}
      RIVUNE_SEMANTIC_OLLAMA_URL: ${RIVUNE_SEMANTIC_OLLAMA_URL:-}
      RIVUNE_SEMANTIC_OLLAMA_MODEL: ${RIVUNE_SEMANTIC_OLLAMA_MODEL:-}
      RIVUNE_DATABASE_URL: ${RIVUNE_DATABASE_URL:-}
      RIVUNE_DATABASE_HOST: ${RIVUNE_DATABASE_HOST:-postgres}
      RIVUNE_DATABASE_PORT: ${RIVUNE_DATABASE_PORT:-5432}
      RIVUNE_DATABASE_NAME: ${RIVUNE_DATABASE_NAME:-rivune}
      RIVUNE_DATABASE_USER: ${RIVUNE_DATABASE_USER:-rivune}
      RIVUNE_DATABASE_PASSWORD: ${RIVUNE_DATABASE_PASSWORD:?Set RIVUNE_DATABASE_PASSWORD in .env}
      RIVUNE_DATABASE_SSLMODE: ${RIVUNE_DATABASE_SSLMODE:-disable}
      RIVUNE_DATABASE_SSLROOTCERT: ${RIVUNE_DATABASE_SSLROOTCERT:-}
      RIVUNE_SETUP_TOKEN: ${RIVUNE_SETUP_TOKEN:?Set RIVUNE_SETUP_TOKEN in .env}
      RIVUNE_ENCRYPTION_KEYS: ${RIVUNE_ENCRYPTION_KEYS:-}
      RIVUNE_MEDIA_TEMP_DIR: /var/lib/rivune/media
      PUID: ${PUID:-65532}
      PGID: ${PGID:-65532}

      # One-shot upgrade import only. The database always wins, and Rivune marks
      # the import complete even when these legacy inputs are empty. They are
      # never fallback runtime configuration; remove them from .env after upgrade.
      TZ: ${TZ:-}
      RIVUNE_JELLYFIN_ENABLED: ${RIVUNE_JELLYFIN_ENABLED:-}
      RIVUNE_JELLYFIN_DEBUG: ${RIVUNE_JELLYFIN_DEBUG:-}
      RIVUNE_ALLOW_TRANSCODING: ${RIVUNE_ALLOW_TRANSCODING:-}
      RIVUNE_HARDWARE_ACCELERATION: ${RIVUNE_HARDWARE_ACCELERATION:-}
      RIVUNE_TRANSCODE_MAX_BITRATE_KBPS: ${RIVUNE_TRANSCODE_MAX_BITRATE_KBPS:-}
      RIVUNE_MEDIA_MAX_STORAGE_MB: ${RIVUNE_MEDIA_MAX_STORAGE_MB:-}
      RIVUNE_ARTWORK_MAX_STORAGE_MB: ${RIVUNE_ARTWORK_MAX_STORAGE_MB:-}
      RIVUNE_TMDB_ACCESS_TOKEN: ${RIVUNE_TMDB_ACCESS_TOKEN:-}
      RIVUNE_FANART_API_KEY: ${RIVUNE_FANART_API_KEY:-}
      RIVUNE_MDBLIST_API_KEY: ${RIVUNE_MDBLIST_API_KEY:-}
      RIVUNE_TVDB_API_KEY: ${RIVUNE_TVDB_API_KEY:-}
      RIVUNE_TVDB_PIN: ${RIVUNE_TVDB_PIN:-}
      RIVUNE_TRAKT_CLIENT_ID: ${RIVUNE_TRAKT_CLIENT_ID:-}
      RIVUNE_TRAKT_CLIENT_SECRET: ${RIVUNE_TRAKT_CLIENT_SECRET:-}
      RIVUNE_SIMKL_CLIENT_ID: ${RIVUNE_SIMKL_CLIENT_ID:-}
      RIVUNE_TRACKING_ENCRYPTION_KEY: ${RIVUNE_TRACKING_ENCRYPTION_KEY:-}
    networks:
      - edge
      - database
    ports:
      - "${RIVUNE_BIND_ADDRESS:-127.0.0.1}:${RIVUNE_PORT:-8080}:8080"
    volumes:
      - artwork_cache:/var/lib/rivune/artwork
      - media_workspace:/var/lib/rivune/media
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-entrypoint.sh", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s

  discovery:
    image: ghcr.io/moodiness/rivune:${RIVUNE_VERSION:-1.13.4}
    profiles:
      - discovery
    restart: unless-stopped
    init: true
    user: "${PUID:-65532}:${PGID:-65532}"
    entrypoint:
      - /usr/local/bin/rivune
    command:
      - mdns
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    read_only: true
    network_mode: host
    environment:
      RIVUNE_DISCOVERY_URL: ${RIVUNE_DISCOVERY_URL:-}
      RIVUNE_DISCOVERY_NAME: ${RIVUNE_DISCOVERY_NAME:-Rivune}
    stop_grace_period: 5s

  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
    read_only: true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RIVUNE_POSTGRES_SUPERUSER_PASSWORD:?Set a bootstrap-only RIVUNE_POSTGRES_SUPERUSER_PASSWORD in .env}
      RIVUNE_DATABASE_PASSWORD: ${RIVUNE_DATABASE_PASSWORD:?Set RIVUNE_DATABASE_PASSWORD in .env}
      RIVUNE_RESTORE_PASSWORD: ${RIVUNE_RESTORE_PASSWORD:?Set a distinct RIVUNE_RESTORE_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres-init-rivune.sh:/docker-entrypoint-initdb.d/10-rivune.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivune -d rivune"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - database

volumes:
  postgres_data:
  artwork_cache:
  media_workspace:

networks:
  edge:
    name: rivune-edge
    ipam:
      config:
        - subnet: 172.31.0.0/24
  database:
    internal: true
