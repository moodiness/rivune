services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    cpus: ${RIVUNE_CADDY_CPU_LIMIT:-1.0}
    mem_limit: ${RIVUNE_CADDY_MEMORY_LIMIT:-256m}
    read_only: true
    depends_on:
      rivune:
        condition: service_healthy
    environment:
      RIVUNE_HOST: ${RIVUNE_HOST:?Set RIVUNE_HOST to the public DNS name}
    ports:
      - "${RIVUNE_HTTP_PORT:-80}:80"
      - "${RIVUNE_HTTPS_PORT:-443}:443"
      - "${RIVUNE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
    networks:
      - edge

  rivune:
    image: ghcr.io/moodiness/rivune:${RIVUNE_VERSION:-latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 512
    cpus: ${RIVUNE_CPU_LIMIT:-8.0}
    mem_limit: ${RIVUNE_MEMORY_LIMIT:-6g}
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RIVUNE_LISTEN_ADDRESS: ":8080"
      RIVUNE_PUBLIC_URL: https://${RIVUNE_HOST:?Set RIVUNE_HOST to the public DNS name}
      RIVUNE_TRUSTED_PROXIES: 172.30.0.0/24
      RIVUNE_JELLYFIN_ENABLED: ${RIVUNE_JELLYFIN_ENABLED:-false}
      RIVUNE_DATABASE_HOST: postgres
      RIVUNE_DATABASE_PORT: "5432"
      RIVUNE_DATABASE_NAME: rivune
      RIVUNE_DATABASE_USER: rivune
      RIVUNE_DATABASE_PASSWORD: ${RIVUNE_DATABASE_PASSWORD:?Set RIVUNE_DATABASE_PASSWORD}
      RIVUNE_DATABASE_SSLMODE: disable
      RIVUNE_SETUP_TOKEN: ${RIVUNE_SETUP_TOKEN:?Set RIVUNE_SETUP_TOKEN}
      RIVUNE_TMDB_ACCESS_TOKEN: ${RIVUNE_TMDB_ACCESS_TOKEN:-}
      RIVUNE_FANART_API_KEY: ${RIVUNE_FANART_API_KEY:-}
      RIVUNE_MDBLIST_API_KEY: ${RIVUNE_MDBLIST_API_KEY:-}
      RIVUNE_TVDB_API_KEY: ${RIVUNE_TVDB_API_KEY:-}
      RIVUNE_TVDB_PIN: ${RIVUNE_TVDB_PIN:-}
      RIVUNE_TRAKT_CLIENT_ID: ${RIVUNE_TRAKT_CLIENT_ID:-}
      RIVUNE_TRAKT_CLIENT_SECRET: ${RIVUNE_TRAKT_CLIENT_SECRET:-}
      RIVUNE_SIMKL_CLIENT_ID: ${RIVUNE_SIMKL_CLIENT_ID:-}
      RIVUNE_TRACKING_ENCRYPTION_KEY: ${RIVUNE_TRACKING_ENCRYPTION_KEY:-}
      RIVUNE_REMUX_CONCURRENCY: ${RIVUNE_REMUX_CONCURRENCY:-4}
      RIVUNE_TRANSCODE_THREADS: ${RIVUNE_TRANSCODE_THREADS:-4}
      RIVUNE_TRANSCODE_MAX_BITRATE_KBPS: ${RIVUNE_TRANSCODE_MAX_BITRATE_KBPS:-12000}
      RIVUNE_TRANSCODE_MAX_READ_RATE: ${RIVUNE_TRANSCODE_MAX_READ_RATE:-1.5}
      RIVUNE_HLS_INITIAL_BUFFER_SECONDS: ${RIVUNE_HLS_INITIAL_BUFFER_SECONDS:-6}
      RIVUNE_HARDWARE_ACCELERATION: ${RIVUNE_HARDWARE_ACCELERATION:-auto}
      RIVUNE_VIDEO_DEVICE: ${RIVUNE_VIDEO_DEVICE:-/dev/dri/renderD128}
      RIVUNE_MEDIA_TEMP_DIR: ${RIVUNE_MEDIA_TEMP_DIR:-/tmp}
      RIVUNE_MEDIA_MAX_STORAGE_MB: ${RIVUNE_MEDIA_MAX_STORAGE_MB:-4096}
      RIVUNE_ARTWORK_CACHE_DIR: /var/lib/rivune/artwork
      RIVUNE_ARTWORK_MAX_STORAGE_MB: ${RIVUNE_ARTWORK_MAX_STORAGE_MB:-20480}
      RIVUNE_LAN_ARTWORK_ORIGINS: ${RIVUNE_LAN_ARTWORK_ORIGINS:-}
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-65532}
      PGID: ${PGID:-65532}
    volumes:
      - artwork_cache:/var/lib/rivune/artwork
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=${RIVUNE_MEDIA_TMPFS_SIZE_MB:-4096}m
    healthcheck:
      test: ["CMD", "/usr/local/bin/rivune", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - database

  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    cpus: ${RIVUNE_POSTGRES_CPU_LIMIT:-2.0}
    mem_limit: ${RIVUNE_POSTGRES_MEMORY_LIMIT:-1g}
    read_only: true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RIVUNE_POSTGRES_SUPERUSER_PASSWORD:?Set a bootstrap-only RIVUNE_POSTGRES_SUPERUSER_PASSWORD}
      RIVUNE_DATABASE_PASSWORD: ${RIVUNE_DATABASE_PASSWORD:?Set RIVUNE_DATABASE_PASSWORD}
      RIVUNE_RESTORE_PASSWORD: ${RIVUNE_RESTORE_PASSWORD:?Set a distinct RIVUNE_RESTORE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../../scripts/postgres-init-rivune.sh:/docker-entrypoint-initdb.d/10-rivune.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivune -d rivune"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - database

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  database:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  artwork_cache:
